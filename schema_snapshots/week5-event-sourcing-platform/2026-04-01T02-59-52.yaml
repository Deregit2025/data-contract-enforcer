  event_id:
    description: Column event_id
    format: uuid
    required: true
    type: string
  event_type:
    business_rule: value must be non-null string in PascalCase format representing
      a past-tense domain event name; must be from predefined set of valid event types
      for the aggregate_type
    description: The type or category of domain event that occurred within the event
      sourcing system, representing a state change or significant action in the business
      process lifecycle
    required: true
    type: string
  metadata_correlation_id:
    business_rule: Must be a valid UUID (RFC 4122 format) in lowercase with hyphens;
      cannot be null or empty
    description: Unique identifier used to correlate and trace related events across
      distributed systems and services in the event sourcing platform
    format: uuid
    required: true
    type: string
  metadata_source_service:
    business_rule: value must be a non-empty string matching the pattern of service
