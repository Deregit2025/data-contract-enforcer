fields:
  aggregate_id:
    business_rule: Must be a valid UUID format (version 5 indicated by '5' in third
      segment); cannot be null; must be immutable once created
    description: Unique identifier for the aggregate entity that the event belongs
      to, representing the stream of events for a specific business object instance
