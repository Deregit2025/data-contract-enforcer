  payload_ready_at:
    description: Column payload_ready_at
    format: date-time
    required: false
    type: string
  payload_recommendation:
    business_rule: value must be one of predefined action codes (e.g., PROCEED, APPROVE,
      REJECT, REVIEW, ESCALATE); cannot be null or empty
    description: The recommended action or decision outcome from a risk assessment
      or compliance evaluation process, indicating whether to proceed with, approve,
      or take other action on a transaction or event
    required: false
    type: string
  payload_reextraction_recommended:
    business_rule: value must be boolean (True/False); typically set to True when
      payload_overall_confidence is below threshold or payload_is_coherent is False
    description: Boolean flag indicating whether the payload data should be re-extracted
      due to quality issues, low confidence scores, or incoherence detected during
      assessment
    required: false
    type: string
  payload_regulation_set_version:
    business_rule: value must follow format YYYY-Q[1-4] pattern (e.g., 2026-Q1) and
      represent a valid future or current quarter
    description: The version identifier of the regulation ruleset applied to evaluate
      compliance, formatted as a year and quarter period
    required: false
    type: string
  payload_remediation_available:
    business_rule: value must be boolean (True/False); typically True when payload_failure_reason
      is populated and the failure type is remediable
    description: Indicates whether remediation options are available to address the
      failure or issue that occurred in the event
    required: false
    type: string
  payload_requested_amount_usd:
    business_rule: value must be a positive number greater than 0, typically with
      up to 2 decimal places for cents
    description: The requested loan amount in US dollars for the application, representing
      the total funds the applicant is seeking
    required: false
    type: string
  payload_requested_at:
    description: Column payload_requested_at
    format: date-time
    required: false
    type: string
  payload_requested_by:
    business_rule: value must be a non-empty string, typically containing identifiers
      such as 'system', user IDs, service names, or application identifiers
    description: The actor or entity that initiated or requested the event, identifying
      who triggered the action in the event stream
    required: false
    type: string
  payload_revenue_trajectory:
    business_rule: 'value must be one of: STABLE, VOLATILE, RECOVERING, GROWTH, DECLINING'
    description: Indicates the revenue trend pattern for the entity being tracked,
      categorizing the financial trajectory into predefined states
    required: false
    type: string
  payload_risk_level:
    business_rule: 'value must be one of: ''LOW'', ''MEDIUM'', ''HIGH'', ''CRITICAL'';
      cannot be null'
    description: Risk level classification assigned to the event payload, indicating
      the severity or potential threat level of the transaction or activity being
      monitored
    required: false
    type: string
  payload_rule_id:
    business_rule: Must be a non-null string following pattern of uppercase prefix
      followed by hyphen and numeric sequence (e.g., 'REG-###')
    description: Unique identifier for a regulation or compliance rule referenced
      in the event payload
    required: false
    type: string
  payload_rule_name:
    business_rule: value must be a non-empty string representing a valid rule name
      from the regulatory framework; should correspond to a defined compliance rule
      in the rule catalog
    description: Name of the compliance or regulatory rule being evaluated or enforced,
      identifying specific regulatory requirements such as anti-money laundering checks,
      sanctions screening, or eligibility criteria
    required: false
    type: string
  payload_rule_version:
    business_rule: value must follow pattern YYYY-Q[1-4]-v[0-9]+ (e.g., 2026-Q1-v1)
    description: Version identifier for the payload rule applied during event processing,
      following a year-quarter-version format
    required: false
    type: string
  payload_rules_evaluated:
    business_rule: value must be a non-negative number; should equal payload_rules_passed
      + payload_rules_failed when both are present
    description: The total number of business rules that were evaluated during event
      processing, representing the sum of rules passed and rules failed
    maximum: 6.0
    minimum: 2.0
    required: false
    type: number
  payload_rules_failed:
    business_rule: value must be non-negative integer; value <= payload_rules_evaluated
    description: Number of validation rules that failed when evaluating the event
      payload
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_rules_noted:
    business_rule: value must be non-negative numeric; typically integer >= 0
    description: Number of validation rules that were noted (neither passed nor failed,
      typically warnings or informational findings) during event processing
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_rules_passed:
    business_rule: Must be a non-negative integer; should be less than or equal to
      payload_rules_evaluated
    description: The number of business or validation rules that successfully passed
      during event processing
    maximum: 5.0
    minimum: 1.0
    required: false
    type: number
  payload_screening_model_version:
    business_rule: value must be a non-empty string following the pattern 'claude-{model-name}-{version-date}'
      where version-date is in YYYYMMDD format
    description: Version identifier of the AI model used for screening or fraud detection
      analysis on event payloads
    required: false
    type: string
  payload_session_id:
    business_rule: Must follow format 'sess-doc-' followed by 8 alphanumeric characters;
      cannot be null or empty
    description: Unique identifier for a user or system session associated with the
      event, prefixed with 'sess-doc-' followed by an alphanumeric code
    required: false
    type: string
  payload_started_at:
    description: Column payload_started_at
    format: date-time
    required: false
    type: string
  payload_submission_channel:
    business_rule: value must be non-null and from enumerated list of valid submission
      channels (e.g., 'branch', 'web', 'mobile', 'phone', 'partner')
    description: The channel through which the loan application or payload was submitted
      by the customer, such as physical branch location, web portal, mobile app, or
      other submission methods
    required: false
    type: string
  payload_submitted_at:
    description: Column payload_submitted_at
    format: date-time
    required: false
    type: string
  payload_tables_extracted:
    business_rule: value must be a non-negative integer, typically between 0 and 20
    description: Number of tables extracted from the raw text payload during processing
    maximum: 5.0
    minimum: 2.0
    required: false
    type: number
  payload_term_months:
    business_rule: value must be a positive integer, typically in range [12, 360],
      common values are 24, 36, 48, 60, or 72 months
    description: The duration of the loan or payment term in months, typically representing
      the agreed-upon repayment period
    maximum: 60.0
    minimum: 24.0
    required: false
    type: number
  payload_tool_duration_ms:
    business_rule: value must be a positive number (float or integer), greater than
      0, typically ranging from hundreds to tens of thousands of milliseconds
    description: Duration in milliseconds that a tool execution took to complete,
      measuring the elapsed time from tool invocation to completion
    maximum: 7987.0
    minimum: 58.0
    required: false
    type: number
  payload_tool_input_summary:
    business_rule: 'value must be non-null string following pattern ''PDF extraction:
      {document_type}'' where document_type identifies the financial statement or
      document category'
    description: Summary or identifier of the input parameter provided to the extraction
      tool, indicating the type of document or data being processed (e.g., income
      statement, balance sheet)
    required: false
    type: string
  payload_tool_name:
    business_rule: value must be a non-empty string representing a valid tool name;
      appears to follow naming convention of 'week{N}_{tool_type}_pipeline'
    description: The name or identifier of the tool used in the extraction pipeline
      to process events, indicating which specific tool within the pipeline executed
      the operation
    required: false
    type: string
  payload_tool_output_summary:
    business_rule: value must be a non-empty string describing the tool's output result;
      typically follows pattern 'Extracted [number] [item type]'
    description: A summary or description of the output produced by a tool execution,
      indicating the number and type of items extracted or processed during the operation
    required: false
    type: string
  payload_total_cost_usd:
    business_rule: value must be a positive decimal number greater than or equal to
      0, typically between 0.001 and 1.0 for standard events, with precision up to
      5 decimal places
    description: Total cost in USD for processing the event payload, calculated based
      on LLM API usage including tokens consumed and API calls made
    maximum: 0.063
    minimum: 0.0
    required: false
    type: number
  payload_total_duration_ms:
    business_rule: value must be a non-negative number; typically greater than 0 for
      completed events
    description: Total duration in milliseconds for the event payload processing or
      execution time
    maximum: 54283.0
    minimum: 2456.0
    required: false
    type: number
  payload_total_llm_calls:
    business_rule: value must be a non-negative integer >= 0; typically >= 1 when
      LLM functionality is used
    description: The total number of calls made to Large Language Model (LLM) services
      during a workflow or process execution, tracking API invocations for monitoring
      usage and performance
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_total_nodes_executed:
    business_rule: value must be a positive integer greater than or equal to 1
    description: The total number of nodes executed in a workflow or process graph
      during an event, representing the count of execution steps or operations performed
    maximum: 7.0
    minimum: 3.0
    required: false
    type: number
  payload_total_tokens_used:
    business_rule: value must be a positive number; should be greater than 0 when
      payload_total_llm_calls > 0
    description: Total number of tokens consumed by language model API calls during
      the event execution, aggregating input and output tokens across all LLM interactions
    maximum: 6997.0
    minimum: 833.0
    required: false
    type: number
  payload_triggered_by_event_id:
    business_rule: Must be a valid hexadecimal string identifier; should reference
      an existing event_id in the event records
    description: Unique identifier of the upstream event that triggered or initiated
      this event, establishing causal relationship in the event chain
    required: false
    type: string
  payload_uploaded_at:
    description: Column payload_uploaded_at
    format: date-time
    required: false
    type: string
  payload_uploaded_by:
    business_rule: value must be a non-empty string representing a valid user role
      or actor type; based on samples, likely constrained to predefined roles such
      as 'applicant', 'reviewer', 'admin', etc.
    description: The role or user type of the person who uploaded the event payload
      file, indicating who initiated the file upload action
    required: false
    type: string
  payload_validated_at:
    description: Column payload_validated_at
    format: date-time
    required: false
    type: string
  payload_validation_duration_ms:
    business_rule: value must be a non-negative numeric value, typically between 0
      and 10000 milliseconds
    description: The duration in milliseconds taken to validate the event payload
    maximum: 275.0
    minimum: 41.0
    required: false
    type: number
  payload_written_at:
    description: Column payload_written_at
    format: date-time
    required: false
    type: string
  recorded_at:
    description: Column recorded_at
    format: date-time
    required: true
    type: string
  schema_version:
    business_rule: must be a positive integer, typically starts at 1 and increments
      with each schema change
    description: Version number of the event schema used to structure and validate
      the event data, enabling backward compatibility and schema evolution tracking
    required: true
    type: string
  sequence_number:
    business_rule: value must be a positive integer starting at 1, incrementing by
      1 for each subsequent event within the same aggregate_id, no gaps or duplicates
      allowed per aggregate
    description: Sequential order number of events within an aggregate instance, tracking
      the chronological position of each event in the event stream for a specific
      aggregate
    maximum: 13.0
    minimum: 1.0
    required: true
    type: integer
  stream_id:
    business_rule: 'value must match pattern: {entity_type}-{system_code}-{sequence_number}
      where entity_type is alphanumeric, system_code is uppercase alphanumeric, and
      sequence_number is zero-padded numeric; not null'
    description: Unique identifier for an event stream representing a business entity
      (loan or document package) with a prefix indicating the entity type followed
      by a system code (APEX) and sequence number
    required: true
    type: string
snapshot_id: week5-event-sourcing-platform
