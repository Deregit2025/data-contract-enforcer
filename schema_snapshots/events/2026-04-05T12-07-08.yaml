    description: Boolean flag indicating whether an adverse action notice is legally
      required to be sent to the customer following a negative decision (such as a
      decline or denial)
    required: false
    type: string
  payload_agent_id:
    business_rule: value must be a non-empty string following the pattern '[prefix]-agent-[number]'
      or similar identifier format
    description: Unique identifier for the agent that generated or handled the event,
      typically in a documentation or conversational AI system
    required: false
    type: string
  payload_agent_type:
    business_rule: value must be a non-empty string representing a valid agent type
