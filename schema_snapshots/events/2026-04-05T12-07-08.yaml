fields:
  aggregate_id:
    business_rule: Must be a valid UUID (version 4 format), cannot be null, must exist
      for every event
    description: Unique identifier for the aggregate entity that the event is associated
      with, used to group related events together in an event sourcing pattern
    required: true
    type: string
  aggregate_type:
    business_rule: value must be a non-empty string representing a valid aggregate
      type name; appears to consistently contain 'LoanApplication' values
    description: The type or category of domain aggregate that the event belongs to
      in the event sourcing system, representing the entity being tracked
    required: true
    type: string
  event_id:
    description: Column event_id
    format: uuid
    required: true
    type: string
  event_type:
    business_rule: value must be a non-empty string from a predefined set of valid
      event types (e.g., ApplicationSubmitted, DocumentUploadRequested, PackageCreated);
      typically follows PascalCase naming convention
    description: The type or category of event that occurred in the system, representing
      specific actions or state changes in a business process workflow
    required: true
    type: string
  metadata_correlation_id:
    business_rule: Must be a valid UUID (version 4) format with lowercase hexadecimal
      characters and hyphens in pattern 8-4-4-4-12
    description: Unique identifier used to correlate and trace related events across
      distributed systems and services
    format: uuid
    required: true
    type: string
  metadata_source_service:
    business_rule: value must be a non-empty string, typically following a naming
      convention pattern like 'week[N]-event-sourcing-platform'
    description: The name or identifier of the source service/platform that generated
      or published the event
    required: true
    type: string
  metadata_user_id:
    business_rule: value must be non-empty string; accepts either user identifiers
      (e.g. COMP-XXX format) or system literal for automated processes
    description: Identifier of the user or system entity that triggered or created
      the event
    required: true
    type: string
  occurred_at:
    description: Column occurred_at
    format: date-time
    required: true
    type: string
  payload_added_at:
    description: Column payload_added_at
    format: date-time
    required: false
    type: string
  payload_adverse_action_notice_required:
    business_rule: value must be boolean (True/False); typically True when payload_declined_by
