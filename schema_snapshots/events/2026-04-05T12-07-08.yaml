  payload_remediation_available:
    business_rule: Must be a boolean value (True or False)
    description: Indicates whether remediation options are available to resolve the
      issue or failure that occurred in the event
    required: false
    type: string
  payload_requested_amount_usd:
    business_rule: value must be positive numeric, typically greater than 0, may contain
      decimal places for cents
    description: The loan amount requested by the applicant in US dollars for the
      application event
    required: false
    type: string
  payload_requested_at:
    description: Column payload_requested_at
    format: date-time
    required: false
    type: string
  payload_requested_by:
    business_rule: value must be a non-empty string representing a valid requester
      identifier
    description: The user or system entity that requested or initiated the event
    required: false
    type: string
  payload_revenue_trajectory:
    business_rule: 'value must be one of: STABLE, VOLATILE, RECOVERING, GROWTH, DECLINE'
    description: Categorical indicator of the revenue trend pattern for the event
      payload, representing the financial trajectory status
    required: false
    type: string
  payload_risk_level:
    business_rule: 'value must be one of: LOW, MEDIUM, HIGH, CRITICAL; cannot be null'
    description: Risk classification level assigned to the event payload, indicating
      the severity or likelihood of fraudulent or anomalous activity
    required: false
    type: string
  payload_rule_id:
    business_rule: value must be non-null string following pattern of alphanumeric
      code with hyphen separator (e.g. REG-###), typically 3-20 characters in length
    description: Unique identifier for a regulatory or business rule that triggered
      or is associated with the event, following a standardized rule identification
      format
    required: false
    type: string
  payload_rule_name:
    business_rule: value must be non-empty string; should correspond to a valid rule
      name in the regulatory framework
    description: The name of the compliance or regulatory rule that triggered or is
      associated with this event, indicating which specific policy or regulation was
      evaluated
    required: false
    type: string
  payload_rule_version:
    business_rule: Must follow format YYYY-Q#-v# where YYYY is year, Q# is quarter
      (1-4), and v# is version number
    description: Version identifier for the payload rule, indicating the quarter and
      iteration of the rule definition used during event processing
    required: false
    type: string
  payload_rules_evaluated:
    business_rule: value must be a non-negative integer; should equal the sum of payload_rules_passed
      and payload_rules_failed
    description: The total number of rules that were evaluated or processed during
      the event, likely representing validation or business logic rules applied to
      the payload
    maximum: 6.0
    minimum: 2.0
    required: false
    type: number
  payload_rules_failed:
    business_rule: value must be a non-negative number; value <= payload_rules_evaluated;
      payload_rules_failed + payload_rules_passed + payload_rules_noted = payload_rules_evaluated
    description: Number of payload validation rules that failed during event processing
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_rules_noted:
    business_rule: value must be non-negative numeric; typically integer or float
      representing count
    description: Number of rules that were noted (informational/warning level) during
      payload validation, not blocking but flagged for attention
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_rules_passed:
    business_rule: value must be a non-negative integer; should be less than or equal
      to payload_rules_evaluated
    description: The number of business rules or validation checks that successfully
      passed during event processing
    maximum: 5.0
    minimum: 1.0
    required: false
    type: number
  payload_screening_model_version:
    business_rule: value must be a non-empty string following the pattern of model-name
      followed by ISO date format (YYYYMMDD)
    description: The version identifier of the machine learning model used for screening
      or fraud detection analysis on the payload
    required: false
    type: string
  payload_session_id:
    business_rule: Must follow format 'sess-{product/type}-{alphanumeric hash}', non-null,
      typically 8 character hash suffix
    description: Unique identifier for a user or system session, tracking a sequence
      of related events or interactions within the application
    required: false
    type: string
  payload_started_at:
    description: Column payload_started_at
    format: date-time
    required: false
    type: string
  payload_submission_channel:
    business_rule: 'value must be one of predefined channels: ''web'', ''branch'',
      ''mobile'', ''phone'', ''partner''; not null'
    description: The channel or medium through which the loan application or event
      payload was submitted by the user
    required: false
    type: string
  payload_submitted_at:
    description: Column payload_submitted_at
    format: date-time
    required: false
    type: string
  payload_tables_extracted:
    business_rule: value must be a non-negative integer
    description: Number of tables extracted from the payload during processing
    maximum: 5.0
    minimum: 2.0
    required: false
    type: number
  payload_term_months:
    business_rule: value must be a positive number, typically in increments of 12
      (12, 24, 36, 48, 60), representing standard loan term periods
    description: The loan or payment term duration expressed in months
    maximum: 60.0
    minimum: 24.0
    required: false
    type: number
  payload_tool_duration_ms:
    business_rule: value must be a non-negative number; typically between 0 and 300000
      (5 minutes); null allowed if tool was not executed
    description: Duration in milliseconds that a tool took to execute, measured from
      invocation to completion
    maximum: 7987.0
    minimum: 58.0
    required: false
    type: number
  payload_tool_input_summary:
    business_rule: 'value must follow pattern ''PDF extraction: {document_type}''
      where document_type is a non-empty string'
    description: Summary or identifier of the input provided to a PDF extraction tool,
      indicating the type of financial document being processed (e.g., income statement,
      balance sheet)
    required: false
    type: string
  payload_tool_name:
    business_rule: value must be a non-empty string following naming pattern '[stage]_[process]_[type]'
    description: Name of the tool or pipeline used to process the event, typically
      identifying a specific extraction or processing workflow
    required: false
    type: string
  payload_tool_output_summary:
    business_rule: Non-empty string value that summarizes the tool's output; commonly
      follows pattern 'Extracted [count] [item type]'
    description: Summary text describing the output result of a tool execution, typically
      indicating the number and type of items extracted or processed
    required: false
    type: string
  payload_total_cost_usd:
    business_rule: value must be non-negative numeric with precision up to 5 decimal
      places; typically ranges between 0.001 and 10.0 for standard operations
    description: The total cost in US dollars for the payload processing, calculated
      based on LLM API usage including tokens consumed and API calls made
    maximum: 0.063
    minimum: 0.0
    required: false
    type: number
  payload_total_duration_ms:
    business_rule: value must be a non-negative number (float or integer), typically
      greater than 0 for completed events
    description: Total duration in milliseconds for the payload execution or processing
      time from start to completion
    maximum: 54283.0
    minimum: 2456.0
    required: false
    type: number
  payload_total_llm_calls:
    business_rule: value must be a non-negative integer; should be >= 1 when payload_total_tokens_used
      > 0
    description: Total number of Large Language Model API calls made during the event
      execution
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_total_nodes_executed:
    business_rule: value must be a positive integer greater than or equal to 1
    description: The total number of nodes executed in a workflow or graph-based process
      during an event, likely tracking the execution path through a decision tree,
      AI agent workflow, or computational graph
    maximum: 7.0
    minimum: 3.0
    required: false
    type: number
  payload_total_tokens_used:
    business_rule: value must be a positive number, typically an integer or float
      greater than 0
    description: Total number of tokens consumed during the execution of an event,
      representing the cumulative token usage across all LLM calls made
    maximum: 6997.0
    minimum: 833.0
    required: false
    type: number
  payload_triggered_by_event_id:
    business_rule: Must be a valid hexadecimal string identifier; nullable for root/initial
      events that are not triggered by other events
    description: Unique identifier of the upstream event that triggered or initiated
      the current event in the event chain
    required: false
    type: string
  payload_uploaded_at:
    description: Column payload_uploaded_at
    format: date-time
    required: false
    type: string
  payload_uploaded_by:
    business_rule: value must be a valid user role identifier; non-null string
    description: The role or type of user who uploaded the file payload associated
      with this event
    required: false
    type: string
  payload_validated_at:
    description: Column payload_validated_at
    format: date-time
    required: false
    type: string
  payload_validation_duration_ms:
    business_rule: value must be a non-negative number; typically between 0 and 10000
      ms for normal operations
    description: The duration in milliseconds taken to validate the event payload
    maximum: 275.0
    minimum: 41.0
    required: false
    type: number
  payload_written_at:
    description: Column payload_written_at
    format: date-time
    required: false
    type: string
  recorded_at:
    description: Column recorded_at
    format: date-time
    required: true
    type: string
  schema_version:
    business_rule: value must be a positive integer string representing the schema
      version number
    description: Version number of the event schema format used to structure the event
      data, allowing for backward compatibility and schema evolution tracking
    required: true
    type: string
  sequence_number:
    business_rule: Must be a positive integer starting from 1, incrementing sequentially
      for each event within the same aggregate_id
    description: Sequential order number of events within an aggregate, tracking the
      chronological position of each event in the event stream for a specific aggregate
      instance
    maximum: 13.0
    minimum: 1.0
    required: true
    type: integer
  stream_id:
    business_rule: 'Format must match pattern: {entity_type}-{system}-{sequence_number},
      where entity_type is ''loan'' or ''docpkg'', system is uppercase alphanumeric
      (e.g. ''APEX''), and sequence_number is zero-padded numeric'
    description: Unique identifier for the business entity stream, representing either
      a loan or document package, prefixed with entity type and system identifier
    required: true
    type: string
snapshot_id: events
