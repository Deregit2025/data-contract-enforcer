fields:
  doc_id:
    description: Column doc_id
    required: true
    type: string
  doc_name:
    business_rule: Must be a non-empty string; typically follows pattern of descriptive
      title with optional year suffix in format YYYY or YYYY-YY
    description: Name or title of the document from which data was extracted, typically
      representing reports, audits, surveys or official publications with year identifiers
    required: true
    type: string
  entities_count:
    business_rule: value must be a non-negative integer; typically greater than 0
      for successfully processed documents
    description: The count of distinct entities extracted from a document during the
      extraction process, such as people, organizations, locations, or other named
      entities identified by the extraction model
    maximum: 24.0
    minimum: 2.0
    required: true
    type: integer
  extracted_at:
    description: Column extracted_at
    format: date-time
    required: true
    type: string
  extracted_facts_confidence_max:
    business_rule: value must be numeric between 0 and 100 inclusive; should be greater
      than or equal to extracted_facts_confidence_mean and extracted_facts_confidence_min
    description: The maximum confidence score across all facts extracted from a document,
      representing the highest level of certainty for any individual extracted fact,
      measured on a scale from 0 to 100
    maximum: 1.0
    minimum: 0.0
    required: true
    type: number
  extracted_facts_confidence_mean:
    business_rule: value must be a numeric type between 0 and 100 inclusive; should
      be NULL if extracted_facts_count is 0 or NULL
    description: The arithmetic mean (average) of confidence scores across all facts
      extracted from a document, representing the overall confidence level of the
      extraction process
    maximum: 1.0
    minimum: 0.0
    required: true
    type: number
  extracted_facts_confidence_min:
    business_rule: value must be a number between 0 and 100; should be less than or
      equal to extracted_facts_confidence_mean and extracted_facts_confidence_max;
      should be null only when extracted_facts_count is 0 or null
    description: The minimum confidence score among all facts extracted from a document,
      representing the lowest certainty level of any individual fact extraction, expressed
      as a percentage
    maximum: 1.0
    minimum: 0.0
    required: true
    type: number
  extracted_facts_count:
    business_rule: value must be a non-negative integer; should be greater than 0
      for successfully processed documents
    description: The total number of facts extracted from a source document during
      the refinement process
    maximum: 13.0
    minimum: 3.0
    required: true
    type: integer
  extracted_facts_page_ref_max:
    business_rule: value must be a positive integer greater than or equal to extracted_facts_page_ref_min
      and extracted_facts_page_ref_mean
    description: Maximum page reference number among all facts extracted from the
      document, indicating the highest page number where extracted facts were found
    maximum: 50.0
    minimum: 5.0
    required: true
    type: integer
  extracted_facts_page_ref_mean:
    business_rule: value must be a positive decimal number greater than or equal to
      1, and should be between extracted_facts_page_ref_min and extracted_facts_page_ref_max
    description: The mean (average) page reference number across all extracted facts
      from a document, indicating the typical page location where facts were found
    maximum: 39.8333
    minimum: 4.1429
    required: true
    type: number
  extracted_facts_page_ref_min:
    business_rule: value must be a positive integer greater than or equal to 1, representing
      a valid page number
    description: The minimum page reference number from which facts were extracted
      in a document, indicating the earliest page in the document where data extraction
      occurred
    maximum: 35.0
    minimum: 1.0
    required: true
    type: integer
  extraction_model:
    business_rule: value must be a valid model identifier string in format 'model-name-YYYY-MM-DD'
      and not null
    description: The specific version of the AI model used to extract data from documents,
      typically an OpenAI GPT model identifier
    required: true
    type: string
  is_synthetic:
    business_rule: value must be boolean (True/False)
    description: Boolean flag indicating whether the extracted document or record
      was synthetically generated rather than being a real/original document
    required: false
    type: string
  processing_time_ms:
    description: Column processing_time_ms
    maximum: 59916.0
    minimum: 8614.0
    required: true
    type: integer
  source_hash:
    description: Column source_hash
    pattern: ^[a-f0-9]{64}$
    required: true
    type: string
  source_path:
    description: Column source_path
    required: true
    type: string
  token_count_input:
    business_rule: value must be positive integer greater than 0
    description: Number of tokens in the input document submitted for extraction processing
    maximum: 7982.0
    minimum: 3099.0
    required: true
    type: integer
  token_count_output:
    business_rule: value must be a positive integer greater than 0
    description: Number of tokens in the output generated by the document extraction
      process
    maximum: 2147.0
    minimum: 447.0
    required: true
    type: integer
