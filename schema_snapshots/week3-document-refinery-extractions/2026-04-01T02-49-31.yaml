    required: true
    type: integer
  extracted_at:
    description: Column extracted_at
    format: date-time
    required: true
    type: string
  extracted_facts_confidence_max:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive; should be
      greater than or equal to extracted_facts_confidence_mean and extracted_facts_confidence_min
    description: Maximum confidence score across all facts extracted from a document,
      representing the highest certainty level the extraction model had for any single
      fact
    maximum: 1.0
    minimum: 0.0
    required: true
    type: number
  extracted_facts_confidence_mean:
    business_rule: value must be a decimal between 0 and 1 inclusive; should be greater
      than or equal to extracted_facts_confidence_min and less than or equal to extracted_facts_confidence_max
    description: The average confidence score of all facts extracted from a document,
      representing the mean certainty level across all extracted data points
    maximum: 1.0
    minimum: 0.0
    required: true
    type: number
  extracted_facts_confidence_min:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive; should be
      less than or equal to extracted_facts_confidence_mean and extracted_facts_confidence_max;
      should be null if extracted_facts_count is 0
    description: The minimum confidence score among all facts extracted from a document,
      representing the lowest certainty level for any individual fact extraction in
      the record
    maximum: 1.0
    minimum: 0.0
    required: true
    type: number
  extracted_facts_count:
    business_rule: value must be a non-negative integer; should be 0 or greater
    description: The total number of facts extracted from a source document during
