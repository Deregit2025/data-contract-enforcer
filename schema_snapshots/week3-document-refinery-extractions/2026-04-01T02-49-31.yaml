    description: Maximum page reference number among all extracted facts from the
      document, indicating the highest page number where facts were found
    maximum: 50.0
    minimum: 5.0
    required: true
    type: integer
  extracted_facts_page_ref_mean:
    business_rule: value must be a positive number; should be >= extracted_facts_page_ref_min
      and <= extracted_facts_page_ref_max when those columns are populated
    description: The average (mean) page reference number across all facts extracted
      from a document, indicating the typical page location where facts were found
    maximum: 39.8333
    minimum: 4.1429
    required: true
    type: number
  extracted_facts_page_ref_min:
    business_rule: value must be a positive integer greater than or equal to 1, not
      null when facts are extracted
    description: The minimum page reference number from which facts were extracted
