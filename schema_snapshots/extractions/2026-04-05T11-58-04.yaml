    description: The arithmetic mean (average) of page reference numbers where facts
      were extracted from a document
    maximum: 39.8333
    minimum: 4.1429
    required: true
    type: number
  extracted_facts_page_ref_min:
    business_rule: Must be a positive integer greater than or equal to 1; must be
      less than or equal to extracted_facts_page_ref_max
