captured_at: '2026-04-05T11:58:43.090138+00:00'
fields:
  captured_at:
    description: Column captured_at
    format: date-time
    required: true
    type: string
  codebase_root:
    business_rule: 'Must be a valid absolute file path string; should exist and be
      accessible; typically follows OS-specific path conventions (Windows: drive letter
      with backslashes, Unix: forward slashes from root)'
    description: The root directory path of the codebase being tracked in the lineage
      snapshot, representing the absolute file system location where the code repository
      resides
    required: true
    type: string
  edges_confidence_max:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive, and must
      be greater than or equal to edges_confidence_mean and edges_confidence_min
    description: Maximum confidence score among all lineage edges in the snapshot,
      representing the highest level of certainty in data lineage connections at the
      time of capture
    maximum: 1.0
    minimum: 0.0
    required: true
    type: number
  edges_confidence_mean:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive; must be
      greater than or equal to edges_confidence_min and less than or equal to edges_confidence_max
    description: The average confidence score of all lineage edges in the snapshot,
      representing the mean level of certainty or trust in the data lineage relationships
    maximum: 1.0
    minimum: 0.0
    required: true
    type: number
  edges_confidence_min:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive; must be
      less than or equal to edges_confidence_mean and edges_confidence_max
    description: The minimum confidence score among all lineage edges in the snapshot,
      representing the lowest confidence level of any data lineage relationship captured
      at that point in time
    maximum: 1.0
    minimum: 0.0
    required: true
    type: number
  edges_count:
    business_rule: value must be a non-negative integer; should be 0 or greater
    description: The total number of edges (relationships or dependencies) in the
      lineage graph snapshot at a specific git commit
    maximum: 87.0
    minimum: 87.0
    required: true
    type: integer
  git_commit:
    business_rule: must be a valid 40-character hexadecimal SHA-1 hash
    description: Git commit hash identifier associated with the lineage snapshot,
      representing the version of the codebase at the time the snapshot was taken
    required: true
    type: string
  nodes_count:
    business_rule: value must be a positive integer greater than or equal to 0
    description: The total number of nodes (entities or components) present in the
      lineage graph at the time of the snapshot
    maximum: 51.0
    minimum: 51.0
    required: true
    type: integer
  snapshot_id:
    business_rule: value must be a valid UUID format (8-4-4-4-12 hexadecimal pattern);
      must be unique; cannot be null
    description: Unique identifier for each lineage snapshot record, represented as
      a UUID (Universally Unique Identifier) that tracks a specific point-in-time
      capture of codebase lineage information
    format: uuid
    required: true
    type: string
snapshot_id: lineage-snapshots
