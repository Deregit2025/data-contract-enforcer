kind: DataContract
lineage:
  downstream: []
  upstream: []
llm_annotations:
  code_refs_confidence_max:
    business_rule: value must be a decimal between 0 and 1 inclusive; must be greater
      than or equal to code_refs_confidence_mean and code_refs_confidence_min
    cross_column_relationship: must be >= code_refs_confidence_mean; must be >= code_refs_confidence_min;
      null only if no code references exist for the intent
    description: Maximum confidence score across all code references associated with
      an intent record, representing the highest probability that a code reference
      correctly maps to the intent
  code_refs_confidence_mean:
    business_rule: value must be a decimal between 0 and 1 inclusive; must be greater
      than or equal to code_refs_confidence_min and less than or equal to code_refs_confidence_max
    cross_column_relationship: 'must satisfy: code_refs_confidence_min <= code_refs_confidence_mean
      <= code_refs_confidence_max; null if no code references exist'
    description: Average confidence score across all code references associated with
      an intent record, representing the mean certainty level of code reference mappings
  code_refs_confidence_min:
    business_rule: value must be a decimal between 0 and 1 inclusive, typically >=
      0.5 for valid references
    cross_column_relationship: must be <= code_refs_confidence_mean and <= code_refs_confidence_max;
      null if no code references exist or when code_refs_count = 0
    description: The minimum confidence score across all code references associated
      with an intent record, representing the lowest probability that a detected code
      reference is valid
  code_refs_count:
    business_rule: value must be a non-negative integer
    cross_column_relationship: when code_refs_count is 0, code_refs_line_start_mean
      and code_refs_line_start_min should be null; when code_refs_count > 0, these
      statistical columns should have values
    description: The total number of code references associated with this intent record
  code_refs_line_end_max:
    business_rule: value must be a positive integer greater than 0; should be greater
      than or equal to code_refs_line_end_mean and code_refs_line_end_min
    cross_column_relationship: must be >= code_refs_line_end_mean and >= code_refs_line_end_min;
      typically represents the ending line of the longest code segment referenced
    description: Maximum line number referenced in code across all code references
      associated with this intent record
  code_refs_line_end_mean:
    business_rule: value must be a positive number; should be >= code_refs_line_end_min
      and <= code_refs_line_end_max
    cross_column_relationship: must be >= code_refs_line_start_mean; must fall between
      code_refs_line_end_min and code_refs_line_end_max; should be >= corresponding
      code_refs_line_start values
    description: The average (mean) ending line number across all code references
      associated with an intent record
  code_refs_line_end_min:
    business_rule: value must be a positive number; must be greater than or equal
      to the corresponding line start value; typically an integer representing a line
      number
    cross_column_relationship: must be >= code_refs_line_start_max (or corresponding
      line_start_min); should be <= code_refs_line_end_max and code_refs_line_end_mean;
      represents the lower bound of the line end range
    description: The minimum ending line number among all code references associated
      with an intent record, representing the earliest end point of code spans referenced
  code_refs_line_start_max:
    business_rule: value must be a positive number; must be greater than or equal
      to code_refs_line_start_mean and code_refs_line_start_min when those values
      are present
    cross_column_relationship: must be >= code_refs_line_start_mean; must be >= code_refs_line_start_min;
      should be <= code_refs_line_end_max if that column exists
    description: The maximum line number where a code reference starts within the
      intent record, representing the highest starting line position across all code
      references associated with this intent
  code_refs_line_start_mean:
    business_rule: value must be a positive number; must be >= code_refs_line_start_min
      and <= code_refs_line_start_max when code_refs_count > 0
    cross_column_relationship: only populated when code_refs_count > 0; must fall
      between code_refs_line_start_min and code_refs_line_start_max (inclusive); calculated
      as the arithmetic mean of all code reference starting line numbers
    description: The average (mean) starting line number across all code references
      associated with this intent record
  code_refs_line_start_min:
    business_rule: value must be a positive number (>= 1.0) when code references exist;
      should be less than or equal to code_refs_line_start_mean and code_refs_line_start_max
    cross_column_relationship: 'must be null when code_refs_count is 0 or null; when
      not null, must satisfy: code_refs_line_start_min <= code_refs_line_start_mean
      <= code_refs_line_start_max'
    description: The minimum starting line number among all code references associated
      with an intent record
  description:
    business_rule: Must be a non-empty string with length between 1 and 500 characters
    cross_column_relationship: References code segments indicated by code_refs_count;
      when code_refs_count > 0, code_refs_line_start_mean should also have a valid
      numeric value
    description: A human-readable text description of the development intent or task
      being tracked, such as feature implementation, API creation, or code refactoring
      work
  governance_tags_count:
    business_rule: value must be a non-negative integer (>= 0)
    cross_column_relationship: likely relates to a separate governance_tags table
      or array; count may correlate with status (e.g., approved records may require
      governance_tags_count > 0)
    description: The count of governance tags associated with an intent record, indicating
      how many governance classifications or labels have been applied for compliance,
      security, or policy management purposes
  intent_id:
    business_rule: Must be unique and non-null; accepts either formatted string pattern
      (INT-XXX) or UUID format (8-4-4-4-12 hexadecimal)
    cross_column_relationship: Primary key that may be referenced by code_refs_count
      to track number of code references; links to description field for intent details
    description: Unique identifier for each intent record, serving as the primary
      key to distinguish individual intents in the system
  is_synthetic:
    business_rule: value must be boolean (True or False)
    cross_column_relationship: may correlate with status field to filter out synthetic
      records from production analytics; vcs_revision may indicate data generation
      version for synthetic records
    description: Flag indicating whether the intent record was synthetically generated
      (artificial/test data) rather than originating from real user interactions
  status:
    business_rule: 'value must be one of: ''IN_PROGRESS'', ''COMPLETED'''
    cross_column_relationship: When status is 'COMPLETED', created_at must be populated
      and vcs_revision should be set
    description: Current processing state of the intent record, indicating whether
      the record is still being processed or has finished
  vcs_revision:
    business_rule: value must be a valid 40-character hexadecimal SHA-1 hash string
      or null
    cross_column_relationship: should be populated when is_synthetic is false; may
      be null for synthetic test data records
    description: Version control system commit hash or revision identifier that tracks
      the code version associated with this intent record
quality:
  specification:
    checks for intent-records:
