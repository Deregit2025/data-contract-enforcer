info:
  description: Auto-generated contract for Intent Records. Generated at 2026-04-05T13:40:42.204111+00:00.
  owner: intent
  title: Intent Records
  version: 1.0.0
kind: DataContract
lineage:
  downstream: []
  upstream: []
llm_annotations:
  code_refs_confidence_max:
    business_rule: value must be a decimal between 0 and 1 inclusive; must be greater
      than or equal to code_refs_confidence_mean and code_refs_confidence_min
    cross_column_relationship: must be >= code_refs_confidence_mean; must be >= code_refs_confidence_min;
      null only if no code references exist
    description: Maximum confidence score across all code references associated with
      an intent record, representing the highest certainty level of code linkages
  code_refs_confidence_mean:
    business_rule: value must be a decimal between 0 and 1 inclusive, and should equal
      the arithmetic mean of all confidence scores for the intent's code references
    cross_column_relationship: must be >= code_refs_confidence_min and <= code_refs_confidence_max;
      value is null if no code references exist for the intent
    description: The average confidence score across all code reference annotations
      associated with an intent record, indicating the mean certainty level of code
      mappings
  code_refs_confidence_min:
    business_rule: value must be a decimal between 0 and 1 inclusive; typically >=
      0.5 for valid code references
    cross_column_relationship: must be <= code_refs_confidence_mean and <= code_refs_confidence_max;
      null if no code references exist for the intent record
    description: The minimum confidence score across all code references associated
      with an intent record, indicating the lowest certainty level that a particular
      code segment is correctly linked to the intent
  code_refs_count:
    business_rule: value must be a non-negative integer
    cross_column_relationship: when code_refs_count is 0, code_refs_line_start_mean
      and code_refs_line_start_min should be null; when code_refs_count > 0, these
      columns should have valid values
    description: The total number of code references associated with each intent record
  code_refs_line_end_max:
    business_rule: Must be a positive integer; should be greater than or equal to
      code_refs_line_end_mean and code_refs_line_end_min when those columns are not
      null
    cross_column_relationship: Must be >= code_refs_line_end_mean and >= code_refs_line_end_min;
      likely corresponds to line_start values in code reference records
    description: Maximum line number where code references end within an intent record,
      representing the highest ending line across all code references
  code_refs_line_end_mean:
    business_rule: value must be a positive number; typically >= 1 and >= code_refs_line_start_mean
      if that column exists
    cross_column_relationship: should be >= code_refs_line_end_min and <= code_refs_line_end_max;
      should be >= corresponding line_start values for the same code reference
    description: The mean (average) ending line number of code references associated
      with an intent record
  code_refs_line_end_min:
    business_rule: Must be a positive number; should be greater than or equal to the
      corresponding line start value; represents an actual line number in source code
    cross_column_relationship: Should be >= code_refs_line_start_max when code spans
      exist; should be <= code_refs_line_end_mean and code_refs_line_end_max; null
      only if no code references exist
    description: Minimum ending line number across all code references associated
      with an intent record
  code_refs_line_start_max:
    business_rule: Must be a positive integer or null; must be greater than or equal
      to code_refs_line_start_mean and code_refs_line_start_min
    cross_column_relationship: Must be >= code_refs_line_start_mean and >= code_refs_line_start_min;
      should be <= code_refs_line_end_max if code references span multiple lines
    description: The maximum line number where a code reference starts across all
      code references associated with this intent record
  code_refs_line_start_mean:
    business_rule: value must be a positive number (greater than or equal to 1.0);
      can be null if code_refs_count is 0
    cross_column_relationship: must be between code_refs_line_start_min and code_refs_line_start_max
      (inclusive); should be null when code_refs_count is 0
    description: The mean (average) starting line number across all code references
      associated with an intent record
  code_refs_line_start_min:
    business_rule: value must be a positive integer >= 1 when code_refs_count > 0,
      otherwise null
    cross_column_relationship: must be <= code_refs_line_start_mean and <= code_refs_line_start_max;
      only populated when code_refs_count > 0; must be <= corresponding code_refs_line_end
      values
    description: The minimum starting line number across all code references associated
      with an intent record
  description:
    business_rule: value must be non-empty string, typically between 10-200 characters,
      describing a specific intent or task
    cross_column_relationship: related to code_refs_count (intents with descriptions
      should have associated code references); code_refs_line_start_mean provides
      metrics about the code associated with this described intent
    description: Human-readable text describing the purpose or goal of an intent record,
      typically representing a development task, feature, or work item
  governance_tags_count:
    business_rule: value must be a non-negative integer (>= 0)
    cross_column_relationship: may correlate with status field; active or production-ready
      intents may require governance_tags_count > 0
    description: The count of governance-related tags associated with an intent record,
      indicating the number of compliance, security, or policy tags applied
  intent_id:
    business_rule: Must be unique and non-null; accepts alphanumeric format including
      prefixed codes (INT-XXX) or UUID format (8-4-4-4-12 hexadecimal)
    cross_column_relationship: Primary key that may be referenced by code_refs_count
      to indicate how many code references exist for this intent
    description: Unique identifier for an intent record, used as primary key to track
      and reference specific intents within the system
  is_synthetic:
    business_rule: value must be a boolean (True/False); non-null
    cross_column_relationship: synthetic records may have different validation rules
      for status field; typically correlated with specific vcs_revision values used
      for testing or data augmentation
    description: Boolean flag indicating whether the intent record was artificially
      generated or created through synthetic data generation rather than from real
      user interactions
  status:
    business_rule: 'value must be one of: ''IN_PROGRESS'', ''COMPLETED'''
    cross_column_relationship: When status is 'COMPLETED', created_at should be populated
      and vcs_revision should not be null
    description: Current processing state of the intent record, indicating whether
      the record is actively being processed or has finished processing
  vcs_revision:
    business_rule: value must be a valid SHA-1 hash (40 hexadecimal characters) or
      empty; immutable once set
    cross_column_relationship: typically populated at created_at timestamp; may be
      null for is_synthetic=true records that are not tied to actual code deployments
    description: Version control system commit hash or revision identifier that tracks
      the code version associated with this intent record
