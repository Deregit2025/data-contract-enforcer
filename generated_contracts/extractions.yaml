kind: DataContract
lineage:
  downstream: []
  upstream: []
llm_annotations:
  doc_name:
    business_rule: value must be a non-empty string; should typically contain alphanumeric
      characters and may include hyphens, underscores, and spaces; commonly includes
      year information in format YYYY or YYYY-YY
    cross_column_relationship: relates to extracted_at as the timestamp when this
      document was processed; may be associated with is_synthetic flag to indicate
      if document name refers to real or generated test data
    description: Name or title of the source document from which data was extracted,
      typically containing report titles, audit documents, or survey reports with
      year identifiers
  entities_count:
    business_rule: Must be a non-negative integer; typically greater than 0 when extraction
      is successful
    cross_column_relationship: Should correlate with the page range size (extracted_facts_page_ref_max
      - extracted_facts_page_ref_min); larger page ranges typically yield higher entity
      counts; may correlate with processing_time_ms
    description: The total count of distinct entities extracted from a document or
      page range during the extraction process
  extracted_facts_confidence_max:
    business_rule: value must be numeric between 0 and 100, typically >= extracted_facts_confidence_mean
      and >= extracted_facts_confidence_min
    cross_column_relationship: must be >= extracted_facts_confidence_mean and >= extracted_facts_confidence_min;
      forms a statistical triplet (min, mean, max) for confidence scoring
    description: The maximum confidence score among all extracted facts from a document,
      representing the highest certainty level for any single fact extraction, measured
      as a percentage
  extracted_facts_confidence_mean:
    business_rule: value must be a numeric type between 0 and 100 inclusive; should
      be NULL when extracted_facts_count is 0
    cross_column_relationship: must be >= extracted_facts_confidence_min and <= extracted_facts_confidence_max;
      when extracted_facts_count = 1, this value should equal both min and max confidence
      values
    description: The average confidence score across all facts extracted from a source
      document, measured as a percentage
  extracted_facts_confidence_min:
    business_rule: value must be a numeric value between 0 and 100 inclusive; should
      be less than or equal to extracted_facts_confidence_mean and extracted_facts_confidence_max;
      should be null when extracted_facts_count is 0 or null
    cross_column_relationship: must be <= extracted_facts_confidence_mean and <= extracted_facts_confidence_max;
      should only have a value when extracted_facts_count > 0
    description: The minimum confidence score among all facts extracted from a document,
      representing the lowest certainty level of any individual extracted fact
  extracted_facts_count:
    business_rule: value must be a non-negative integer; value should be greater than
      0 when extracted_facts_confidence_mean is not null
    cross_column_relationship: when extracted_facts_count > 0, extracted_facts_confidence_mean,
      extracted_facts_confidence_min must not be null; count represents the number
      of facts for which confidence metrics are calculated
    description: The total number of facts extracted from a source document, representing
      the count of discrete factual statements identified during the extraction process
  extracted_facts_page_ref_max:
    business_rule: value must be a positive integer; must be >= extracted_facts_page_ref_min
      and >= extracted_facts_page_ref_mean
    cross_column_relationship: must be >= extracted_facts_page_ref_min; must be >=
      extracted_facts_page_ref_mean; should correlate with entities_count (more entities
      may span more pages)
    description: The maximum page reference number among all extracted facts in a
      document, indicating the highest page number where facts were found
  extracted_facts_page_ref_mean:
    business_rule: value must be a positive number; should be between extracted_facts_page_ref_min
      and extracted_facts_page_ref_max when both are present
    cross_column_relationship: 'must satisfy: extracted_facts_page_ref_min <= extracted_facts_page_ref_mean
      <= extracted_facts_page_ref_max; null only if extracted_facts_page_ref_min and
      extracted_facts_page_ref_max are also null'
    description: The arithmetic mean (average) of page reference numbers where facts
      were extracted from a document
  extracted_facts_page_ref_min:
    business_rule: Must be a positive integer greater than or equal to 1; must be
      less than or equal to extracted_facts_page_ref_max
    cross_column_relationship: Must be <= extracted_facts_page_ref_mean and <= extracted_facts_page_ref_max;
      typically represents the earliest page where facts were found in the extraction
      process
    description: The minimum page number referenced across all facts extracted from
      a document
  extraction_model:
    business_rule: value must be a non-empty string following the pattern of a valid
      model identifier (e.g., 'gpt-4o-YYYY-MM-DD')
    cross_column_relationship: correlates with processing_time_ms and token_count_input
      as different models have varying performance characteristics and token consumption
      rates
    description: The AI model version used to perform the extraction process, identifying
      the specific instance of the language model that generated the extracted data
  is_synthetic:
    business_rule: value must be a boolean (True or False)
    cross_column_relationship: related to doc_name which may indicate synthetic document
      names when this flag is True; extracted_at timestamp indicates when synthetic
      data was generated
    description: Boolean flag indicating whether the extraction data was synthetically
      generated rather than from a real document source
  token_count_input:
    business_rule: value must be a positive integer greater than 0
    cross_column_relationship: typically less than token_count_output for expansion
      tasks or greater for summarization; must exist when extraction_model and processing_time_ms
      are populated
    description: Number of tokens in the input text sent to the extraction model for
      processing
  token_count_output:
    business_rule: value must be a positive integer greater than 0
    cross_column_relationship: token_count_output should be populated when extracted_at
      is not null; typically compared with token_count_input to measure output verbosity
    description: Number of tokens in the output generated during the extraction process
