apiVersion: v3.0.0
id: extractions
info:
  description: Auto-generated contract for Extractions. Generated at 2026-04-05T13:42:16.802948+00:00.
  owner: extractions
  title: Extractions
  version: 1.0.0
kind: DataContract
lineage:
  downstream: []
  upstream: []
llm_annotations:
  doc_name:
    business_rule: value must be non-null string; should contain descriptive document
      title; may include year identifier (YYYY or YYYY-YY format)
    cross_column_relationship: references the source document that was processed at
      'extracted_at' timestamp; may be linked to synthetic data generation when 'is_synthetic'
      is true; document complexity may correlate with 'token_count_output'
    description: Name or title of the source document from which data was extracted,
      typically containing report titles, audit documents, or survey names with associated
      years
  entities_count:
    business_rule: value must be a non-negative integer
    cross_column_relationship: should be populated when extraction_model is specified
      and processing_time_ms is greater than 0
    description: The total count of distinct entities extracted from the document
      during the extraction process
  extracted_facts_confidence_max:
    business_rule: value must be a number between 0 and 100 inclusive; should be greater
      than or equal to extracted_facts_confidence_mean and extracted_facts_confidence_min
    cross_column_relationship: extracted_facts_confidence_max >= extracted_facts_confidence_mean
      >= extracted_facts_confidence_min; all three confidence metrics should be null
      or populated together
    description: Maximum confidence score among all facts extracted from a document,
      representing the highest certainty level assigned to any single extracted fact
  extracted_facts_confidence_mean:
    business_rule: value must be a decimal between 0 and 100 inclusive; should be
      greater than or equal to extracted_facts_confidence_min and less than or equal
      to extracted_facts_confidence_max
    cross_column_relationship: 'must satisfy: extracted_facts_confidence_min <= extracted_facts_confidence_mean
      <= extracted_facts_confidence_max; should be null when extracted_facts_count
      is 0 or null'
    description: Average confidence score of all facts extracted from a source, calculated
      as the arithmetic mean of individual fact confidence scores
  extracted_facts_confidence_min:
    business_rule: value must be numeric between 0 and 100, null only if extracted_facts_count
      is 0 or null
    cross_column_relationship: must be less than or equal to extracted_facts_confidence_mean
      and extracted_facts_confidence_max; null when extracted_facts_count is 0
    description: The minimum confidence score among all facts extracted from a document,
      representing the lowest certainty level for any individual extracted fact
  extracted_facts_count:
    business_rule: value must be a non-negative integer; value should be 0 or greater
    cross_column_relationship: must be consistent with extracted_facts_confidence_mean
      and extracted_facts_confidence_min (if count is 0, confidence metrics should
      be null; if count > 0, confidence metrics should have values)
    description: The total number of facts extracted from a source document or file
  extracted_facts_page_ref_max:
    business_rule: value must be a positive integer; must be greater than or equal
      to extracted_facts_page_ref_min and extracted_facts_page_ref_mean
    cross_column_relationship: must be >= extracted_facts_page_ref_min; must be >=
      extracted_facts_page_ref_mean; should correlate with entities_count (more entities
      may span more pages)
    description: The maximum page reference number among all extracted facts in the
      document, indicating the highest page number from which facts were extracted
  extracted_facts_page_ref_mean:
    business_rule: value must be a positive decimal number, typically between extracted_facts_page_ref_min
      and extracted_facts_page_ref_max
    cross_column_relationship: must be >= extracted_facts_page_ref_min and <= extracted_facts_page_ref_max;
      null only if both min and max are null
    description: The mean (average) page reference number across all extracted facts
      from a document, indicating the typical location where facts were found
  extracted_facts_page_ref_min:
    business_rule: Must be a positive integer greater than or equal to 1; must be
      less than or equal to extracted_facts_page_ref_max
    cross_column_relationship: Must be <= extracted_facts_page_ref_mean and <= extracted_facts_page_ref_max;
      represents the lower bound of the page reference range
    description: The minimum page reference number from which facts were extracted
      in the document
  extraction_model:
    business_rule: value must be non-null string following pattern of model name and
      version date (e.g., 'gpt-4o-YYYY-MM-DD')
    cross_column_relationship: correlates with processing_time_ms and token_count_input
      as different models have varying performance characteristics and token usage
      patterns
    description: The specific version of the AI model used to perform the data extraction,
      typically a GPT model identifier
  is_synthetic:
    business_rule: value must be boolean (True/False); non-null
    cross_column_relationship: when is_synthetic is True, doc_name may reference generated/test
      document names rather than real document sources
    description: Boolean flag indicating whether the extraction data was synthetically
      generated or derived from real documents
  token_count_input:
    business_rule: value must be positive integer greater than 0
    cross_column_relationship: Must be populated when extraction_model is set; typically
      less than token_count_output for summarization or greater for expansion tasks
    description: Number of tokens in the input text sent to the extraction model for
      processing
  token_count_output:
    business_rule: value must be a positive integer greater than 0
    cross_column_relationship: should be present when extracted_at is not null; typically
      smaller than token_count_input for summarization tasks or larger for expansion
      tasks
    description: Number of tokens generated in the output response from the extraction
      process
quality:
  specification:
    checks for extractions:
    - row_count >= 1
    - missing_count(doc_id) = 0
    - duplicate_count(doc_id) = 0
    - missing_count(source_path) = 0
    - missing_count(source_hash) = 0
    - missing_count(extracted_facts_count) = 0
    - missing_count(extracted_facts_confidence_mean) = 0
    - missing_count(extracted_facts_confidence_min) = 0
    - missing_count(extracted_facts_confidence_max) = 0
    - missing_count(extracted_facts_page_ref_mean) = 0
    - missing_count(extracted_facts_page_ref_min) = 0
    - missing_count(extracted_facts_page_ref_max) = 0
    - missing_count(entities_count) = 0
    - missing_count(extraction_model) = 0
    - missing_count(processing_time_ms) = 0
    - missing_count(token_count_input) = 0
    - missing_count(token_count_output) = 0
    - missing_count(extracted_at) = 0
    - missing_count(doc_name) = 0
    - min(extracted_facts_confidence_min) >= 0.0
    - max(extracted_facts_confidence_max) <= 1.0
  type: SodaChecks
