kind: DataContract
lineage:
  downstream: []
  upstream: []
llm_annotations:
  confidence:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive
    cross_column_relationship: should exist when overall_verdict and overall_score
      are present; typically populated when is_synthetic is true or when verdict is
      system-generated rather than manually entered
    description: A numerical score representing the confidence level or certainty
      of the verdict prediction, likely generated by a machine learning model or automated
      scoring system. Values range from 0 to 1, where higher values indicate greater
      confidence in the verdict assessment.
  is_synthetic:
    business_rule: value must be a boolean (True/False); non-null required field
    cross_column_relationship: when is_synthetic is True, confidence scores may be
      artificially calibrated and evaluated_at timestamp represents generation time
      rather than actual verdict time
    description: Boolean flag indicating whether the verdict record was artificially
      generated or synthetically created rather than representing a real courtroom
      case outcome
  overall_score:
    business_rule: value must be a positive decimal number, typically between 0 and
      5 (appears to use a 5-point scale based on sample values ranging from 2.4 to
      3.0)
    cross_column_relationship: should correspond to the overall_verdict classification;
      derived from or validated against rubric_version criteria; confidence level
      may indicate reliability of this score
    description: Numeric score representing the overall evaluation rating for a verdict,
      likely averaged or aggregated from multiple rubric criteria
  overall_verdict:
    business_rule: 'value must be one of: ''PASS'', ''FAIL'', ''WARN''; non-null required
      field'
    cross_column_relationship: derived from overall_score evaluated against rubric_id
      and rubric_version thresholds; confidence level may influence WARN classification
    description: Final categorical verdict or judgement status indicating whether
      the evaluated item passed, failed, or triggered a warning based on the overall
      score and rubric criteria
  rubric_version:
    business_rule: value must follow semantic versioning pattern (MAJOR.MINOR.PATCH)
      where each segment is a non-negative integer, e.g., '3.0.0'
    cross_column_relationship: references the version of the rubric identified by
      rubric_id; should align with the rubric used to calculate overall_score and
      overall_verdict
    description: Version number of the rubric used to evaluate and score the verdict,
      following semantic versioning format
  target_ref:
    business_rule: Must be a valid relative or absolute file path string following
      Unix-style path notation; should reference an existing resource in the repository
      or filesystem
    cross_column_relationship: Links to verdict_id as the target being judged; rubric_id
      and rubric_version define the evaluation criteria applied to this target_ref
    description: File path or repository reference that identifies the target artifact
      being evaluated in the verdict, typically pointing to source code files, notebooks,
      or repository locations within the project structure
  verdict_id:
    business_rule: Must be a valid UUID (version 4) format with lowercase hexadecimal
      characters and hyphens in pattern 8-4-4-4-12; must be unique across all verdict
      records; cannot be null
    cross_column_relationship: Primary key for the verdict records table; may be referenced
      by target_ref in related tables to link verdicts to their subjects; associated
      with rubric_id to indicate the evaluation criteria used for the verdict
    description: Unique identifier for each verdict record in the digital courtroom
      system, used to track individual judgments or decisions
