    description: File path or repository reference that identifies the target artifact
      being evaluated in the verdict, typically pointing to source code files, notebooks,
      or repository locations within the project structure
    required: true
    type: string
  verdict_id:
    business_rule: Must be a valid UUID (version 4) format with lowercase hexadecimal
      characters and hyphens in pattern 8-4-4-4-12; must be unique across all verdict
      records; cannot be null
    description: Unique identifier for each verdict record in the digital courtroom
