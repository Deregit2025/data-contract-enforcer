llm_annotations:
  codebase_root:
    business_rule: 'Must be a valid absolute file path string; cannot be null or empty;
      typically follows OS-specific path conventions (Windows: drive letter with backslashes,
      Unix: forward slashes from root)'
    cross_column_relationship: Associated with snapshot_id as the base location for
      analyzing nodes_count and linking to git_commit; multiple snapshots may share
      the same codebase_root
    description: The file system path to the root directory of the codebase being
      analyzed in the snapshot
  edges_confidence_max:
    business_rule: value must be a decimal number between 0.0 and 1.0 inclusive, and
      must be greater than or equal to edges_confidence_mean and edges_confidence_min
    cross_column_relationship: must be >= edges_confidence_mean and >= edges_confidence_min;
      all three confidence metrics (min, mean, max) should be present together for
      the same captured_at timestamp
    description: The maximum confidence score among all lineage edges in the snapshot,
      representing the highest level of certainty for any data lineage relationship
      captured at that point in time
  edges_confidence_mean:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive; should be
      NULL when edges_count is 0
    cross_column_relationship: must be greater than or equal to edges_confidence_min
      and less than or equal to edges_confidence_max; should only have a value when
      edges_count > 0
    description: The average confidence score across all edges in the lineage graph
      snapshot, representing the mean certainty or strength of data lineage relationships
  edges_confidence_min:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive; must be
      less than or equal to edges_confidence_mean and edges_confidence_max
    cross_column_relationship: must be <= edges_confidence_mean and <= edges_confidence_max;
      should be null when edges_count is 0 or null
    description: The minimum confidence score among all lineage edges in the snapshot,
      representing the lowest level of certainty in any data lineage relationship
      captured at that point in time
  edges_count:
    business_rule: value must be a non-negative integer; typically greater than 0
      for non-empty lineage graphs
    cross_column_relationship: should be less than or equal to nodes_count * (nodes_count
      - 1) for directed graphs; edges_confidence_mean and edges_confidence_min are
      only meaningful when edges_count > 0
    description: The total number of edges (relationships/connections between nodes)
      in the lineage graph at the time of the snapshot
  git_commit:
    business_rule: Must be a valid 40-character hexadecimal SHA-1 hash matching pattern
      ^[a-f0-9]{40}$
    cross_column_relationship: Associated with snapshot_id and codebase_root to uniquely
      identify the code version that was analyzed to produce the lineage graph metrics
      (nodes_count, edges_count)
    description: The Git commit hash (SHA-1) representing the specific version of
      the codebase for this lineage snapshot
  nodes_count:
    business_rule: value must be a non-negative integer; typically greater than 0
      for valid lineage graphs
    cross_column_relationship: should be consistent with edges_count as edges connect
      nodes; a graph with edges_count > 0 must have nodes_count >= 2
    description: The total count of nodes present in the lineage graph at the time
      of this snapshot
  snapshot_id:
    business_rule: Must be a valid UUID (universally unique identifier) in format
      xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx where x is a hexadecimal character
    cross_column_relationship: Primary key that links to codebase_root and git_commit
      to form a complete snapshot record; each snapshot_id should have exactly one
      associated codebase_root and git_commit
    description: Unique identifier for each lineage snapshot record, representing
      a specific point-in-time capture of code lineage information
