apiVersion: v3.0.0
id: events
info:
  description: Auto-generated contract for Events. Generated at 2026-04-05T13:51:35.123441+00:00.
  owner: events
  title: Events
  version: 1.0.0
kind: DataContract
lineage:
  downstream: []
  upstream: []
llm_annotations:
  aggregate_id:
    business_rule: Must be a valid UUID (version 4 or 5 format), non-null, and must
      be consistent across all events that belong to the same aggregate instance
    cross_column_relationship: Must have a corresponding aggregate_type that defines
      the type of entity this ID represents. Multiple rows can share the same aggregate_id
      but must have incrementing sequence_number values to maintain event ordering
    description: Unique identifier for the aggregate root entity in an event sourcing
      system, grouping related events that belong to the same domain object or entity
      instance
  aggregate_type:
    business_rule: value must be a non-empty string representing a valid aggregate
      type; appears to consistently be 'LoanApplication' based on sample data
    cross_column_relationship: works in conjunction with aggregate_id to uniquely
      identify the aggregate instance; related to event_type which describes what
      happened to this aggregate; aggregate_id should correspond to payload_application_id
      when aggregate_type is 'LoanApplication'
    description: The type or category of the business aggregate that the event is
      associated with, representing the domain entity being tracked in the event sourcing
      pattern
  event_type:
    business_rule: value must be a non-null string from a predefined enumeration of
      valid event types; must follow PascalCase naming convention
    cross_column_relationship: must correspond to the aggregate_type value; different
      aggregate_types may have different valid event_type values; serves as a discriminator
      for event processing logic associated with the aggregate_id
    description: The type or category of event that occurred in the system, representing
      specific actions or state changes such as application submission, document requests,
      or package creation
  metadata_correlation_id:
    business_rule: Must be a valid UUID format (RFC 4122), cannot be null or empty
    cross_column_relationship: Works in conjunction with metadata_source_service to
      trace events across service boundaries; may be referenced by the same correlation_id
      in other events to group related operations
    description: Unique identifier used to correlate and track related events or transactions
      across distributed systems and services
  metadata_source_service:
    business_rule: value must be a non-empty string following the naming pattern 'week[number]-event-sourcing-platform'
    cross_column_relationship: typically populated alongside metadata_correlation_id
      and metadata_user_id as part of event metadata; may be used to correlate with
      schema_version for service-specific schema validation
    description: The name of the source service or platform that generated or published
      the event
  metadata_user_id:
    business_rule: must be non-empty string; accepts user identifiers (e.g. COMP-XXX
      format) or system service names (e.g. 'system')
    cross_column_relationship: may correlate with metadata_source_service when value
      is 'system'; links to metadata_correlation_id for tracking user action flows
    description: Identifier of the user or system account that generated or triggered
      the event
  payload_adverse_action_notice_required:
    business_rule: Must be a boolean value (True/False); typically True when payload_declined_by
      or payload_declined_at is populated
    cross_column_relationship: Should be True when payload_declined_at is not null;
      correlates with payload_declined_by indicating who made the adverse decision
    description: Indicates whether an adverse action notice is legally required to
      be sent to the customer following a negative decision or decline action
  payload_agent_id:
    business_rule: value must be a non-empty string following the pattern of alphanumeric
      characters with hyphens, typically in format '{type}-agent-{number}'
    cross_column_relationship: should correspond to a valid agent_type in payload_agent_type
      column and may be associated with specific model_version in payload_model_version;
      multiple events can share the same agent_id within a payload_session_id
    description: Unique identifier for the agent that processed or handled the event,
      appears to be a document-processing agent based on the 'doc-agent' prefix
  payload_agent_type:
    business_rule: value must be a non-empty string from a predefined set of valid
      agent types (e.g., 'document_processing', 'data_extraction', 'classification')
    cross_column_relationship: corresponds to payload_agent_id which uniquely identifies
      the specific agent instance; may determine which payload_model_version values
      are valid for that agent type
    description: Type or category of agent that processed the event, indicating the
      functional role or capability of the agent handling the operation
  payload_all_analyses_complete:
    business_rule: value must be a boolean (True/False); non-null required field
    cross_column_relationship: when True, payload_overall_verdict and payload_confidence
      should be populated; typically evaluated after payload_has_hard_block determination
    description: Boolean flag indicating whether all security or analysis checks have
      been completed for the event payload
  payload_analysis_duration_ms:
    business_rule: value must be a positive number; typically ranges from 20000 to
      50000 milliseconds
    cross_column_relationship: should only be populated when payload_screening_model_version
      is not null; duration correlates with payload_model_deployment_id processing
      characteristics
    description: Duration in milliseconds taken to complete the payload analysis process
      for the event
  payload_anomalies_found:
    business_rule: value must be a non-negative numeric value (>= 0)
    cross_column_relationship: typically correlates with payload_fraud_score and payload_risk_level;
      higher anomaly counts should correspond to higher fraud scores and elevated
      risk levels
    description: Number of anomalies detected in the payload during fraud analysis
      or risk assessment
  payload_applicant_id:
    business_rule: value must match pattern 'COMP-' followed by a 3-digit number (e.g.,
      COMP-001 to COMP-999); must not be null
    cross_column_relationship: must correspond to a valid applicant; may have multiple
      rows per applicant_id if they have multiple applications; related to payload_application_id
      which represents the specific application instance
    description: Unique identifier for the applicant associated with the event, using
      a standardized COMP prefix format
  payload_application_id:
    business_rule: value must match pattern 'APEX-' followed by 4 digits, not null
    cross_column_relationship: links to the application being processed; typically
      relates to payload_applicant_id as one applicant may have multiple applications
    description: Unique identifier for the application associated with this event,
      using the APEX prefix format
  payload_application_reference:
    business_rule: 'Must follow pattern APEX-#### where #### is a zero-padded 4-digit
      number; non-null; unique per application'
    cross_column_relationship: Associated with payload_contact_name and payload_submitted_at
      to form complete application submission record; may correlate with metadata_correlation_id
      for tracking
    description: A unique reference identifier or code for the application being submitted
      or processed, following the APEX prefix pattern
  payload_approved_amount_usd:
    business_rule: value must be a non-negative numeric value, typically greater than
      0 when populated
    cross_column_relationship: Part of event payload alongside payload_orchestrator_session_id,
      payload_confidence, payload_executive_summary, and payload_generated_at; may
      be null if approval amount is not applicable for the event type
    description: The approved monetary amount in US dollars for a transaction, decision,
      or request captured in the event payload
  payload_approved_by:
    business_rule: value must be non-null; typically 'auto' for system approvals or
      a user identifier for manual approvals
    cross_column_relationship: should have a corresponding non-null value in payload_approved_at
      when this field is populated; likely related to payload_effective_date as approval
      precedes effectiveness
    description: Identifier of the user or system that approved the payload, with
      'auto' indicating automatic approval without manual intervention
  payload_auditor_notes:
    business_rule: value must be a non-empty string when payload_is_coherent is true;
      may contain multi-sentence observations about financial data quality and consistency
      checks
    cross_column_relationship: populated when payload_is_coherent assessment is performed;
      timestamp corresponds to payload_assessed_at; presence indicates manual or automated
      audit was completed on documents counted in payload_documents_processed
    description: Free-text notes recorded by an auditor reviewing the coherence and
      accuracy of financial statement data, documenting observations about internal
      consistency, balance sheet reconciliation, and revenue trends
  payload_confidence:
    business_rule: value must be a decimal number between 0 and 1 inclusive
    cross_column_relationship: likely derived when payload_all_analyses_complete is
      true; may influence whether payload_approved_amount_usd is set or contributes
      to payload_executive_summary generation
    description: A numerical confidence score representing the reliability or certainty
      of the event payload data, typically output from a machine learning model or
      analysis engine, ranging from 0 to 1 where higher values indicate greater confidence
  payload_contact_email:
    business_rule: Must be a valid email format containing '@' symbol and domain (e.g.,
      user@example.com); should not be null or empty
    cross_column_relationship: Associated with payload_contact_name which should contain
      the name of the person who owns this email address; part of the payload submission
      data along with payload_submission_channel and payload_submitted_at
    description: Email address of the contact person associated with the event submission
      or loan application payload
  payload_contact_name:
    business_rule: value must be a non-empty string containing alphabetic characters
      and may include title prefixes (Mr., Mrs., Ms., Dr., etc.); typical length 2-100
      characters
    cross_column_relationship: relates to payload_contact_email as both identify the
      same contact person; should be populated when payload_submission_channel indicates
      user-submitted events; typically associated with payload_application_reference
      as the applicant contact
    description: Full name of the contact person associated with the event submission
      or application, typically formatted with title and first/last name
  payload_context_source:
    business_rule: value must be a non-null string from an enumerated set of valid
      source types (e.g., 'fresh', 'cached', 'reused')
    cross_column_relationship: relates to payload_context_token_count which quantifies
      the context size; may correlate with payload_model_version to determine context
      generation strategy
    description: Indicates the source or origin of the context data provided in the
      event payload, distinguishing between newly generated context versus cached
      or reused context
  payload_context_token_count:
    business_rule: value must be a positive integer greater than 0
    cross_column_relationship: related to payload_context_source which identifies
      the origin of the context being tokenized; typically populated when payload_started_at
      is present
    description: The number of tokens in the context payload for a LangGraph event,
      used to measure prompt size and API usage
  payload_data_hash:
    business_rule: must be a 16-character hexadecimal string (64-bit hash) matching
      pattern ^[a-f0-9]{16}$
    cross_column_relationship: hash is computed from the payload content represented
      by adjacent columns (payload_has_defaults, payload_revenue_trajectory, payload_consumed_at,
      payload_facts_summary); identical payload_data_hash values indicate duplicate
      or identical payload contents
    description: A hexadecimal hash value representing a cryptographic digest or checksum
      of the payload data content, used for data integrity verification and deduplication
  payload_declined_by:
    business_rule: value must be non-null when payload_declined_at is populated; expected
      values include 'compliance-system', 'auto', 'manual-review', or system identifiers
    cross_column_relationship: must be populated when payload_declined_at has a timestamp;
      likely correlates with payload_is_hard_block being true; may determine if payload_adverse_action_notice_required
      is set
    description: System or entity that declined the transaction or application, indicating
      the source of the rejection decision
  payload_detected_format:
    business_rule: value must be a valid file format string (e.g., pdf, docx, txt,
      jpg, png); cannot be null or empty
    cross_column_relationship: related to payload_page_count (only applicable for
      multi-page formats like pdf); precedes payload_executed_at in the processing
      pipeline; influences payload_extraction_model selection based on format type
    description: The file format detected for the payload content, indicating the
      type of document being processed
  payload_document_format:
    business_rule: value must be a valid document format identifier (e.g., pdf, docx,
      txt, xml, json); typically lowercase alphanumeric string without special characters
    cross_column_relationship: should align with the file extension in payload_filename;
      must correspond to a document referenced by payload_document_id
    description: The file format or extension of the document included in the event
      payload
  payload_document_id:
    business_rule: value must match pattern 'doc-[a-z0-9]{8}' and be non-null
    cross_column_relationship: references a document that has attributes defined in
      payload_document_type and payload_document_format; associated with payload_package_id
      which may contain multiple documents
    description: Unique identifier for a document within the event payload, using
      a prefixed alphanumeric format
  payload_document_type:
    business_rule: value must be a non-empty string from a predefined set of document
      type codes; common values include 'application_proposal', 'income_statement',
      'balance_sheet'
    cross_column_relationship: relates to payload_document_id as the type classifier
      for that document; payload_document_format specifies the file format while this
      specifies the business document type; payload_filename may contain indicators
      of this document type
    description: The type or category of document contained in the event payload,
      identifying the nature of the business document being processed (e.g., application
      proposal, financial statement type)
  payload_documents_processed:
    business_rule: value must be a non-negative number, typically a positive integer
      representing document count
    cross_column_relationship: should be populated when payload_assessed_at is not
      null; may correlate with payload_has_quality_flags and payload_quality_flag_count
      when documents are flagged during processing
    description: The number of documents that were processed as part of the event
      payload, likely representing documents reviewed or handled during an audit or
      assessment workflow
  payload_duration_ms:
    business_rule: value must be a non-negative number, typically between 0 and 3600000
      (1 hour)
    cross_column_relationship: should be non-null when payload_executed_at is populated;
      may correlate with payload_page_count for processing-intensive operations
    description: Duration in milliseconds for the payload execution or processing
      time
  payload_effective_date:
    business_rule: Must be a valid date in ISO 8601 format (YYYY-MM-DD); should not
      be null if approved_at is populated; typically should be on or after approved_at
      date
    cross_column_relationship: Related to payload_approved_at (effective date should
      be >= approved_at); may determine the start date for payload_term_months calculation;
      likely null or irrelevant if payload_failure_reason is populated
    description: The date when the event payload or associated terms become effective
      or active
  payload_evaluation_notes:
    business_rule: 'value must be non-null string; typically follows format ''[Criterion
      Name]: [Status].'' where status includes values like ''Clear'', ''Issue'', ''Pending'',
      or ''Not Applicable'''
    cross_column_relationship: corresponds to payload_note_type which categorizes
      the note; payload_evaluated_at provides timestamp; payload_evidence_hash links
      to supporting documentation; payload_rule_version indicates which compliance
      rules were applied
    description: Contains compliance and regulatory evaluation results and notes for
      each assessed criterion, documenting whether requirements like BSA, OFAC sanctions,
      jurisdiction, legal entity eligibility, and operating history checks are clear
      or have issues
  payload_evidence_hash:
    business_rule: value must be a valid hexadecimal string, typically 16 characters
      (64-bit hash) or 32 characters (128-bit hash), non-null
    cross_column_relationship: associated with payload_rule_name and payload_rule_version
      to provide integrity verification of the evaluated payload at payload_evaluated_at
      timestamp
    description: Hexadecimal hash value representing cryptographic evidence or fingerprint
      of the payload data used during rule evaluation
  payload_executive_summary:
    business_rule: Must contain one of 'Approval recommended' or 'Decline recommended';
      must include a trajectory status (DECLINING, RECOVERING, GROWTH, STABLE); must
      include compliance status; must include fraud screening risk level
    cross_column_relationship: Approval/Decline recommendation should align with payload_approved_amount_usd
      (declined should be 0 or null); trajectory and risk assessment should correlate
      with payload_confidence score; payload_generated_at indicates when this summary
      was created
    description: A natural language summary of a credit or loan decision that includes
      the approval recommendation, business trajectory assessment, compliance status,
      and fraud risk evaluation
  payload_extraction_model:
    business_rule: value must follow pattern '{model_name}-{version}' where version
      is in semantic format (e.g., 1.0, 2.1.3)
    cross_column_relationship: should be populated when payload_detected_format is
      not null; works in conjunction with payload_pipeline_version and payload_tool_name
      to define the extraction processing chain
    description: The name and version of the machine learning or AI model used to
      extract data from the event payload
  payload_facts_summary:
    business_rule: Must contain three financial metrics in the format 'Revenue $X,
      EBITDA $Y, Net Income $Z' where X, Y, Z are numeric values with comma separators;
      Revenue should be the highest value, followed by EBITDA, then Net Income
    cross_column_relationship: This summary is derived from payload data identified
      by payload_data_hash; payload_quality_flags_present may indicate validation
      status of these financial figures; timestamp of data processing captured in
      payload_consumed_at
    description: A summary of key financial metrics including Revenue, EBITDA, and
      Net Income values, formatted as a comma-separated string with dollar amounts
  payload_failure_reason:
    business_rule: value must be a non-empty string when a failure occurs; should
      be null or empty when no failure exists; typically contains standardized failure
      reason text
    cross_column_relationship: should only be populated when payload_is_hard_block
      is true or when payload_approved_at is null; may determine whether payload_remediation_available
      is true or false depending on failure type
    description: Describes the specific reason why a compliance or eligibility check
      failed, such as sanctions screening, BSA violations, or jurisdictional restrictions
  payload_file_hash:
    business_rule: Must be a non-null hexadecimal string, typically 16 characters
      in length
    cross_column_relationship: Should be unique per unique payload_file_path; when
      payload_file_path is null, this should also be null; related to payload_file_size_bytes
      for file verification
    description: Hash value identifier for the payload file, used for file integrity
      verification and deduplication
  payload_file_path:
    business_rule: Must follow pattern 'documents/{COMP-###}/{APEX-####}_{document_type}.{extension}'
      where COMP is company identifier, APEX is document identifier, and extension
      matches payload_document_format
    cross_column_relationship: File extension must align with payload_document_format;
      filename portion after last slash should match payload_filename; file at path
      must have size matching payload_file_size_bytes and hash matching payload_file_hash
    description: File system path or storage location reference for document files,
      organized by company identifier with a hierarchical folder structure containing
      proposals, financial statements, and supporting documents
  payload_file_size_bytes:
    business_rule: value must be a positive number (> 0); typically an integer representing
      file size in bytes
    cross_column_relationship: must be null if payload_filename is null; should have
      a corresponding payload_file_hash and payload_file_path when present
    description: The size of the payload file in bytes
  payload_filename:
    business_rule: Must be a non-empty string containing a valid filename with an
      extension; typically follows pattern [IDENTIFIER]_[description].[extension]
      where extension matches common document formats (pdf, xlsx, doc, etc.)
    cross_column_relationship: File extension should correspond to payload_document_format;
      filename is part of the full payload_file_path; payload_file_size_bytes represents
      the size of this file; payload_document_type categorizes the content type of
      this filename
    description: The name of the file attached to or referenced in the event, typically
      representing documents such as proposals, financial statements, or spreadsheets
      associated with a specific account or transaction identifier
  payload_fiscal_year:
    business_rule: value must be a four-digit year (YYYY format), typically between
      2000 and 2100, can be null if fiscal year is not applicable to the event
    cross_column_relationship: should be consistent with payload_added_at timestamp
      - fiscal year should align with or follow the event creation date based on organization's
      fiscal calendar
    description: The fiscal year associated with the event payload, representing the
      financial reporting period when the event occurred or is attributed to
  payload_fraud_score:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive
    cross_column_relationship: should correlate with payload_risk_level (higher scores
      typically map to higher risk levels) and payload_anomalies_found (presence of
      anomalies should correspond to elevated scores); must have corresponding payload_screening_model_version
    description: Numerical score indicating the probability or likelihood of fraudulent
      activity detected in the event payload, ranging from 0 (no fraud risk) to 1
      (high fraud risk)
  payload_has_defaults:
    business_rule: value must be boolean (True/False); not null
    cross_column_relationship: may correlate with payload_data_hash for validation;
      likely part of payload metadata alongside payload_opened_at and payload_has_prior_loans
    description: Boolean flag indicating whether the event payload contains default
      values or uses system-assigned defaults rather than user-provided or calculated
      values
  payload_has_hard_block:
    business_rule: value must be boolean (True/False); typically set to True only
      when payload_overall_verdict indicates a blocking condition
    cross_column_relationship: related to payload_overall_verdict and payload_rules_failed;
      when True, payload_rules_failed likely contains blocking rule violations and
      payload_overall_verdict indicates rejection
    description: Boolean flag indicating whether the event payload contains a hard
      block condition that prevents processing or approval
  payload_has_prior_loans:
    business_rule: value must be boolean (True/False); cannot be null
    cross_column_relationship: may correlate with payload_has_defaults (entities with
      prior loans could have defaults); likely influences payload_priority in risk
      assessment
    description: Boolean flag indicating whether the entity associated with this event
      has any prior loans on record
  payload_has_quality_flags:
    business_rule: value must be boolean (true/false); true when payload_quality_flag_count
      > 0, false when payload_quality_flag_count = 0
    cross_column_relationship: 'must be consistent with payload_quality_flag_count:
      true if count > 0, false if count = 0; typically evaluated after payload_assessed_at
      is set'
    description: Boolean indicator of whether quality flags exist in the payload,
      derived from the quality flag count being greater than zero
  payload_input_data_hash:
    business_rule: must be a 16-character hexadecimal string
    cross_column_relationship: related to payload_model_deployment_id which processes
      the hashed input data; may be referenced by payload_triggered_by_event_id for
      event chaining
    description: Hash value of the input data provided in the event payload, used
      for data integrity verification and deduplication
  payload_interest_rate_pct:
    business_rule: value must be a positive decimal number, typically between 0 and
      100, representing percentage
    cross_column_relationship: related to payload_term_months for loan calculation;
      may be referenced in payload_executive_summary; typically set before payload_approved_by
    description: The annual percentage rate of interest charged on a loan or financial
      product
  payload_is_coherent:
    business_rule: value must be boolean (True/False); non-null required field
    cross_column_relationship: when False, payload_reextraction_recommended is likely
      True and payload_auditor_notes should contain explanation; may influence payload_overall_confidence
      score
    description: Boolean flag indicating whether the payload data is internally consistent
      and logically coherent, typically determined through validation checks or LLM
      analysis
  payload_is_hard_block:
    business_rule: value must be boolean (True/False); cannot be null
    cross_column_relationship: when True, payload_failure_reason should be populated;
      when payload_approved_at is not null, this should typically be False; relates
      to payload_remediation_available to indicate if blocked action can be resolved
    description: Boolean flag indicating whether the event payload represents a hard
      block action that completely prevents or stops a process, as opposed to a soft
      block or warning
  payload_langgraph_graph_version:
    business_rule: 'value must follow pattern: [major].[minor].[patch] or [major].[minor].[patch]-[suffix],
      where major/minor/patch are numeric and suffix is alphanumeric'
    cross_column_relationship: relates to payload_model_version as part of the overall
      system versioning; both should be populated when payload_agent_id is present
    description: Version identifier for the LangGraph graph component used in the
      event payload, following semantic versioning format with optional environment
      suffix
  payload_llm_called:
    business_rule: value must be boolean (True or False)
    cross_column_relationship: relates to payload_node_name to identify which nodes
      trigger LLM calls; when True, payload_duration_ms typically reflects LLM processing
      time
    description: Boolean flag indicating whether a Large Language Model (LLM) was
      invoked during the execution of this event node
  payload_llm_cost_usd:
    business_rule: value must be a positive decimal number greater than 0, typically
      between 0.0001 and 10.0 for normal API calls
    cross_column_relationship: derived from payload_llm_tokens_input and payload_llm_tokens_output
      using provider-specific pricing rates; higher token counts should correlate
      with higher costs
    description: The cost in US dollars charged by the LLM provider for processing
      a request, calculated based on input and output token counts and the provider's
      pricing model
  payload_llm_tokens_input:
    business_rule: value must be a positive number, typically an integer representing
      token count
    cross_column_relationship: should exist when payload_llm_tokens_output and payload_llm_cost_usd
      are present; combined with payload_llm_tokens_output affects payload_llm_cost_usd
      calculation
    description: Number of tokens in the input prompt sent to the Large Language Model
      (LLM) for processing
  payload_llm_tokens_output:
    business_rule: value must be a non-negative number, typically a positive integer
      representing token count
    cross_column_relationship: used with payload_llm_tokens_input to calculate total
      tokens and payload_llm_cost_usd; should be populated when payload_completed_at
      is not null
    description: Number of tokens generated in the output response by the large language
      model during an event
  payload_loan_purpose:
    business_rule: value must be a non-empty string from a predefined set of loan
      purpose categories (e.g., working_capital, acquisition, refinancing, expansion,
      equipment)
    cross_column_relationship: required when payload_requested_amount_usd is present;
      may influence approval criteria based on payload_applicant_id business type
    description: The purpose or intended use of the loan funds as specified by the
      applicant in the loan application payload
  payload_loan_term_months:
    business_rule: value must be a positive number, typically in increments of 12
      (12, 24, 36, 48, 60, 72), and generally between 12 and 84 months
    cross_column_relationship: should be present when payload_requested_amount_usd
      is populated; longer terms typically associated with higher loan amounts; must
      align with payload_loan_purpose requirements
    description: The duration of the loan in months that was requested or approved,
      representing the repayment period for the loan
  payload_model_deployment_id:
    business_rule: value must match pattern 'dep-[a-f0-9]{8}' (prefix 'dep-' followed
      by 8 hexadecimal characters); must not be null or empty
    cross_column_relationship: related to payload_analysis_duration_ms as deployment
      ID indicates which model instance performed the analysis; may be used to join
      with a model deployments dimension table
    description: Unique identifier for the machine learning model deployment that
      processed the event, used to track which version of a model generated predictions
      or analysis results
  payload_model_version:
    business_rule: value must follow pattern 'claude-{model-name}-{version}-{YYYYMMDD}'
      where date represents model release version
    cross_column_relationship: relates to payload_agent_type which likely specifies
      the agent utilizing this model version; part of payload context alongside payload_agent_id
      and payload_langgraph_graph_version
    description: Version identifier of the AI model used in the payload, indicating
      the specific Claude Sonnet model release date
  payload_next_agent_triggered:
    business_rule: value must be a non-empty string representing a valid agent name;
      commonly contains values like 'credit_analysis' or other agent identifiers
    cross_column_relationship: related to payload_requested_at for sequencing; may
      be used with payload_priority to determine agent execution order; part of the
      payload event context along with payload_total_cost_usd and payload_total_duration_ms
    description: The identifier or name of the next agent that was triggered in the
      workflow or process flow, indicating the subsequent step in the agent chain
  payload_node_name:
    business_rule: value must be non-null string; should match predefined workflow
      node names from the system's pipeline configuration
    cross_column_relationship: corresponds to payload_node_sequence ordering; nodes
      like 'validate_inputs' should have payload_validation_duration_ms populated;
      'run_extraction' may correlate with payload_llm_called=true
    description: Name of the processing node or step in the workflow pipeline that
      generated or handled this event
  payload_node_sequence:
    business_rule: value must be a positive integer starting from 1
    cross_column_relationship: corresponds to the execution order of payload_node_name
      within an event; should increment sequentially for each unique node in a processing
      chain
    description: Sequential order number of a node within an event processing workflow
      or pipeline
  payload_note_text:
    business_rule: value must be a non-empty string; typical format is a complete
      sentence with proper capitalization and punctuation
    cross_column_relationship: should correspond to payload_note_type which likely
      categorizes the type of note; content should align with payload_rules_evaluated
      and payload_rules_passed results; timestamp relationship with payload_evaluated_at
    description: Free-form text note or comment describing the outcome or details
      of a payload evaluation event, commonly used to document CRA (Community Reinvestment
      Act) qualification status or other evaluation results
  payload_note_type:
    business_rule: value must be a valid note type enumeration, non-null string with
      predefined categories
    cross_column_relationship: related to payload_note_text which contains the actual
      note content; should be present when payload_evaluation_notes exists
    description: Type or category of note associated with the event payload, specifically
      indicating CRA (Credit Risk Assessment) consideration type notes
  payload_orchestrator_session_id:
    business_rule: value must match pattern 'sess-dec-[a-f0-9]{8}' and cannot be null
      or empty
    cross_column_relationship: links multiple events that were processed within the
      same orchestrator session; may correlate with payload_all_analyses_complete
      status to indicate session completion state
    description: Unique identifier for an orchestrator session that processed the
      event, following a prefixed format with 'sess-dec-' and an alphanumeric hash
  payload_output_summary:
    business_rule: Must be a non-empty string that typically follows the pattern '[number]
      documents processed, [confidence level]. Package ready for [next process].'
      or similar workflow completion message
    cross_column_relationship: Related to payload_total_nodes_executed (execution
      completion), payload_ready_at (timestamp when this summary was generated), and
      payload_quality_flag_count (may reflect confidence level mentioned in summary)
    description: Human-readable summary text describing the outcome of a document
      processing workflow, including number of documents processed, confidence level,
      and next step or readiness status
  payload_overall_confidence:
    business_rule: value must be a decimal number between 0 and 1 inclusive (0 <=
      value <= 1)
    cross_column_relationship: likely correlates with payload_is_coherent flag and
      inversely with payload_reextraction_recommended; high confidence scores (>0.9)
      may result in is_coherent=true and reextraction_recommended=false
    description: A numerical confidence score representing the overall quality or
      reliability of the payload data, likely generated by a machine learning model
      or automated validation system, with values ranging from 0 to 1 where higher
      values indicate greater confidence
  payload_overall_verdict:
    business_rule: 'value must be one of: CLEAR, BLOCKED, CONDITIONAL; required when
      payload_all_analyses_complete is true'
    cross_column_relationship: BLOCKED verdict should correspond with payload_has_hard_block
      = true; verdict determined after all payload_rules_noted are evaluated
    description: Final verdict or decision status for the event payload, indicating
      whether it was cleared, blocked, or conditionally approved
  payload_package_id:
    business_rule: Must follow pattern 'APEX-' followed by a 4-digit zero-padded sequential
      number (e.g., APEX-0001)
    cross_column_relationship: Related to payload_document_id for package documentation;
      may be associated with payload_deadline for delivery tracking and payload_requested_by
      for package ownership
    description: Unique identifier for a payload package in APEX format, used to track
      deliverable packages associated with events
  payload_page_count:
    business_rule: value must be a positive integer greater than 0
    cross_column_relationship: likely correlates with payload_duration_ms (higher
      page counts may result in longer processing duration); may be null if payload_detected_format
      is not a paginated document type
    description: The number of pages processed or analyzed in the event payload, typically
      representing the page count of a document or file
  payload_pipeline_version:
    business_rule: value must follow semantic versioning pattern in format 'week{number}-v{major}.{minor}'
      where number is positive integer and major/minor are non-negative integers
    cross_column_relationship: should align with payload_extraction_model and payload_tool_name
      versions; newer pipeline versions may support different detected formats or
      processing capabilities
    description: Version identifier of the data processing pipeline that handled the
      event payload, indicating the specific iteration or release of the ETL/transformation
      logic applied
  payload_priority:
    business_rule: value must be one of predefined priority levels (e.g., NORMAL,
      HIGH, LOW, URGENT)
    cross_column_relationship: may influence payload_next_agent_triggered behavior
      or payload_requested_at timing
    description: Priority level assigned to the event payload, indicating urgency
      or importance of processing
  payload_processing_ms:
    business_rule: value must be a non-negative number, typically greater than 0 for
      completed processing
    cross_column_relationship: should be populated when payload_completed_at is not
      null; likely correlates with payload_raw_text_length and payload_llm_tokens_input
      (larger payloads take longer to process)
    description: Time in milliseconds taken to process the payload
  payload_quality_flag_count:
    business_rule: value must be non-negative integer; value of 0 indicates no quality
      flags
    cross_column_relationship: when payload_has_quality_flags is false, this value
      must be 0; when payload_has_quality_flags is true, this value must be greater
      than 0
    description: The count or number of quality flags raised for the payload in the
      event, indicating issues or warnings detected during processing
  payload_quality_flags_present:
    business_rule: Must be a boolean value (true/false)
    cross_column_relationship: Related to payload_facts_summary which may contain
      details about quality flags when this field is true; typically false when payload_consumed_at
      is null
    description: Indicates whether quality flags are present in the event payload,
      typically used to signal if data quality checks have been performed and flagged
      issues exist
  payload_raw_text_length:
    business_rule: value must be a non-negative number; typically an integer or float
      representing character count; NULL allowed if no text payload present
    cross_column_relationship: likely correlates with payload_processing_ms (longer
      text may take more processing time); may be NULL when payload_tables_extracted
      is NULL or zero; should be populated when payload_called_at exists
    description: The length in characters of the raw text content in the event payload,
      likely representing the size of unprocessed text data before transformation
      or analysis
  payload_recommendation:
    business_rule: value must be a predefined recommendation code from an enumerated
      set (e.g., 'PROCEED', 'APPROVE', 'REJECT', 'REVIEW'); not null
    cross_column_relationship: recommendation typically derived from payload_risk_level
      and payload_anomalies_found; should align with payload_rule_id that triggered
      the evaluation; influenced by payload_regulation_set_version rules
    description: The recommended action or decision outcome from a risk assessment
      or compliance evaluation process, indicating whether to proceed with, approve,
      or take other action on the evaluated event
  payload_reextraction_recommended:
    business_rule: value must be boolean (true/false); typically set to true when
      payload_overall_confidence is below threshold or payload_is_coherent is false
    cross_column_relationship: evaluated after payload_overall_confidence and payload_is_coherent
      are assessed; timestamp of recommendation recorded in payload_assessed_at; reasons
      documented in payload_auditor_notes
    description: Boolean flag indicating whether the payload data should be re-extracted
      due to quality issues, low confidence scores, or incoherence detected during
      assessment
  payload_regulation_set_version:
    business_rule: value must follow format YYYY-QX where YYYY is a four-digit year
      and X is 1-4 representing quarter; must not be null when payload_rule_id or
      payload_rule_name is populated
    cross_column_relationship: should be populated when payload_rule_id or payload_rule_name
      exists; versions the regulatory rules referenced in payload_rule_id and payload_rule_name;
      may correlate with payload_recommendation content
    description: The version identifier of the regulatory ruleset or compliance framework
      applied during event processing, typically formatted as year-quarter (YYYY-QX)
  payload_remediation_available:
    business_rule: Must be a boolean value (True or False)
    cross_column_relationship: Typically True when payload_failure_reason is populated
      and the failure is remediable; may correlate with payload_is_hard_block being
      False since hard blocks are generally not remediable
    description: Indicates whether remediation options are available to address the
      failure or issue that occurred in the event
  payload_requested_amount_usd:
    business_rule: value must be a positive number, typically greater than 0 and less
      than 10000000
    cross_column_relationship: must be associated with valid payload_application_id
      and payload_applicant_id; should align with payload_loan_purpose business constraints
    description: The loan or credit amount requested by the applicant in US dollars
  payload_requested_by:
    business_rule: value must be a non-empty string; commonly 'system' for automated
      events or a user identifier for user-initiated events
    cross_column_relationship: relates to payload_created_at which likely captures
      when the request was made; may correspond to a user or system identifier in
      another table
    description: The user or system actor who requested or initiated the event
  payload_revenue_trajectory:
    business_rule: 'value must be one of: STABLE, VOLATILE, RECOVERING, GROWTH, DECLINING;
      enum values are case-sensitive'
    cross_column_relationship: typically analyzed alongside payload_has_defaults to
      assess creditworthiness; may correlate with payload_has_prior_loans for underwriting
      decisions
    description: Revenue trend indicator for the entity at the time of event capture,
      representing the financial trajectory pattern
  payload_risk_level:
    business_rule: 'value must be one of: ''LOW'', ''MEDIUM'', ''HIGH'', ''CRITICAL'';
      cannot be null'
    cross_column_relationship: typically correlates with payload_fraud_score (higher
      scores map to higher risk levels) and influences payload_recommendation; may
      correlate with payload_anomalies_found count
    description: The risk classification level assigned to an event, categorizing
      the overall threat or risk assessment based on fraud analysis
  payload_rule_id:
    business_rule: value must follow pattern 'REG-' followed by 3 digits (REG-XXX),
      must not be null or empty
    cross_column_relationship: must have corresponding payload_rule_name and payload_rule_version;
      should align with payload_regulation_set_version as rules belong to regulation
      sets
    description: Unique identifier for a regulatory or compliance rule that triggered
      or is associated with the event, following a standardized naming convention
      with prefix and numeric sequence
  payload_rule_name:
    business_rule: value must be a non-empty string; should correspond to a valid
      rule name within the associated regulation set version
    cross_column_relationship: must have corresponding payload_rule_id and payload_rule_version;
      should be valid within the context of payload_regulation_set_version; may be
      used to link to payload_evidence_hash for rule evaluation evidence
    description: Name of the compliance or regulatory rule being evaluated or triggered
      in the event, such as anti-money laundering rules, sanctions checks, or eligibility
      requirements
  payload_rule_version:
    business_rule: 'Must follow format: YYYY-QN-vN where YYYY is 4-digit year, QN
      is quarter (Q1-Q4), and vN is version number starting at v1'
    cross_column_relationship: Links to payload_rule_id and payload_rule_name as versioning
      metadata; specific version may determine structure of payload_evidence_hash
      and content of payload_evaluation_notes
    description: Version identifier for the payload rule, indicating the quarterly
      release and iteration number in YYYY-QN-vN format
  payload_rules_evaluated:
    business_rule: Must be a non-negative numeric value; should equal the sum of payload_rules_passed
      and payload_rules_failed
    cross_column_relationship: payload_rules_evaluated = payload_rules_passed + payload_rules_failed
    description: The total number of business or validation rules that were evaluated
      during the event processing
  payload_rules_failed:
    business_rule: value must be non-negative integer; must be less than or equal
      to payload_rules_evaluated
    cross_column_relationship: payload_rules_evaluated = payload_rules_passed + payload_rules_failed
      + payload_rules_noted; if payload_rules_failed > 0 then payload_has_hard_block
      may be true
    description: Number of payload validation rules that failed evaluation for this
      event
  payload_rules_noted:
    business_rule: value must be non-negative numeric; typically integer >= 0
    cross_column_relationship: should be <= total rules evaluated; related to payload_rules_passed
      and payload_rules_failed as components of total rule evaluation; may influence
      payload_overall_verdict if noted rules include warnings
    description: Number of rules that were noted (informational/warning level) during
      payload validation processing, as opposed to passing or failing
  payload_rules_passed:
    business_rule: value must be non-negative integer; value <= payload_rules_evaluated
    cross_column_relationship: payload_rules_passed + payload_rules_failed + payload_rules_noted
      = payload_rules_evaluated
    description: Number of validation or business rules that passed successfully during
      event processing
  payload_screening_model_version:
    business_rule: value must be a non-empty string following the pattern of model_name-version_identifier
      (e.g., 'claude-sonnet-4-YYYYMMDD')
    cross_column_relationship: associated with payload_fraud_score output and payload_analysis_duration_ms;
      may be referenced by payload_triggered_by_event_id for model lineage tracking
    description: The version identifier of the machine learning model used for screening
      or fraud detection analysis on the event payload
  payload_session_id:
    business_rule: Must follow pattern 'sess-{type}-{8 alphanumeric characters}',
      not null, alphanumeric lowercase with hyphens only
    cross_column_relationship: Groups multiple events together; all events with same
      payload_session_id share the same payload_agent_id and payload_agent_type; session
      timestamp should fall within range defined by payload_added_at and payload_fiscal_year
    description: Unique identifier for a user or system session within the application,
      tracking a sequence of related events or interactions
  payload_submission_channel:
    business_rule: 'value must be one of predefined channels: ''web'', ''branch'',
      ''mobile'', ''phone'', ''partner''; non-null'
    cross_column_relationship: associated with payload_contact_email and payload_contact_name
      which represent the submitter's contact information; may influence validation
      requirements for payload_loan_purpose and payload_loan_term_months based on
      channel capabilities
    description: The channel or platform through which the loan application or event
      submission was received
  payload_tables_extracted:
    business_rule: value must be a non-negative number, typically an integer representing
      count of tables
    cross_column_relationship: should be null if payload_completed_at is null; value
      should be consistent with payload_raw_text_length (larger text may contain more
      tables)
    description: Number of tables extracted from the processed payload content
  payload_term_months:
    business_rule: value must be a positive number, typically in increments of 12
      (e.g., 12, 24, 36, 48, 60); should be greater than 0 and less than or equal
      to 360 months
    cross_column_relationship: should align with payload_effective_date to determine
      contract end date; may influence payload_interest_rate_pct calculation; must
      be present when payload_approved_by is not null
    description: The duration or length of the term in months for the payload, representing
      the number of months over which a loan, contract, or agreement is structured
  payload_tool_duration_ms:
    business_rule: value must be a positive number (float or integer) greater than
      0
    cross_column_relationship: should exist when payload_tool_input_summary and payload_tool_output_summary
      are present; typically correlated with payload_called_at timestamp
    description: Duration in milliseconds that a tool took to execute during an event
  payload_tool_input_summary:
    business_rule: 'value must follow pattern ''PDF extraction: {document_type}''
      where document_type is a recognized financial statement type (e.g., income_statement,
      balance_sheet, cash_flow)'
    cross_column_relationship: must correspond to a valid payload_tool_name value;
      payload_tool_output_summary should contain results related to this input type;
      payload_tool_duration_ms should be present when this field is populated
    description: Summary of the input parameters or document type being processed
      by the extraction tool, typically indicating the type of financial statement
      being extracted from PDF documents
  payload_tool_name:
    business_rule: value must be a non-empty string following naming convention pattern
      (lowercase alphanumeric with underscores)
    cross_column_relationship: relates to payload_pipeline_version for tool versioning
      and payload_extraction_model for the model used by this tool; tool_input_summary
      and tool_output_summary describe data processed by this named tool
    description: The name or identifier of the tool used to process or extract data
      within a pipeline execution event
  payload_tool_output_summary:
    business_rule: value must be non-empty string; typically follows pattern 'Extracted
      {number} {item_type}' where number is positive integer
    cross_column_relationship: dependent on payload_tool_name and payload_tool_input_summary;
      should be null if payload_tool_name is null; should correlate with payload_tool_duration_ms
      (larger extractions may take longer)
    description: Summary text describing the output result of a tool execution, specifically
      the number and type of items extracted or processed
  payload_total_cost_usd:
    business_rule: value must be a positive decimal number with precision up to 5
      decimal places; must be >= 0
    cross_column_relationship: should correlate with payload_total_tokens_used and
      payload_total_llm_calls; cost should increase proportionally with tokens used
      and number of LLM calls; should be null only if payload_total_llm_calls is 0
    description: The total cost in US dollars for processing the payload, calculated
      based on LLM API usage including tokens consumed and duration
  payload_total_duration_ms:
    business_rule: value must be a non-negative number (float or integer), typically
      greater than 0 for completed events
    cross_column_relationship: should align temporally with payload_requested_at timestamp;
      may correlate with payload_total_tokens_used and payload_total_cost_usd (longer
      duration may indicate more tokens/cost)
    description: The total duration in milliseconds for the payload execution or processing
      time
  payload_total_llm_calls:
    business_rule: value must be a non-negative integer; typically >= 1 when payload_total_tokens_used
      > 0
    cross_column_relationship: should be <= payload_total_nodes_executed; when payload_total_llm_calls
      > 0, payload_total_tokens_used and payload_total_cost_usd should also be > 0
    description: Total number of Large Language Model (LLM) API calls made during
      the event execution
  payload_total_nodes_executed:
    business_rule: value must be a non-negative integer; typically greater than 0
      for completed events
    cross_column_relationship: should correlate with payload_total_llm_calls (nodes
      executed may include LLM calls); related to payload_output_summary which aggregates
      execution results; timestamp aligned with payload_written_at
    description: The total number of nodes executed during a workflow or process run,
      representing the count of distinct processing steps or operations completed
  payload_total_tokens_used:
    business_rule: value must be a positive number; should be greater than 0 when
      payload_total_llm_calls > 0
    cross_column_relationship: should correlate with payload_total_llm_calls (more
      calls typically means more tokens) and payload_total_cost_usd (cost is typically
      derived from token usage)
    description: Total number of tokens consumed during the event execution, typically
      representing the sum of input and output tokens used across all LLM API calls
  payload_triggered_by_event_id:
    business_rule: Must be a valid hexadecimal string identifier; can be null for
      initial/root events that are not triggered by other events
    cross_column_relationship: References another event_id in the same Events table;
      should exist as a record unless it's a root event; logically precedes the current
      event's timestamp
    description: Unique identifier of the upstream event that triggered the current
      event in the event chain or workflow
  payload_uploaded_by:
    business_rule: value must be a non-empty string representing a valid user role
      or identifier
    cross_column_relationship: requires payload_file_hash to be non-null; timestamp
      should match or precede payload_uploaded_at
    description: The role or identity of the user who uploaded the file payload associated
      with this event
  payload_validation_duration_ms:
    business_rule: value must be a non-negative number; typically between 0 and 10000
      ms for normal operations
    cross_column_relationship: should equal payload_validated_at minus payload_started_at
      when both timestamps are present; null if validation did not occur
    description: Duration in milliseconds required to validate the event payload
  schema_version:
    business_rule: value must be a positive integer representing a valid schema version
    cross_column_relationship: determines which fields and format are valid for the
      event; may correlate with occurred_at or recorded_at to indicate when schema
      changes were introduced
    description: Version number of the event schema structure used to define the format
      and fields of the event data
  sequence_number:
    business_rule: Must be a positive integer starting from 1, incrementing by 1 for
      each subsequent event within the same aggregate_id
    cross_column_relationship: Must be unique within the same aggregate_id and aggregate_type
      combination; resets to 1 for each new aggregate_id
    description: The sequential order number of events within a specific aggregate
      instance, indicating the chronological position of each event in the event stream
      for that aggregate
  stream_id:
    business_rule: value must follow pattern '{entity_type}-{system}-{identifier}'
      where entity_type is alphanumeric (e.g. loan, docpkg), system is uppercase alphanumeric,
      and identifier is alphanumeric with hyphens; must not be null
    cross_column_relationship: stream_id should remain consistent across multiple
      events with different occurred_at timestamps for the same business entity lifecycle
    description: Unique identifier for the event stream, representing the business
      entity (loan or document package) and its associated identifier code
quality:
  specification:
    checks for events:
    - row_count >= 1
    - missing_count(event_id) = 0
    - duplicate_count(event_id) = 0
    - missing_count(event_type) = 0
    - missing_count(aggregate_id) = 0
    - duplicate_count(aggregate_id) = 0
    - missing_count(aggregate_type) = 0
    - missing_count(sequence_number) = 0
    - missing_count(metadata_correlation_id) = 0
    - duplicate_count(metadata_correlation_id) = 0
    - missing_count(metadata_user_id) = 0
    - missing_count(metadata_source_service) = 0
    - missing_count(schema_version) = 0
    - missing_count(occurred_at) = 0
    - missing_count(recorded_at) = 0
    - missing_count(stream_id) = 0
  type: SodaChecks
schema:
  aggregate_id:
    business_rule: Must be a valid UUID (version 4 or 5 format), non-null, and must
      be consistent across all events that belong to the same aggregate instance
    description: Unique identifier for the aggregate root entity in an event sourcing
      system, grouping related events that belong to the same domain object or entity
      instance
    required: true
    type: string
  aggregate_type:
    business_rule: value must be a non-empty string representing a valid aggregate
      type; appears to consistently be 'LoanApplication' based on sample data
    description: The type or category of the business aggregate that the event is
      associated with, representing the domain entity being tracked in the event sourcing
      pattern
    required: true
    type: string
  event_id:
    description: Column event_id
    format: uuid
    required: true
    type: string
  event_type:
    business_rule: value must be a non-null string from a predefined enumeration of
      valid event types; must follow PascalCase naming convention
    description: The type or category of event that occurred in the system, representing
      specific actions or state changes such as application submission, document requests,
      or package creation
    required: true
    type: string
  metadata_correlation_id:
    business_rule: Must be a valid UUID format (RFC 4122), cannot be null or empty
    description: Unique identifier used to correlate and track related events or transactions
      across distributed systems and services
    format: uuid
    required: true
    type: string
  metadata_source_service:
    business_rule: value must be a non-empty string following the naming pattern 'week[number]-event-sourcing-platform'
    description: The name of the source service or platform that generated or published
      the event
    required: true
    type: string
  metadata_user_id:
    business_rule: must be non-empty string; accepts user identifiers (e.g. COMP-XXX
      format) or system service names (e.g. 'system')
    description: Identifier of the user or system account that generated or triggered
      the event
    required: true
    type: string
  occurred_at:
    description: Column occurred_at
    format: date-time
    required: true
    type: string
  payload_added_at:
    description: Column payload_added_at
    format: date-time
    required: false
    type: string
  payload_adverse_action_notice_required:
    business_rule: Must be a boolean value (True/False); typically True when payload_declined_by
      or payload_declined_at is populated
    description: Indicates whether an adverse action notice is legally required to
      be sent to the customer following a negative decision or decline action
    required: false
    type: string
  payload_agent_id:
    business_rule: value must be a non-empty string following the pattern of alphanumeric
      characters with hyphens, typically in format '{type}-agent-{number}'
    description: Unique identifier for the agent that processed or handled the event,
      appears to be a document-processing agent based on the 'doc-agent' prefix
    required: false
    type: string
  payload_agent_type:
    business_rule: value must be a non-empty string from a predefined set of valid
      agent types (e.g., 'document_processing', 'data_extraction', 'classification')
    description: Type or category of agent that processed the event, indicating the
      functional role or capability of the agent handling the operation
    required: false
    type: string
  payload_all_analyses_complete:
    business_rule: value must be a boolean (True/False); non-null required field
    description: Boolean flag indicating whether all security or analysis checks have
      been completed for the event payload
    required: false
    type: string
  payload_analysis_duration_ms:
    business_rule: value must be a positive number; typically ranges from 20000 to
      50000 milliseconds
    description: Duration in milliseconds taken to complete the payload analysis process
      for the event
    maximum: 44154.0
    minimum: 16179.0
    required: false
    type: number
  payload_anomalies_found:
    business_rule: value must be a non-negative numeric value (>= 0)
    description: Number of anomalies detected in the payload during fraud analysis
      or risk assessment
    maximum: 0.0
    minimum: 0.0
    required: false
    type: number
  payload_applicant_id:
    business_rule: value must match pattern 'COMP-' followed by a 3-digit number (e.g.,
      COMP-001 to COMP-999); must not be null
    description: Unique identifier for the applicant associated with the event, using
      a standardized COMP prefix format
    required: false
    type: string
  payload_application_id:
    business_rule: value must match pattern 'APEX-' followed by 4 digits, not null
    description: Unique identifier for the application associated with this event,
      using the APEX prefix format
    required: false
    type: string
  payload_application_reference:
    business_rule: 'Must follow pattern APEX-#### where #### is a zero-padded 4-digit
      number; non-null; unique per application'
    description: A unique reference identifier or code for the application being submitted
      or processed, following the APEX prefix pattern
    required: false
    type: string
  payload_approved_amount_usd:
    business_rule: value must be a non-negative numeric value, typically greater than
      0 when populated
    description: The approved monetary amount in US dollars for a transaction, decision,
      or request captured in the event payload
    required: false
    type: string
  payload_approved_at:
    description: Column payload_approved_at
    format: date-time
    required: false
    type: string
  payload_approved_by:
    business_rule: value must be non-null; typically 'auto' for system approvals or
      a user identifier for manual approvals
    description: Identifier of the user or system that approved the payload, with
      'auto' indicating automatic approval without manual intervention
    required: false
    type: string
  payload_assessed_at:
    description: Column payload_assessed_at
    format: date-time
    required: false
    type: string
  payload_auditor_notes:
    business_rule: value must be a non-empty string when payload_is_coherent is true;
      may contain multi-sentence observations about financial data quality and consistency
      checks
    description: Free-text notes recorded by an auditor reviewing the coherence and
      accuracy of financial statement data, documenting observations about internal
      consistency, balance sheet reconciliation, and revenue trends
    required: false
    type: string
  payload_called_at:
    description: Column payload_called_at
    format: date-time
    required: false
    type: string
  payload_completed_at:
    description: Column payload_completed_at
    format: date-time
    required: false
    type: string
  payload_confidence:
    business_rule: value must be a decimal number between 0 and 1 inclusive
    description: A numerical confidence score representing the reliability or certainty
      of the event payload data, typically output from a machine learning model or
      analysis engine, ranging from 0 to 1 where higher values indicate greater confidence
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_consumed_at:
    description: Column payload_consumed_at
    format: date-time
    required: false
    type: string
  payload_contact_email:
    business_rule: Must be a valid email format containing '@' symbol and domain (e.g.,
      user@example.com); should not be null or empty
    description: Email address of the contact person associated with the event submission
      or loan application payload
    required: false
    type: string
  payload_contact_name:
    business_rule: value must be a non-empty string containing alphabetic characters
      and may include title prefixes (Mr., Mrs., Ms., Dr., etc.); typical length 2-100
      characters
    description: Full name of the contact person associated with the event submission
      or application, typically formatted with title and first/last name
    required: false
    type: string
  payload_context_source:
    business_rule: value must be a non-null string from an enumerated set of valid
      source types (e.g., 'fresh', 'cached', 'reused')
    description: Indicates the source or origin of the context data provided in the
      event payload, distinguishing between newly generated context versus cached
      or reused context
    required: false
    type: string
  payload_context_token_count:
    business_rule: value must be a positive integer greater than 0
    description: The number of tokens in the context payload for a LangGraph event,
      used to measure prompt size and API usage
    maximum: 3510.0
    minimum: 680.0
    required: false
    type: number
  payload_created_at:
    description: Column payload_created_at
    format: date-time
    required: false
    type: string
  payload_data_hash:
    business_rule: must be a 16-character hexadecimal string (64-bit hash) matching
      pattern ^[a-f0-9]{16}$
    description: A hexadecimal hash value representing a cryptographic digest or checksum
      of the payload data content, used for data integrity verification and deduplication
    required: false
    type: string
  payload_deadline:
    description: Column payload_deadline
    format: date-time
    required: false
    type: string
  payload_declined_at:
    description: Column payload_declined_at
    format: date-time
    required: false
    type: string
  payload_declined_by:
    business_rule: value must be non-null when payload_declined_at is populated; expected
      values include 'compliance-system', 'auto', 'manual-review', or system identifiers
    description: System or entity that declined the transaction or application, indicating
      the source of the rejection decision
    required: false
    type: string
  payload_detected_format:
    business_rule: value must be a valid file format string (e.g., pdf, docx, txt,
      jpg, png); cannot be null or empty
    description: The file format detected for the payload content, indicating the
      type of document being processed
    required: false
    type: string
  payload_document_format:
    business_rule: value must be a valid document format identifier (e.g., pdf, docx,
      txt, xml, json); typically lowercase alphanumeric string without special characters
    description: The file format or extension of the document included in the event
      payload
    required: false
    type: string
  payload_document_id:
    business_rule: value must match pattern 'doc-[a-z0-9]{8}' and be non-null
    description: Unique identifier for a document within the event payload, using
      a prefixed alphanumeric format
    required: false
    type: string
  payload_document_type:
    business_rule: value must be a non-empty string from a predefined set of document
      type codes; common values include 'application_proposal', 'income_statement',
      'balance_sheet'
    description: The type or category of document contained in the event payload,
      identifying the nature of the business document being processed (e.g., application
      proposal, financial statement type)
    required: false
    type: string
  payload_documents_processed:
    business_rule: value must be a non-negative number, typically a positive integer
      representing document count
    description: The number of documents that were processed as part of the event
      payload, likely representing documents reviewed or handled during an audit or
      assessment workflow
    maximum: 3.0
    minimum: 3.0
    required: false
    type: number
  payload_duration_ms:
    business_rule: value must be a non-negative number, typically between 0 and 3600000
      (1 hour)
    description: Duration in milliseconds for the payload execution or processing
      time
    maximum: 11948.0
    minimum: 87.0
    required: false
    type: number
  payload_effective_date:
    business_rule: Must be a valid date in ISO 8601 format (YYYY-MM-DD); should not
      be null if approved_at is populated; typically should be on or after approved_at
      date
    description: The date when the event payload or associated terms become effective
      or active
    required: false
    type: string
  payload_evaluated_at:
    description: Column payload_evaluated_at
    format: date-time
    required: false
    type: string
  payload_evaluation_notes:
    business_rule: 'value must be non-null string; typically follows format ''[Criterion
      Name]: [Status].'' where status includes values like ''Clear'', ''Issue'', ''Pending'',
      or ''Not Applicable'''
    description: Contains compliance and regulatory evaluation results and notes for
      each assessed criterion, documenting whether requirements like BSA, OFAC sanctions,
      jurisdiction, legal entity eligibility, and operating history checks are clear
      or have issues
    required: false
    type: string
  payload_evidence_hash:
    business_rule: value must be a valid hexadecimal string, typically 16 characters
      (64-bit hash) or 32 characters (128-bit hash), non-null
    description: Hexadecimal hash value representing cryptographic evidence or fingerprint
      of the payload data used during rule evaluation
    required: false
    type: string
  payload_executed_at:
    description: Column payload_executed_at
    format: date-time
    required: false
    type: string
  payload_executive_summary:
    business_rule: Must contain one of 'Approval recommended' or 'Decline recommended';
      must include a trajectory status (DECLINING, RECOVERING, GROWTH, STABLE); must
      include compliance status; must include fraud screening risk level
    description: A natural language summary of a credit or loan decision that includes
      the approval recommendation, business trajectory assessment, compliance status,
      and fraud risk evaluation
    required: false
    type: string
  payload_extraction_model:
    business_rule: value must follow pattern '{model_name}-{version}' where version
      is in semantic format (e.g., 1.0, 2.1.3)
    description: The name and version of the machine learning or AI model used to
      extract data from the event payload
    required: false
    type: string
  payload_facts_summary:
    business_rule: Must contain three financial metrics in the format 'Revenue $X,
      EBITDA $Y, Net Income $Z' where X, Y, Z are numeric values with comma separators;
      Revenue should be the highest value, followed by EBITDA, then Net Income
    description: A summary of key financial metrics including Revenue, EBITDA, and
      Net Income values, formatted as a comma-separated string with dollar amounts
    required: false
    type: string
  payload_failure_reason:
    business_rule: value must be a non-empty string when a failure occurs; should
      be null or empty when no failure exists; typically contains standardized failure
      reason text
    description: Describes the specific reason why a compliance or eligibility check
      failed, such as sanctions screening, BSA violations, or jurisdictional restrictions
    required: false
    type: string
  payload_file_hash:
    business_rule: Must be a non-null hexadecimal string, typically 16 characters
      in length
    description: Hash value identifier for the payload file, used for file integrity
      verification and deduplication
    required: false
    type: string
  payload_file_path:
    business_rule: Must follow pattern 'documents/{COMP-###}/{APEX-####}_{document_type}.{extension}'
      where COMP is company identifier, APEX is document identifier, and extension
      matches payload_document_format
    description: File system path or storage location reference for document files,
      organized by company identifier with a hierarchical folder structure containing
      proposals, financial statements, and supporting documents
    required: false
    type: string
  payload_file_size_bytes:
    business_rule: value must be a positive number (> 0); typically an integer representing
      file size in bytes
    description: The size of the payload file in bytes
    maximum: 379941.0
    minimum: 48329.0
    required: false
    type: number
  payload_filename:
    business_rule: Must be a non-empty string containing a valid filename with an
      extension; typically follows pattern [IDENTIFIER]_[description].[extension]
      where extension matches common document formats (pdf, xlsx, doc, etc.)
    description: The name of the file attached to or referenced in the event, typically
      representing documents such as proposals, financial statements, or spreadsheets
      associated with a specific account or transaction identifier
    required: false
    type: string
  payload_fiscal_year:
    business_rule: value must be a four-digit year (YYYY format), typically between
      2000 and 2100, can be null if fiscal year is not applicable to the event
    description: The fiscal year associated with the event payload, representing the
      financial reporting period when the event occurred or is attributed to
    maximum: 2024.0
    minimum: 2024.0
    required: false
    type: number
  payload_fraud_score:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive
    description: Numerical score indicating the probability or likelihood of fraudulent
      activity detected in the event payload, ranging from 0 (no fraud risk) to 1
      (high fraud risk)
    maximum: 0.2
    minimum: 0.07
    required: false
    type: number
  payload_generated_at:
    description: Column payload_generated_at
    format: date-time
    required: false
    type: string
  payload_has_defaults:
    business_rule: value must be boolean (True/False); not null
    description: Boolean flag indicating whether the event payload contains default
      values or uses system-assigned defaults rather than user-provided or calculated
      values
    required: false
    type: string
  payload_has_hard_block:
    business_rule: value must be boolean (True/False); typically set to True only
      when payload_overall_verdict indicates a blocking condition
    description: Boolean flag indicating whether the event payload contains a hard
      block condition that prevents processing or approval
    required: false
    type: string
  payload_has_prior_loans:
    business_rule: value must be boolean (True/False); cannot be null
    description: Boolean flag indicating whether the entity associated with this event
      has any prior loans on record
    required: false
    type: string
  payload_has_quality_flags:
    business_rule: value must be boolean (true/false); true when payload_quality_flag_count
      > 0, false when payload_quality_flag_count = 0
    description: Boolean indicator of whether quality flags exist in the payload,
      derived from the quality flag count being greater than zero
    required: false
    type: string
  payload_initiated_at:
    description: Column payload_initiated_at
    format: date-time
    required: false
    type: string
  payload_input_data_hash:
    business_rule: must be a 16-character hexadecimal string
    description: Hash value of the input data provided in the event payload, used
      for data integrity verification and deduplication
    required: false
    type: string
  payload_interest_rate_pct:
    business_rule: value must be a positive decimal number, typically between 0 and
      100, representing percentage
    description: The annual percentage rate of interest charged on a loan or financial
      product
    maximum: 8.21
    minimum: 6.08
    required: false
    type: number
  payload_is_coherent:
    business_rule: value must be boolean (True/False); non-null required field
    description: Boolean flag indicating whether the payload data is internally consistent
      and logically coherent, typically determined through validation checks or LLM
      analysis
    required: false
    type: string
  payload_is_hard_block:
    business_rule: value must be boolean (True/False); cannot be null
    description: Boolean flag indicating whether the event payload represents a hard
      block action that completely prevents or stops a process, as opposed to a soft
      block or warning
    required: false
    type: string
  payload_langgraph_graph_version:
    business_rule: 'value must follow pattern: [major].[minor].[patch] or [major].[minor].[patch]-[suffix],
      where major/minor/patch are numeric and suffix is alphanumeric'
    description: Version identifier for the LangGraph graph component used in the
      event payload, following semantic versioning format with optional environment
      suffix
    required: false
    type: string
  payload_llm_called:
    business_rule: value must be boolean (True or False)
    description: Boolean flag indicating whether a Large Language Model (LLM) was
      invoked during the execution of this event node
    required: false
    type: string
  payload_llm_cost_usd:
    business_rule: value must be a positive decimal number greater than 0, typically
      between 0.0001 and 10.0 for normal API calls
    description: The cost in US dollars charged by the LLM provider for processing
      a request, calculated based on input and output token counts and the provider's
      pricing model
    maximum: 0.0236
    minimum: 0.0068
    required: false
    type: number
  payload_llm_tokens_input:
    business_rule: value must be a positive number, typically an integer representing
      token count
    description: Number of tokens in the input prompt sent to the Large Language Model
      (LLM) for processing
    maximum: 3478.0
    minimum: 919.0
    required: false
    type: number
  payload_llm_tokens_output:
    business_rule: value must be a non-negative number, typically a positive integer
      representing token count
    description: Number of tokens generated in the output response by the large language
      model during an event
    maximum: 888.0
    minimum: 204.0
    required: false
    type: number
  payload_loan_purpose:
    business_rule: value must be a non-empty string from a predefined set of loan
      purpose categories (e.g., working_capital, acquisition, refinancing, expansion,
      equipment)
    description: The purpose or intended use of the loan funds as specified by the
      applicant in the loan application payload
    required: false
    type: string
  payload_loan_term_months:
    business_rule: value must be a positive number, typically in increments of 12
      (12, 24, 36, 48, 60, 72), and generally between 12 and 84 months
    description: The duration of the loan in months that was requested or approved,
      representing the repayment period for the loan
    maximum: 60.0
    minimum: 24.0
    required: false
    type: number
  payload_model_deployment_id:
    business_rule: value must match pattern 'dep-[a-f0-9]{8}' (prefix 'dep-' followed
      by 8 hexadecimal characters); must not be null or empty
    description: Unique identifier for the machine learning model deployment that
      processed the event, used to track which version of a model generated predictions
      or analysis results
    required: false
    type: string
  payload_model_version:
    business_rule: value must follow pattern 'claude-{model-name}-{version}-{YYYYMMDD}'
      where date represents model release version
    description: Version identifier of the AI model used in the payload, indicating
      the specific Claude Sonnet model release date
    required: false
    type: string
  payload_next_agent_triggered:
    business_rule: value must be a non-empty string representing a valid agent name;
      commonly contains values like 'credit_analysis' or other agent identifiers
    description: The identifier or name of the next agent that was triggered in the
      workflow or process flow, indicating the subsequent step in the agent chain
    required: false
    type: string
  payload_node_name:
    business_rule: value must be non-null string; should match predefined workflow
      node names from the system's pipeline configuration
    description: Name of the processing node or step in the workflow pipeline that
      generated or handled this event
    required: false
    type: string
  payload_node_sequence:
    business_rule: value must be a positive integer starting from 1
    description: Sequential order number of a node within an event processing workflow
      or pipeline
    maximum: 7.0
    minimum: 1.0
    required: false
    type: number
  payload_note_text:
    business_rule: value must be a non-empty string; typical format is a complete
      sentence with proper capitalization and punctuation
    description: Free-form text note or comment describing the outcome or details
      of a payload evaluation event, commonly used to document CRA (Community Reinvestment
      Act) qualification status or other evaluation results
    required: false
    type: string
  payload_note_type:
    business_rule: value must be a valid note type enumeration, non-null string with
      predefined categories
    description: Type or category of note associated with the event payload, specifically
      indicating CRA (Credit Risk Assessment) consideration type notes
    required: false
    type: string
  payload_opened_at:
    description: Column payload_opened_at
    format: date-time
    required: false
    type: string
  payload_orchestrator_session_id:
    business_rule: value must match pattern 'sess-dec-[a-f0-9]{8}' and cannot be null
      or empty
    description: Unique identifier for an orchestrator session that processed the
      event, following a prefixed format with 'sess-dec-' and an alphanumeric hash
    required: false
    type: string
  payload_output_summary:
    business_rule: Must be a non-empty string that typically follows the pattern '[number]
      documents processed, [confidence level]. Package ready for [next process].'
      or similar workflow completion message
    description: Human-readable summary text describing the outcome of a document
      processing workflow, including number of documents processed, confidence level,
      and next step or readiness status
    required: false
    type: string
  payload_overall_confidence:
    business_rule: value must be a decimal number between 0 and 1 inclusive (0 <=
      value <= 1)
    description: A numerical confidence score representing the overall quality or
      reliability of the payload data, likely generated by a machine learning model
      or automated validation system, with values ranging from 0 to 1 where higher
      values indicate greater confidence
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_overall_verdict:
    business_rule: 'value must be one of: CLEAR, BLOCKED, CONDITIONAL; required when
      payload_all_analyses_complete is true'
    description: Final verdict or decision status for the event payload, indicating
      whether it was cleared, blocked, or conditionally approved
    required: false
    type: string
  payload_package_id:
    business_rule: Must follow pattern 'APEX-' followed by a 4-digit zero-padded sequential
      number (e.g., APEX-0001)
    description: Unique identifier for a payload package in APEX format, used to track
      deliverable packages associated with events
    required: false
    type: string
  payload_page_count:
    business_rule: value must be a positive integer greater than 0
    description: The number of pages processed or analyzed in the event payload, typically
      representing the page count of a document or file
    maximum: 5.0
    minimum: 2.0
    required: false
    type: number
  payload_pipeline_version:
    business_rule: value must follow semantic versioning pattern in format 'week{number}-v{major}.{minor}'
      where number is positive integer and major/minor are non-negative integers
    description: Version identifier of the data processing pipeline that handled the
      event payload, indicating the specific iteration or release of the ETL/transformation
      logic applied
    required: false
    type: string
  payload_priority:
    business_rule: value must be one of predefined priority levels (e.g., NORMAL,
      HIGH, LOW, URGENT)
    description: Priority level assigned to the event payload, indicating urgency
      or importance of processing
    required: false
    type: string
  payload_processing_ms:
    business_rule: value must be a non-negative number, typically greater than 0 for
      completed processing
    description: Time in milliseconds taken to process the payload
    maximum: 7968.0
    minimum: 2274.0
    required: false
    type: number
  payload_quality_flag_count:
    business_rule: value must be non-negative integer; value of 0 indicates no quality
      flags
    description: The count or number of quality flags raised for the payload in the
      event, indicating issues or warnings detected during processing
    maximum: 0.0
    minimum: 0.0
    required: false
    type: number
  payload_quality_flags_present:
    business_rule: Must be a boolean value (true/false)
    description: Indicates whether quality flags are present in the event payload,
      typically used to signal if data quality checks have been performed and flagged
      issues exist
    required: false
    type: string
  payload_raw_text_length:
    business_rule: value must be a non-negative number; typically an integer or float
      representing character count; NULL allowed if no text payload present
    description: The length in characters of the raw text content in the event payload,
      likely representing the size of unprocessed text data before transformation
      or analysis
    maximum: 5849.0
    minimum: 2048.0
    required: false
    type: number
  payload_ready_at:
    description: Column payload_ready_at
    format: date-time
    required: false
    type: string
  payload_recommendation:
    business_rule: value must be a predefined recommendation code from an enumerated
      set (e.g., 'PROCEED', 'APPROVE', 'REJECT', 'REVIEW'); not null
    description: The recommended action or decision outcome from a risk assessment
      or compliance evaluation process, indicating whether to proceed with, approve,
      or take other action on the evaluated event
    required: false
    type: string
  payload_reextraction_recommended:
    business_rule: value must be boolean (true/false); typically set to true when
      payload_overall_confidence is below threshold or payload_is_coherent is false
    description: Boolean flag indicating whether the payload data should be re-extracted
      due to quality issues, low confidence scores, or incoherence detected during
      assessment
    required: false
    type: string
  payload_regulation_set_version:
    business_rule: value must follow format YYYY-QX where YYYY is a four-digit year
      and X is 1-4 representing quarter; must not be null when payload_rule_id or
      payload_rule_name is populated
    description: The version identifier of the regulatory ruleset or compliance framework
      applied during event processing, typically formatted as year-quarter (YYYY-QX)
    required: false
    type: string
  payload_remediation_available:
    business_rule: Must be a boolean value (True or False)
    description: Indicates whether remediation options are available to address the
      failure or issue that occurred in the event
    required: false
    type: string
  payload_requested_amount_usd:
    business_rule: value must be a positive number, typically greater than 0 and less
      than 10000000
    description: The loan or credit amount requested by the applicant in US dollars
    required: false
    type: string
  payload_requested_at:
    description: Column payload_requested_at
    format: date-time
    required: false
    type: string
  payload_requested_by:
    business_rule: value must be a non-empty string; commonly 'system' for automated
      events or a user identifier for user-initiated events
    description: The user or system actor who requested or initiated the event
    required: false
    type: string
  payload_revenue_trajectory:
    business_rule: 'value must be one of: STABLE, VOLATILE, RECOVERING, GROWTH, DECLINING;
      enum values are case-sensitive'
    description: Revenue trend indicator for the entity at the time of event capture,
      representing the financial trajectory pattern
    required: false
    type: string
  payload_risk_level:
    business_rule: 'value must be one of: ''LOW'', ''MEDIUM'', ''HIGH'', ''CRITICAL'';
      cannot be null'
    description: The risk classification level assigned to an event, categorizing
      the overall threat or risk assessment based on fraud analysis
    required: false
    type: string
  payload_rule_id:
    business_rule: value must follow pattern 'REG-' followed by 3 digits (REG-XXX),
      must not be null or empty
    description: Unique identifier for a regulatory or compliance rule that triggered
      or is associated with the event, following a standardized naming convention
      with prefix and numeric sequence
    required: false
    type: string
  payload_rule_name:
    business_rule: value must be a non-empty string; should correspond to a valid
      rule name within the associated regulation set version
    description: Name of the compliance or regulatory rule being evaluated or triggered
      in the event, such as anti-money laundering rules, sanctions checks, or eligibility
      requirements
    required: false
    type: string
  payload_rule_version:
    business_rule: 'Must follow format: YYYY-QN-vN where YYYY is 4-digit year, QN
      is quarter (Q1-Q4), and vN is version number starting at v1'
    description: Version identifier for the payload rule, indicating the quarterly
      release and iteration number in YYYY-QN-vN format
    required: false
    type: string
  payload_rules_evaluated:
    business_rule: Must be a non-negative numeric value; should equal the sum of payload_rules_passed
      and payload_rules_failed
    description: The total number of business or validation rules that were evaluated
      during the event processing
    maximum: 6.0
    minimum: 2.0
    required: false
    type: number
  payload_rules_failed:
    business_rule: value must be non-negative integer; must be less than or equal
      to payload_rules_evaluated
    description: Number of payload validation rules that failed evaluation for this
      event
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_rules_noted:
    business_rule: value must be non-negative numeric; typically integer >= 0
    description: Number of rules that were noted (informational/warning level) during
      payload validation processing, as opposed to passing or failing
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_rules_passed:
    business_rule: value must be non-negative integer; value <= payload_rules_evaluated
    description: Number of validation or business rules that passed successfully during
      event processing
    maximum: 5.0
    minimum: 1.0
    required: false
    type: number
  payload_screening_model_version:
    business_rule: value must be a non-empty string following the pattern of model_name-version_identifier
      (e.g., 'claude-sonnet-4-YYYYMMDD')
    description: The version identifier of the machine learning model used for screening
      or fraud detection analysis on the event payload
    required: false
    type: string
  payload_session_id:
    business_rule: Must follow pattern 'sess-{type}-{8 alphanumeric characters}',
      not null, alphanumeric lowercase with hyphens only
    description: Unique identifier for a user or system session within the application,
      tracking a sequence of related events or interactions
    required: false
    type: string
  payload_started_at:
    description: Column payload_started_at
    format: date-time
    required: false
    type: string
  payload_submission_channel:
    business_rule: 'value must be one of predefined channels: ''web'', ''branch'',
      ''mobile'', ''phone'', ''partner''; non-null'
    description: The channel or platform through which the loan application or event
      submission was received
    required: false
    type: string
  payload_submitted_at:
    description: Column payload_submitted_at
    format: date-time
    required: false
    type: string
  payload_tables_extracted:
    business_rule: value must be a non-negative number, typically an integer representing
      count of tables
    description: Number of tables extracted from the processed payload content
    maximum: 5.0
    minimum: 2.0
    required: false
    type: number
  payload_term_months:
    business_rule: value must be a positive number, typically in increments of 12
      (e.g., 12, 24, 36, 48, 60); should be greater than 0 and less than or equal
      to 360 months
    description: The duration or length of the term in months for the payload, representing
      the number of months over which a loan, contract, or agreement is structured
    maximum: 60.0
    minimum: 24.0
    required: false
    type: number
  payload_tool_duration_ms:
    business_rule: value must be a positive number (float or integer) greater than
      0
    description: Duration in milliseconds that a tool took to execute during an event
    maximum: 7987.0
    minimum: 58.0
    required: false
    type: number
  payload_tool_input_summary:
    business_rule: 'value must follow pattern ''PDF extraction: {document_type}''
      where document_type is a recognized financial statement type (e.g., income_statement,
      balance_sheet, cash_flow)'
    description: Summary of the input parameters or document type being processed
      by the extraction tool, typically indicating the type of financial statement
      being extracted from PDF documents
    required: false
    type: string
  payload_tool_name:
    business_rule: value must be a non-empty string following naming convention pattern
      (lowercase alphanumeric with underscores)
    description: The name or identifier of the tool used to process or extract data
      within a pipeline execution event
    required: false
    type: string
  payload_tool_output_summary:
    business_rule: value must be non-empty string; typically follows pattern 'Extracted
      {number} {item_type}' where number is positive integer
    description: Summary text describing the output result of a tool execution, specifically
      the number and type of items extracted or processed
    required: false
    type: string
  payload_total_cost_usd:
    business_rule: value must be a positive decimal number with precision up to 5
      decimal places; must be >= 0
    description: The total cost in US dollars for processing the payload, calculated
      based on LLM API usage including tokens consumed and duration
    maximum: 0.063
    minimum: 0.0
    required: false
    type: number
  payload_total_duration_ms:
    business_rule: value must be a non-negative number (float or integer), typically
      greater than 0 for completed events
    description: The total duration in milliseconds for the payload execution or processing
      time
    maximum: 54283.0
    minimum: 2456.0
    required: false
    type: number
  payload_total_llm_calls:
    business_rule: value must be a non-negative integer; typically >= 1 when payload_total_tokens_used
      > 0
    description: Total number of Large Language Model (LLM) API calls made during
      the event execution
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_total_nodes_executed:
    business_rule: value must be a non-negative integer; typically greater than 0
      for completed events
    description: The total number of nodes executed during a workflow or process run,
      representing the count of distinct processing steps or operations completed
    maximum: 7.0
    minimum: 3.0
    required: false
    type: number
  payload_total_tokens_used:
    business_rule: value must be a positive number; should be greater than 0 when
      payload_total_llm_calls > 0
    description: Total number of tokens consumed during the event execution, typically
      representing the sum of input and output tokens used across all LLM API calls
    maximum: 6997.0
    minimum: 833.0
    required: false
    type: number
  payload_triggered_by_event_id:
    business_rule: Must be a valid hexadecimal string identifier; can be null for
      initial/root events that are not triggered by other events
    description: Unique identifier of the upstream event that triggered the current
      event in the event chain or workflow
    required: false
    type: string
