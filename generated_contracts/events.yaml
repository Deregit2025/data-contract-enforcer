apiVersion: v3.0.0
id: events
info:
  description: Auto-generated contract for Events. Generated at 2026-04-05T12:07:08.603591+00:00.
  owner: events
  title: Events
  version: 1.0.0
kind: DataContract
lineage:
  downstream: []
  upstream: []
llm_annotations:
  aggregate_id:
    business_rule: Must be a valid UUID (version 4 format), cannot be null, must exist
      for every event
    cross_column_relationship: Groups multiple events with different event_ids and
      sequence_numbers; must be consistent with aggregate_type; sequence_number should
      increment per unique aggregate_id
    description: Unique identifier for the aggregate entity that the event is associated
      with, used to group related events together in an event sourcing pattern
  aggregate_type:
    business_rule: value must be a non-empty string representing a valid aggregate
      type name; appears to consistently contain 'LoanApplication' values
    cross_column_relationship: groups events for the same aggregate_id; should align
      with event_type patterns (events for a LoanApplication aggregate should be loan-related
      events)
    description: The type or category of domain aggregate that the event belongs to
      in the event sourcing system, representing the entity being tracked
  event_type:
    business_rule: value must be a non-empty string from a predefined set of valid
      event types (e.g., ApplicationSubmitted, DocumentUploadRequested, PackageCreated);
      typically follows PascalCase naming convention
    cross_column_relationship: must correspond to the aggregate_type - certain event_types
      are only valid for specific aggregate_type values; event_type determines the
      schema/structure of additional event payload data
    description: The type or category of event that occurred in the system, representing
      specific actions or state changes in a business process workflow
  metadata_correlation_id:
    business_rule: Must be a valid UUID (version 4) format with lowercase hexadecimal
      characters and hyphens in pattern 8-4-4-4-12
    cross_column_relationship: Links to metadata_source_service to trace event origin;
      may correlate with payload_application_reference for end-to-end transaction
      tracking
    description: Unique identifier used to correlate and trace related events across
      distributed systems and services
  metadata_source_service:
    business_rule: value must be a non-empty string, typically following a naming
      convention pattern like 'week[N]-event-sourcing-platform'
    cross_column_relationship: Part of event metadata alongside metadata_correlation_id
      and metadata_user_id; used to trace event origin and enable distributed tracing
      across services
    description: The name or identifier of the source service/platform that generated
      or published the event
  metadata_user_id:
    business_rule: value must be non-empty string; accepts either user identifiers
      (e.g. COMP-XXX format) or system literal for automated processes
    cross_column_relationship: typically correlates with metadata_source_service to
      indicate event origin; may be 'system' when metadata_source_service represents
      an automated service
    description: Identifier of the user or system entity that triggered or created
      the event
  payload_adverse_action_notice_required:
    business_rule: value must be boolean (True/False); typically True when payload_declined_by
      is not null
    cross_column_relationship: likely True when payload_declined_at is populated;
      correlated with payload_declined_by having a value indicating a rejection occurred
    description: Boolean flag indicating whether an adverse action notice is legally
      required to be sent to the customer following a negative decision (such as a
      decline or denial)
  payload_agent_id:
    business_rule: value must be a non-empty string following the pattern '[prefix]-agent-[number]'
      or similar identifier format
    cross_column_relationship: relates to payload_agent_type which defines the category
      of this agent; typically paired with payload_session_id to track agent activity
      within a session; may correlate with payload_model_version and payload_langgraph_graph_version
      to identify agent configuration
    description: Unique identifier for the agent that generated or handled the event,
      typically in a documentation or conversational AI system
  payload_agent_type:
    business_rule: value must be a non-empty string representing a valid agent type
      identifier; based on sample data, 'document_processing' is a valid value
    cross_column_relationship: should correspond to a specific payload_agent_id and
      may determine which payload_model_version is applicable; typically paired with
      payload_session_id to track agent activity within a session
    description: The type or category of agent that processed the event, indicating
      which automated system or service handled the payload
  payload_all_analyses_complete:
    business_rule: value must be a boolean (True/False); non-null required field
    cross_column_relationship: typically True when payload_overall_verdict is populated;
      related to payload_confidence and payload_has_hard_block as these fields depend
      on completed analyses
    description: Boolean flag indicating whether all security or compliance analyses
      have been completed for the event payload
  payload_analysis_duration_ms:
    business_rule: value must be a positive number (>0) when present; null allowed
      if analysis was skipped or not applicable
    cross_column_relationship: should only be populated when payload_model_deployment_id
      is not null; duration expected to correlate with complexity indicated by payload_input_data_hash
    description: Duration in milliseconds for analyzing the event payload, measuring
      the time taken to process and evaluate the payload data
  payload_anomalies_found:
    business_rule: value must be non-negative integer; typically 0 when no anomalies
      detected
    cross_column_relationship: relates to payload_fraud_score and payload_risk_level;
      higher anomaly count typically correlates with higher fraud score and elevated
      risk level
    description: Count of anomalies detected in the payload during fraud or risk analysis
  payload_applicant_id:
    business_rule: value must match pattern 'COMP-' followed by 3 digits, not null
    cross_column_relationship: relates to payload_application_id as an applicant may
      have multiple applications; should be present when payload_application_id exists
    description: Unique identifier for the applicant associated with the event, using
      a COMP prefix followed by a numeric code
  payload_application_id:
    business_rule: Must follow pattern 'APEX-' followed by a 4-digit numeric code
      (APEX-XXXX), non-null
    cross_column_relationship: Related to payload_applicant_id (multiple applications
      can belong to same applicant); groups events by application instance within
      aggregate_type sequence
    description: Unique identifier for the application being processed in the event
      stream
  payload_application_reference:
    business_rule: Must follow format 'APEX-' followed by a 4-digit zero-padded numeric
      sequence (e.g., APEX-0001), non-null, unique per application
    cross_column_relationship: Should correlate with metadata_correlation_id for event
      tracking; typically associated with a specific payload_contact_name and payload_submitted_at
      timestamp for each application submission
    description: Unique reference identifier for the application submitted through
      the APEX system, used to track and correlate application events
  payload_approved_amount_usd:
    business_rule: value must be a non-negative numeric value, typically greater than
      zero when present, formatted as decimal with up to 2 decimal places
    cross_column_relationship: related to payload_confidence which may indicate approval
      certainty; part of payload group with payload_orchestrator_session_id, payload_generated_at,
      and payload_executive_summary
    description: The approved monetary amount in US dollars associated with the event
      payload, representing a financial authorization or budget allocation
  payload_approved_by:
    business_rule: value must be non-null string; common values include 'auto' for
      system approvals or user identifiers for manual approvals
    cross_column_relationship: must be populated when payload_approved_at is not null;
      approval timestamp in payload_approved_at should correspond to when this approver
      acted
    description: Identifier or system name indicating who or what approved the payload,
      where 'auto' represents automated approval
  payload_auditor_notes:
    business_rule: value must be a non-empty string when audit assessment is completed;
      may contain multiple sentences describing audit findings
    cross_column_relationship: populated when payload_is_coherent is evaluated; typically
      present when payload_assessed_at is not null; may influence whether payload_reextraction_recommended
      is true or false
    description: Textual notes or comments provided by an auditor regarding the assessment
      of financial statements, including observations about internal consistency,
      balance sheet accuracy, and revenue trends
  payload_confidence:
    business_rule: value must be a decimal number between 0 and 1 inclusive
    cross_column_relationship: likely derived when payload_all_analyses_complete is
      true; may influence or be summarized in payload_executive_summary
    description: Confidence score or probability measure associated with the event
      payload, representing the degree of certainty or reliability of the analysis
      or prediction
  payload_contact_email:
    business_rule: 'Must be a valid email address format matching pattern: local-part@domain
      with proper RFC 5322 compliance'
    cross_column_relationship: Related to payload_contact_name which should contain
      the name of the same contact person; both fields typically populated together
      when payload_submission_channel indicates a user-initiated submission
    description: Email address of the contact person submitting or associated with
      the event, typically from a loan application or submission payload
  payload_contact_name:
    business_rule: Non-empty string value containing a person's name; may include
      honorifics (Mr., Mrs., Ms., Dr., etc.)
    cross_column_relationship: Associated with payload_contact_email to form complete
      contact information; part of payload submission data group including payload_submission_channel,
      payload_submitted_at, and payload_application_reference
    description: Full name of the contact person associated with the event payload,
      typically formatted as title and full name
  payload_context_source:
    business_rule: value must be a non-null string from an enumerated set of valid
      source types
    cross_column_relationship: related to payload_context_token_count which quantifies
      the context from this source; may be used in conjunction with payload_model_version
      to determine context handling strategy
    description: Indicates the source or freshness status of the context data used
      in the event payload, representing whether the context is newly generated or
      cached
  payload_context_token_count:
    business_rule: value must be a positive number, typically an integer representing
      token count
    cross_column_relationship: related to payload_context_source which likely defines
      where these tokens originate from; may influence payload_validation_duration_ms
      as larger token counts could require longer validation times
    description: The number of tokens in the context payload for language model processing
      events
  payload_data_hash:
    business_rule: must be a 16-character hexadecimal string matching pattern [a-f0-9]{16}
    cross_column_relationship: hash is computed from the combined values of payload_has_defaults,
      payload_revenue_trajectory, payload_consumed_at, and payload_facts_summary columns
    description: Hexadecimal hash value representing a unique fingerprint or checksum
      of the payload data for integrity verification and deduplication purposes
  payload_declined_by:
    business_rule: value must be a non-empty string identifying a valid declination
      source; common values include 'compliance-system', 'auto', 'manual-review',
      'risk-engine'
    cross_column_relationship: must be populated when payload_declined_at is not null;
      may influence whether payload_adverse_action_notice_required is true when declined_by
      is 'compliance-system'
    description: The system or entity that declined the payload or transaction, indicating
      which automated or manual process rejected the request
  payload_detected_format:
    business_rule: value must be a valid file format string (e.g., pdf, docx, txt,
      jpg, png); non-null; lowercase
    cross_column_relationship: should be populated when payload_executed_at is present;
      related to payload_page_count (certain formats like pdf, docx have page counts
      while images may not)
    description: The file format detected from the payload, indicating the type of
      document being processed
  payload_document_format:
    business_rule: value must be a valid document format identifier (e.g., pdf, docx,
      xlsx, txt, csv); lowercase string without leading dot
    cross_column_relationship: must align with the file extension in payload_filename
      and correspond to the document type indicated in payload_document_type
    description: The file format or extension of the document contained in the event
      payload
  payload_document_id:
    business_rule: value must match pattern 'doc-[a-z0-9]{8}' and cannot be null
    cross_column_relationship: must exist for each payload_package_id; relates to
      payload_document_type and payload_document_format which define the document's
      characteristics
    description: Unique identifier for a document within the event payload, using
      a prefixed alphanumeric format
  payload_document_type:
    business_rule: value must be a non-null string from a predefined set of valid
      document types; common values include 'application_proposal', 'income_statement',
      'balance_sheet'
    cross_column_relationship: relates to payload_document_id as the classification
      of that document; may determine expected values in payload_document_format and
      payload_filename patterns
    description: The type or category of document contained in the event payload,
      such as application proposals, financial statements (income statement, balance
      sheet), and other business documents
  payload_documents_processed:
    business_rule: value must be a non-negative number, typically a whole number representing
      document count
    cross_column_relationship: should be populated when payload_assessed_at is not
      null; may correlate with payload_quality_flag_count when quality flags are present;
      likely related to the completeness of payload_auditor_notes
    description: The number of documents that have been processed or reviewed in the
      event payload, likely related to an audit or quality assessment workflow
  payload_duration_ms:
    business_rule: value must be a non-negative number (float or integer)
    cross_column_relationship: represents the time elapsed during the execution captured
      by payload_executed_at; may correlate with payload_page_count for longer processing
      times
    description: Duration in milliseconds of the payload execution or processing time
  payload_effective_date:
    business_rule: value must be a valid date in YYYY-MM-DD format; typically must
      be greater than or equal to payload_approved_at date; should not be in the distant
      past
    cross_column_relationship: must be on or after payload_approved_at if approval
      date exists; likely used in conjunction with payload_term_months to calculate
      end date; should only be populated when payload_approved_by is not null
    description: The date when the event or transaction becomes active or takes effect,
      stored in ISO 8601 date format
  payload_evaluation_notes:
    business_rule: value must be non-empty string; typically contains structured compliance
      check results with status indicators (e.g., 'Clear'); multiple checks may be
      concatenated or stored as separate entries
    cross_column_relationship: corresponds to evaluation performed at payload_evaluated_at
      timestamp; relates to specific rule version in payload_rule_version; categorized
      by payload_note_type; may reference evidence stored via payload_evidence_hash
    description: Free-text notes documenting the evaluation results of compliance
      and eligibility checks performed on an entity or transaction, including BSA,
      OFAC sanctions, jurisdiction, legal entity, and operating history assessments
  payload_evidence_hash:
    business_rule: Must be a valid hexadecimal string of 16 characters (64-bit hash);
      cannot be null or empty
    cross_column_relationship: Related to payload_rule_name and payload_rule_version
      as the hash represents evidence for that specific rule evaluation; corresponds
      to the evaluation recorded at payload_evaluated_at
    description: A hexadecimal hash value representing the cryptographic fingerprint
      or checksum of evidence data associated with a rule evaluation event
  payload_executive_summary:
    business_rule: Must contain one of ['Approval recommended', 'Decline recommended'],
      one trajectory state from ['DECLINING', 'RECOVERING', 'GROWTH', 'STABLE'], compliance
      status, and fraud screening result in structured sentence format
    cross_column_relationship: Recommendation status correlates with payload_approved_amount_usd
      (approval likely has amount > 0, decline likely has 0 or null); trajectory and
      risk assessment inform payload_confidence score; generated alongside payload_generated_at
      timestamp
    description: Natural language summary of an approval decision event, including
      recommendation status, business trajectory assessment, compliance status, and
      fraud risk level
  payload_extraction_model:
    business_rule: value must be non-null string following pattern '{model_name}-{version}'
      where version is numeric (e.g., 'mineru-1.0')
    cross_column_relationship: relates to payload_pipeline_version for versioning
      context; should align with payload_detected_format as model capabilities may
      vary by format; typically paired with payload_tool_name for complete processing
      lineage
    description: The name and version of the machine learning or extraction model
      used to process and extract data from the event payload
  payload_facts_summary:
    business_rule: Must follow format 'Revenue $X, EBITDA $Y, Net Income $Z' where
      X, Y, Z are numeric values with comma separators; Revenue should be >= EBITDA
      >= Net Income in typical cases
    cross_column_relationship: Likely derived from payload_data_hash contents; timestamp
      of calculation may relate to payload_consumed_at; payload_quality_flags_present
      may indicate validation status of these financial figures
    description: A textual summary of key financial metrics including Revenue, EBITDA,
      and Net Income values formatted as comma-separated key-value pairs with dollar
      amounts
  payload_failure_reason:
    business_rule: value must be a non-empty string describing the specific compliance
      or risk check that failed; only populated when a failure occurs
    cross_column_relationship: only populated when payload_is_hard_block is true or
      when payload_remediation_available indicates a correctable failure; typically
      null when payload_approved_at has a value
    description: The reason why a transaction or account action failed compliance
      or risk validation checks, typically related to regulatory requirements such
      as sanctions screening, anti-money laundering (AML), or jurisdictional restrictions
  payload_file_hash:
    business_rule: Must be a non-empty hexadecimal string, typically 16 characters
      in length based on samples; required when payload_file_path is present
    cross_column_relationship: Must exist when payload_file_path is not null; should
      be unique per unique payload_file_path unless files are intentionally duplicated;
      associated with payload_file_size_bytes and payload_uploaded_at timestamp
    description: A hash identifier or checksum representing the content of the uploaded
      payload file, used for file integrity verification and deduplication
  payload_file_path:
    business_rule: Must follow pattern 'documents/{COMPANY_ID}/{DOCUMENT_ID}_{filename}.{extension}'
      where COMPANY_ID format is COMP-XXX and DOCUMENT_ID format is APEX-XXXX; path
      cannot be null or empty
    cross_column_relationship: File extension in path must match payload_document_format;
      filename portion must match payload_filename; file at this path must exist with
      size matching payload_file_size_bytes and hash matching payload_file_hash
    description: File system path to the stored document, organized hierarchically
      by company identifier and document name with file extension
  payload_file_size_bytes:
    business_rule: value must be a positive number (> 0); typically an integer; should
      not be null when payload_filename is present
    cross_column_relationship: must be null if payload_filename is null; must have
      corresponding non-null values in payload_file_path and payload_file_hash when
      populated; payload_uploaded_at should be populated when this field has a value
    description: Size of the uploaded payload file measured in bytes
  payload_filename:
    business_rule: Must be non-empty string containing valid filename characters with
      a file extension (e.g., .pdf, .xlsx); format pattern appears to be '{CLIENT_ID}_{document_type}.{extension}'
    cross_column_relationship: File extension should match payload_document_format;
      filename may correlate with payload_document_type; full path constructed with
      payload_file_path; actual file size stored in payload_file_size_bytes
    description: Name of the file attached to or referenced in the event, including
      file extension
  payload_fiscal_year:
    business_rule: value must be a four-digit year >= 2000 and <= current_year + 1,
      typically matching format YYYY
    cross_column_relationship: should be consistent with payload_added_at timestamp's
      year or fiscal year calendar; may align with payload_session_id temporal context
    description: The fiscal year associated with the event payload, representing the
      financial reporting period when the event occurred or was recorded
  payload_fraud_score:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive
    cross_column_relationship: should correspond to payload_risk_level category (e.g.,
      higher scores align with elevated risk levels) and presence of payload_anomalies_found;
      must have associated payload_screening_model_version
    description: Numerical score indicating the probability or likelihood of fraudulent
      activity detected in the payload, ranging from 0 (no fraud risk) to 1 (high
      fraud risk)
  payload_has_defaults:
    business_rule: value must be boolean (True or False); non-null
    cross_column_relationship: relates to payload_data_hash to verify data integrity;
      may influence interpretation of payload_has_prior_loans and payload_revenue_trajectory
      validity
    description: Boolean flag indicating whether the event payload contains default
      values or placeholder data rather than actual user-provided or system-generated
      values
  payload_has_hard_block:
    business_rule: value must be boolean (True/False); should only be True when payload_rules_failed
      contains blocking-level rule violations
    cross_column_relationship: typically True when payload_overall_verdict is negative/reject;
      should be False when payload_all_analyses_complete is False; mutually related
      to payload_rules_failed severity levels
    description: Boolean flag indicating whether the event payload encountered a hard
      blocking condition that prevents further processing or approval
  payload_has_prior_loans:
    business_rule: value must be boolean (True/False)
    cross_column_relationship: when True, payload_has_defaults may indicate defaults
      on those prior loans; may influence payload_priority risk assessment
    description: Boolean indicator of whether the customer had any prior loans before
      this event
  payload_has_quality_flags:
    business_rule: value must be boolean (True/False); should be False when payload_quality_flag_count
      is 0 or null, True when payload_quality_flag_count > 0
    cross_column_relationship: 'derived from payload_quality_flag_count: should be
      True if payload_quality_flag_count > 0, False if payload_quality_flag_count
      = 0 or null; typically populated after payload_assessed_at timestamp'
    description: Boolean indicator of whether the event payload contains any quality
      flags or issues
  payload_input_data_hash:
    business_rule: must be a non-null hexadecimal string of 16 characters representing
      an 8-byte hash value
    cross_column_relationship: related to payload_model_deployment_id which identifies
      the model processing this hashed input; may correspond to payload_triggered_by_event_id
      for chained events using the same input data
    description: Hash identifier of the input data payload sent to the model for processing,
      used for tracking and deduplication of inference requests
  payload_interest_rate_pct:
    business_rule: value must be a positive decimal number, typically between 0 and
      100, with up to 2 decimal places
    cross_column_relationship: relates to payload_term_months to define loan terms;
      should be present when payload_approved_by is populated indicating an approved
      financial transaction
    description: The interest rate percentage associated with the event payload, representing
      the annual percentage rate charged on a loan or financial product
  payload_is_coherent:
    business_rule: value must be boolean (True/False); typically True when overall_confidence
      is high and reextraction_recommended is False
    cross_column_relationship: related to payload_overall_confidence (high confidence
      typically means coherent=True), payload_reextraction_recommended (incoherent
      payloads often trigger reextraction), and payload_auditor_notes (may contain
      details when False)
    description: Boolean flag indicating whether the payload data is internally consistent
      and logically coherent, as determined by validation or LLM analysis
  payload_is_hard_block:
    business_rule: value must be boolean (True or False); cannot be null
    cross_column_relationship: when True, payload_approved_at is typically null and
      payload_failure_reason should be populated; when False, payload_approved_at
      may be populated or payload_remediation_available may be True
    description: Indicates whether the event represents a hard block action, preventing
      the operation from proceeding, as opposed to a soft warning or approval
  payload_langgraph_graph_version:
    business_rule: value must follow semantic versioning pattern (MAJOR.MINOR.PATCH)
      optionally followed by hyphen and environment suffix (e.g., -sim, -prod); must
      not be null or empty
    cross_column_relationship: should align with payload_model_version compatibility
      matrix; typically paired with payload_agent_id to track which graph versions
      are deployed for specific agents
    description: Version identifier of the LangGraph graph framework used in the event
      payload, following semantic versioning with optional suffixes for environment
      designation
  payload_llm_called:
    business_rule: value must be boolean (True or False); non-null required
    cross_column_relationship: when True, payload_duration_ms is typically higher
      due to LLM processing time; correlates with payload_node_name containing LLM-related
      operations
    description: Boolean flag indicating whether a Large Language Model (LLM) was
      invoked during the execution of this event node
  payload_llm_cost_usd:
    business_rule: value must be a non-negative decimal number with precision up to
      6 decimal places; typically greater than 0 for successful LLM calls
    cross_column_relationship: derived from payload_llm_tokens_input and payload_llm_tokens_output
      using provider-specific pricing rates; should be null or 0 if both token columns
      are null or 0
    description: The cost in US dollars charged for the LLM API call, calculated based
      on input and output token usage
  payload_llm_tokens_input:
    business_rule: value must be a positive number, typically an integer representing
      token count
    cross_column_relationship: used with payload_llm_tokens_output to calculate total
      tokens; contributes to payload_llm_cost_usd calculation; should be populated
      when payload_completed_at is not null
    description: Number of tokens sent as input to the Large Language Model (LLM)
      for processing during this event
  payload_llm_tokens_output:
    business_rule: value must be a non-negative number, typically an integer representing
      token count
    cross_column_relationship: combined with payload_llm_tokens_input to calculate
      total tokens; may be used with payload_llm_cost_usd to determine output token
      pricing; should be populated when payload_completed_at is not null
    description: Number of tokens generated by the LLM in the output/response for
      this event
  payload_loan_purpose:
    business_rule: value must be a non-null string from predefined set of loan purpose
      categories (e.g., 'working_capital', 'acquisition', 'equipment', 'expansion',
      'refinancing')
    cross_column_relationship: required when payload_requested_amount_usd is present;
      may influence validation rules for payload_loan_term_months based on purpose
      type
    description: The intended purpose or reason for the loan being requested by the
      applicant, indicating how the borrowed funds will be used
  payload_loan_term_months:
    business_rule: value must be a positive number, typically in common loan term
      increments (12, 24, 36, 48, 60 months)
    cross_column_relationship: Related to payload_requested_amount_usd to determine
      monthly payment amounts; longer terms typically associated with larger loan
      amounts
    description: The duration of the requested loan in months, representing the repayment
      period
  payload_model_deployment_id:
    business_rule: value must match pattern 'dep-[a-f0-9]{8}' (deployment prefix followed
      by 8-character hexadecimal identifier); not null
    cross_column_relationship: references a model deployment that produces payload_facts_summary
      and payload_quality_flags_present; impacts payload_analysis_duration_ms performance
      characteristics
    description: Unique identifier for the machine learning model deployment version
      that generated or processed this event
  payload_model_version:
    business_rule: value must follow pattern 'claude-{model-family}-{tier}-{YYYYMMDD}'
      where model-family is text, tier is numeric, and date is valid YYYYMMDD format
    cross_column_relationship: should be populated when payload_agent_type indicates
      an AI agent; version should align with capabilities referenced in payload_agent_id
      and payload_langgraph_graph_version
    description: The version identifier of the AI model used to process or generate
      the event payload, following Claude's versioning scheme with model family, capability
      tier, and release date
  payload_next_agent_triggered:
    business_rule: value must be a non-empty string representing a valid agent identifier;
      commonly uses snake_case naming convention
    cross_column_relationship: logically follows payload_requested_at timestamp; may
      be filtered by payload_priority level; execution may impact payload_total_duration_ms
      and payload_total_cost_usd
    description: Identifies the next agent or workflow step that was triggered in
      the event sequence, typically representing the downstream process or handler
      invoked after the current event
  payload_node_name:
    business_rule: value must be non-empty string; typically one of a predefined set
      of node names in the processing workflow
    cross_column_relationship: corresponds to payload_node_sequence which indicates
      the order of execution; execution may trigger payload_llm_called and affect
      payload_validation_duration_ms timing
    description: Name of the workflow node or processing step being executed in the
      event pipeline
  payload_node_sequence:
    business_rule: value must be a positive integer starting from 1
    cross_column_relationship: relates to payload_node_name as the sequence number
      for that specific node; should increment within the same event chain or workflow
      execution
    description: The sequential order or position of a node in a processing pipeline
      or workflow execution
  payload_note_text:
    business_rule: Must be a non-empty string when payload_note_type is populated;
      typically contains human-readable explanatory text about the evaluation result
    cross_column_relationship: Associated with payload_note_type which likely categorizes
      the note; content relates to payload_rules_evaluated and payload_rules_passed
      results; timestamp corresponds to payload_evaluated_at
    description: Free-text note or explanation describing the outcome or details of
      an evaluation event, particularly related to CRA (Community Reinvestment Act)
      compliance assessments
  payload_note_type:
    business_rule: value must be a predefined note type code from an enumerated list;
      non-null when payload_note_text is present
    cross_column_relationship: associated with payload_note_text which contains the
      actual note content; relates to payload_evaluated_at timestamp and payload_evaluation_notes
      for complete evaluation context
    description: Type classification of evaluation notes in the event payload, indicating
      the category or purpose of the note (e.g., CRA_CONSIDERATION for Credit Reporting
      Agency considerations)
  payload_orchestrator_session_id:
    business_rule: Must match pattern 'sess-dec-[a-f0-9]{8}' where the suffix is an
      8-character lowercase hexadecimal string
    cross_column_relationship: Groups related events within the same decision orchestration
      session; events with the same session_id share common payload_overall_verdict
      and payload_confidence values
    description: Unique identifier for an orchestrator session tracking a decision
      workflow or event processing sequence, prefixed with 'sess-dec-' followed by
      an 8-character hexadecimal hash
  payload_output_summary:
    business_rule: 'Non-empty text string typically following pattern: ''[count] documents
      processed, [confidence level]. Package ready for [process type].'''
    cross_column_relationship: Generated after payload_written_at timestamp; confidence
      level may correlate with payload_quality_flag_count; readiness status relates
      to payload_ready_at timestamp
    description: Human-readable summary of document processing output, including document
      count, confidence level, and readiness status for downstream analysis
  payload_overall_confidence:
    business_rule: value must be a decimal number between 0 and 1 inclusive
    cross_column_relationship: likely influences payload_reextraction_recommended
      (lower confidence may trigger re-extraction); may be derived from or correlated
      with payload_is_coherent and other payload quality metrics
    description: A numerical confidence score representing the overall quality or
      reliability of the payload, typically generated by a machine learning model
      or LLM evaluation system, with values ranging from 0 to 1 where higher values
      indicate greater confidence
  payload_overall_verdict:
    business_rule: 'value must be one of: CLEAR, BLOCKED, CONDITIONAL; must not be
      null when payload_all_analyses_complete is true'
    cross_column_relationship: verdict is BLOCKED when payload_has_hard_block is true;
      verdict determination depends on evaluation of payload_rules_noted; should only
      be set when payload_all_analyses_complete is true; associated with payload_orchestrator_session_id
      for traceability
    description: Final security or compliance verdict assigned to the event payload
      after all analysis rules have been evaluated, determining whether the payload
      should be allowed, blocked, or conditionally processed
  payload_package_id:
    business_rule: Must follow format 'APEX-' followed by a 4-digit zero-padded number
      (e.g., APEX-0001)
    cross_column_relationship: Should have corresponding entries in payload_document_id;
      likely created after payload_requested_by timestamp and before payload_deadline
    description: Unique identifier for the package or shipment associated with the
      event, using APEX prefix followed by a sequential number
  payload_page_count:
    business_rule: value must be a positive integer greater than 0
    cross_column_relationship: should be present when payload_detected_format indicates
      a document type (PDF, DOCX, etc.); may correlate with payload_duration_ms (higher
      page count may result in longer processing time)
    description: Number of pages in the document or file being processed in the event
      payload
  payload_pipeline_version:
    business_rule: value must follow pattern 'week{number}-v{major}.{minor}' format
      and cannot be null
    cross_column_relationship: version should correspond to compatible values in payload_detected_format,
      payload_extraction_model, and payload_tool_name based on pipeline capabilities
      at that version
    description: Version identifier of the data pipeline used to process and generate
      the event payload, following a week-based versioning scheme
  payload_priority:
    business_rule: value must be a valid priority level from enumerated set (e.g.,
      'NORMAL', 'HIGH', 'LOW', 'URGENT')
    cross_column_relationship: may influence payload_next_agent_triggered and payload_requested_at
      timing; higher priority events typically processed before lower priority ones
    description: Priority level assigned to the event payload, indicating the urgency
      or importance of processing
  payload_processing_ms:
    business_rule: value must be a non-negative number (float or integer), typically
      greater than 0 for completed processing events
    cross_column_relationship: should be derived from payload_completed_at minus a
      start timestamp; likely correlates with payload_raw_text_length and payload_llm_tokens_input
      (larger inputs may result in longer processing times); should be null or 0 if
      payload_completed_at is null
    description: Time in milliseconds taken to process the payload, measuring the
      duration of payload processing operations
  payload_quality_flag_count:
    business_rule: value must be a non-negative number (>= 0); typically an integer
      but may be float; should be 0 when payload_has_quality_flags is false
    cross_column_relationship: when payload_quality_flag_count > 0, payload_has_quality_flags
      should be true; when count = 0, payload_has_quality_flags should be false; only
      populated after payload_ready_at timestamp is set
    description: The numeric count of quality flags raised during payload processing,
      indicating the number of data quality issues or anomalies detected
  payload_quality_flags_present:
    business_rule: value must be boolean (true/false)
    cross_column_relationship: when true, quality flags should be available in payload_facts_summary
      or related payload fields; related to payload_consumed_at timestamp and payload_model_deployment_id
      context
    description: Boolean flag indicating whether quality flags are present in the
      event payload data
  payload_raw_text_length:
    business_rule: value must be a non-negative number (integer or float); typically
      greater than 0 when text is present
    cross_column_relationship: likely correlated with payload_processing_ms (larger
      text may take longer to process); may be null when no text content is available
      or before payload_tables_extracted processing occurs
    description: Length of the raw text content in the event payload, measured in
      number of characters
  payload_recommendation:
    business_rule: value must be a non-null string from an enumerated set of valid
      recommendation codes (e.g., PROCEED, APPROVE, REJECT, REVIEW, ESCALATE)
    cross_column_relationship: derived from payload_risk_level and payload_anomalies_found;
      typically PROCEED when risk_level is low and no anomalies found, may vary based
      on payload_regulation_set_version rules identified by payload_rule_id
    description: The recommended action or decision resulting from a risk assessment
      or compliance evaluation process, indicating whether to proceed with, approve,
      or take other action on a transaction or event
  payload_reextraction_recommended:
    business_rule: value must be boolean (True/False); defaults to False when payload
      quality is acceptable
    cross_column_relationship: typically set to True when payload_overall_confidence
      is below threshold or payload_is_coherent is False; evaluated during assessment
      indicated by payload_assessed_at timestamp; may be documented in payload_auditor_notes
    description: Boolean flag indicating whether the payload data should be re-extracted,
      likely based on quality assessment metrics such as low confidence scores or
      coherence issues
  payload_regulation_set_version:
    business_rule: value must match pattern YYYY-Q[1-4] where YYYY is a valid year
      and Q is followed by 1, 2, 3, or 4
    cross_column_relationship: associated with payload_rule_id and payload_rule_name
      which define specific rules within this regulation set version
    description: Version identifier of the regulatory rule set used for compliance
      evaluation, formatted as year-quarter
  payload_remediation_available:
    business_rule: Must be a boolean value (True or False)
    cross_column_relationship: Typically True when payload_failure_reason is populated
      and payload_is_hard_block is False, indicating a soft failure that can be remediated
    description: Indicates whether remediation options are available to resolve the
      issue or failure that occurred in the event
  payload_requested_amount_usd:
    business_rule: value must be positive numeric, typically greater than 0, may contain
      decimal places for cents
    cross_column_relationship: relates to payload_application_id and payload_applicant_id;
      amount should align with payload_loan_purpose and be consistent with payload_loan_term_months
      duration constraints
    description: The loan amount requested by the applicant in US dollars for the
      application event
  payload_requested_by:
    business_rule: value must be a non-empty string representing a valid requester
      identifier
    cross_column_relationship: relates to payload_created_at as the requester at time
      of creation; may link to a user or system identifier table
    description: The user or system entity that requested or initiated the event
  payload_revenue_trajectory:
    business_rule: 'value must be one of: STABLE, VOLATILE, RECOVERING, GROWTH, DECLINE'
    cross_column_relationship: typically analyzed alongside payload_has_defaults and
      payload_has_prior_loans to assess financial risk profile
    description: Categorical indicator of the revenue trend pattern for the event
      payload, representing the financial trajectory status
  payload_risk_level:
    business_rule: 'value must be one of: LOW, MEDIUM, HIGH, CRITICAL; cannot be null'
    cross_column_relationship: correlates with payload_fraud_score (higher scores
      map to higher risk levels) and payload_anomalies_found (more anomalies typically
      increase risk level); influences payload_recommendation
    description: Risk classification level assigned to the event payload, indicating
      the severity or likelihood of fraudulent or anomalous activity
  payload_rule_id:
    business_rule: value must be non-null string following pattern of alphanumeric
      code with hyphen separator (e.g. REG-###), typically 3-20 characters in length
    cross_column_relationship: must have corresponding payload_rule_name and payload_rule_version;
      should align with payload_regulation_set_version as rules belong to regulation
      sets
    description: Unique identifier for a regulatory or business rule that triggered
      or is associated with the event, following a standardized rule identification
      format
  payload_rule_name:
    business_rule: value must be non-empty string; should correspond to a valid rule
      name in the regulatory framework
    cross_column_relationship: must have corresponding payload_rule_id and payload_rule_version;
      should align with payload_regulation_set_version; may reference evidence in
      payload_evidence_hash
    description: The name of the compliance or regulatory rule that triggered or is
      associated with this event, indicating which specific policy or regulation was
      evaluated
  payload_rule_version:
    business_rule: Must follow format YYYY-Q#-v# where YYYY is year, Q# is quarter
      (1-4), and v# is version number
    cross_column_relationship: Associated with payload_rule_id and payload_rule_name
      as part of the rule metadata trio; version changes should correlate with rule_id
      or rule_name changes
    description: Version identifier for the payload rule, indicating the quarter and
      iteration of the rule definition used during event processing
  payload_rules_evaluated:
    business_rule: value must be a non-negative integer; should equal the sum of payload_rules_passed
      and payload_rules_failed
    cross_column_relationship: payload_rules_evaluated = payload_rules_passed + payload_rules_failed
    description: The total number of rules that were evaluated or processed during
      the event, likely representing validation or business logic rules applied to
      the payload
  payload_rules_failed:
    business_rule: value must be a non-negative number; value <= payload_rules_evaluated;
      payload_rules_failed + payload_rules_passed + payload_rules_noted = payload_rules_evaluated
    cross_column_relationship: must be less than or equal to payload_rules_evaluated;
      when payload_rules_failed > 0, payload_has_hard_block may be true depending
      on rule severity
    description: Number of payload validation rules that failed during event processing
  payload_rules_noted:
    business_rule: value must be non-negative numeric; typically integer or float
      representing count
    cross_column_relationship: should be <= (payload_rules_passed + payload_rules_failed
      + payload_rules_noted) as total rules evaluated; rules_noted do not contribute
      to hard blocks; when payload_has_hard_block=1, this may still have positive
      values
    description: Number of rules that were noted (informational/warning level) during
      payload validation, not blocking but flagged for attention
  payload_rules_passed:
    business_rule: value must be a non-negative integer; should be less than or equal
      to payload_rules_evaluated
    cross_column_relationship: payload_rules_passed + payload_rules_failed + payload_rules_noted
      should equal payload_rules_evaluated
    description: The number of business rules or validation checks that successfully
      passed during event processing
  payload_screening_model_version:
    business_rule: value must be a non-empty string following the pattern of model-name
      followed by ISO date format (YYYYMMDD)
    cross_column_relationship: related to payload_fraud_score (determines which model
      produced the score) and payload_analysis_duration_ms (model version may impact
      processing time)
    description: The version identifier of the machine learning model used for screening
      or fraud detection analysis on the payload
  payload_session_id:
    business_rule: Must follow format 'sess-{product/type}-{alphanumeric hash}', non-null,
      typically 8 character hash suffix
    cross_column_relationship: Groups multiple events together; should correspond
      to same payload_agent_id within a session; payload_added_at timestamps should
      be sequential within same session_id
    description: Unique identifier for a user or system session, tracking a sequence
      of related events or interactions within the application
  payload_submission_channel:
    business_rule: 'value must be one of predefined channels: ''web'', ''branch'',
      ''mobile'', ''phone'', ''partner''; not null'
    cross_column_relationship: relates to payload_contact_email and payload_contact_name
      to track submission origin; branch submissions may require additional verification
      fields
    description: The channel or medium through which the loan application or event
      payload was submitted by the user
  payload_tables_extracted:
    business_rule: value must be a non-negative integer
    cross_column_relationship: should be populated when payload_completed_at is not
      null; relates to payload_processing_ms duration
    description: Number of tables extracted from the payload during processing
  payload_term_months:
    business_rule: value must be a positive number, typically in increments of 12
      (12, 24, 36, 48, 60), representing standard loan term periods
    cross_column_relationship: related to payload_effective_date to calculate loan
      maturity date; must be present when payload_interest_rate_pct is provided
    description: The loan or payment term duration expressed in months
  payload_tool_duration_ms:
    business_rule: value must be a non-negative number; typically between 0 and 300000
      (5 minutes); null allowed if tool was not executed
    cross_column_relationship: should be null if payload_tool_input_summary and payload_tool_output_summary
      are both null; should have corresponding payload_called_at timestamp when present
    description: Duration in milliseconds that a tool took to execute, measured from
      invocation to completion
  payload_tool_input_summary:
    business_rule: 'value must follow pattern ''PDF extraction: {document_type}''
      where document_type is a non-empty string'
    cross_column_relationship: relates to payload_tool_name (which likely contains
      the tool identifier) and payload_tool_output_summary (which contains the corresponding
      extraction results); payload_tool_duration_ms measures the processing time for
      this input
    description: Summary or identifier of the input provided to a PDF extraction tool,
      indicating the type of financial document being processed (e.g., income statement,
      balance sheet)
  payload_tool_name:
    business_rule: value must be a non-empty string following naming pattern '[stage]_[process]_[type]'
    cross_column_relationship: relates to payload_pipeline_version for versioning;
      provides context for payload_tool_input_summary and payload_tool_output_summary;
      may be used with payload_extraction_model to identify the complete processing
      configuration
    description: Name of the tool or pipeline used to process the event, typically
      identifying a specific extraction or processing workflow
  payload_tool_output_summary:
    business_rule: Non-empty string value that summarizes the tool's output; commonly
      follows pattern 'Extracted [count] [item type]'
    cross_column_relationship: Related to payload_tool_name which identifies the tool
      that generated this output; payload_tool_duration_ms indicates how long it took
      to produce this result; payload_called_at shows when this output was generated
    description: Summary text describing the output result of a tool execution, typically
      indicating the number and type of items extracted or processed
  payload_total_cost_usd:
    business_rule: value must be non-negative numeric with precision up to 5 decimal
      places; typically ranges between 0.001 and 10.0 for standard operations
    cross_column_relationship: derived from payload_total_tokens_used and payload_total_llm_calls;
      should be zero when payload_total_llm_calls is zero; should correlate proportionally
      with payload_total_tokens_used
    description: The total cost in US dollars for the payload processing, calculated
      based on LLM API usage including tokens consumed and API calls made
  payload_total_duration_ms:
    business_rule: value must be a non-negative number (float or integer), typically
      greater than 0 for completed events
    cross_column_relationship: should be calculated as time difference related to
      payload_requested_at timestamp; may correlate with payload_total_tokens_used
      (higher tokens may indicate longer duration)
    description: Total duration in milliseconds for the payload execution or processing
      time from start to completion
  payload_total_llm_calls:
    business_rule: value must be a non-negative integer; should be >= 1 when payload_total_tokens_used
      > 0
    cross_column_relationship: should be <= payload_total_nodes_executed; when payload_total_llm_calls
      > 0 then payload_total_tokens_used should be > 0 and payload_total_cost_usd
      should be > 0
    description: Total number of Large Language Model API calls made during the event
      execution
  payload_total_nodes_executed:
    business_rule: value must be a positive integer greater than or equal to 1
    cross_column_relationship: should be correlated with payload_total_llm_calls and
      payload_total_tokens_used; higher nodes executed may indicate more LLM calls
      and tokens; must be populated when payload_output_summary or payload_written_at
      is present
    description: The total number of nodes executed in a workflow or graph-based process
      during an event, likely tracking the execution path through a decision tree,
      AI agent workflow, or computational graph
  payload_total_tokens_used:
    business_rule: value must be a positive number, typically an integer or float
      greater than 0
    cross_column_relationship: should correlate with payload_total_llm_calls (more
      calls typically means more tokens) and payload_total_cost_usd (cost is typically
      derived from token usage)
    description: Total number of tokens consumed during the execution of an event,
      representing the cumulative token usage across all LLM calls made
  payload_triggered_by_event_id:
    business_rule: Must be a valid hexadecimal string identifier; nullable for root/initial
      events that are not triggered by other events
    cross_column_relationship: References another event_id in the same Events table;
      should be null for events initiated by payload_input_data_hash without a preceding
      event
    description: Unique identifier of the upstream event that triggered or initiated
      the current event in the event chain
  payload_uploaded_by:
    business_rule: value must be a valid user role identifier; non-null string
    cross_column_relationship: should have a corresponding value when payload_file_hash
      or payload_uploaded_at is present; relates to file upload metadata columns
    description: The role or type of user who uploaded the file payload associated
      with this event
  payload_validation_duration_ms:
    business_rule: value must be a non-negative number; typically between 0 and 10000
      ms for normal operations
    cross_column_relationship: should equal (payload_validated_at - payload_started_at)
      converted to milliseconds; may be null if validation did not complete
    description: The duration in milliseconds taken to validate the event payload
  schema_version:
    business_rule: value must be a positive integer string representing the schema
      version number
    cross_column_relationship: schema version determines the structure and available
      fields for the event record; may correlate with occurred_at timestamp as newer
      events typically use higher schema versions
    description: Version number of the event schema format used to structure the event
      data, allowing for backward compatibility and schema evolution tracking
  sequence_number:
    business_rule: Must be a positive integer starting from 1, incrementing sequentially
      for each event within the same aggregate_id
    cross_column_relationship: Must be unique within the combination of aggregate_id
      and aggregate_type; resets to 1 for each new aggregate_id
    description: Sequential order number of events within an aggregate, tracking the
      chronological position of each event in the event stream for a specific aggregate
      instance
  stream_id:
    business_rule: 'Format must match pattern: {entity_type}-{system}-{sequence_number},
      where entity_type is ''loan'' or ''docpkg'', system is uppercase alphanumeric
      (e.g. ''APEX''), and sequence_number is zero-padded numeric'
    cross_column_relationship: Groups multiple events together when same stream_id
      appears across rows; chronological ordering typically determined by occurred_at
      timestamp
    description: Unique identifier for the business entity stream, representing either
      a loan or document package, prefixed with entity type and system identifier
quality:
  specification:
    checks for events:
    - row_count >= 1
    - missing_count(event_id) = 0
    - duplicate_count(event_id) = 0
    - missing_count(event_type) = 0
    - missing_count(aggregate_id) = 0
    - duplicate_count(aggregate_id) = 0
    - missing_count(aggregate_type) = 0
    - missing_count(sequence_number) = 0
    - missing_count(metadata_correlation_id) = 0
    - duplicate_count(metadata_correlation_id) = 0
    - missing_count(metadata_user_id) = 0
    - missing_count(metadata_source_service) = 0
    - missing_count(schema_version) = 0
    - missing_count(occurred_at) = 0
    - missing_count(recorded_at) = 0
    - missing_count(stream_id) = 0
  type: SodaChecks
schema:
  aggregate_id:
    business_rule: Must be a valid UUID (version 4 format), cannot be null, must exist
      for every event
    description: Unique identifier for the aggregate entity that the event is associated
      with, used to group related events together in an event sourcing pattern
    required: true
    type: string
  aggregate_type:
    business_rule: value must be a non-empty string representing a valid aggregate
      type name; appears to consistently contain 'LoanApplication' values
    description: The type or category of domain aggregate that the event belongs to
      in the event sourcing system, representing the entity being tracked
    required: true
    type: string
  event_id:
    description: Column event_id
    format: uuid
    required: true
    type: string
  event_type:
    business_rule: value must be a non-empty string from a predefined set of valid
      event types (e.g., ApplicationSubmitted, DocumentUploadRequested, PackageCreated);
      typically follows PascalCase naming convention
    description: The type or category of event that occurred in the system, representing
      specific actions or state changes in a business process workflow
    required: true
    type: string
  metadata_correlation_id:
    business_rule: Must be a valid UUID (version 4) format with lowercase hexadecimal
      characters and hyphens in pattern 8-4-4-4-12
    description: Unique identifier used to correlate and trace related events across
      distributed systems and services
    format: uuid
    required: true
    type: string
  metadata_source_service:
    business_rule: value must be a non-empty string, typically following a naming
      convention pattern like 'week[N]-event-sourcing-platform'
    description: The name or identifier of the source service/platform that generated
      or published the event
    required: true
    type: string
  metadata_user_id:
    business_rule: value must be non-empty string; accepts either user identifiers
      (e.g. COMP-XXX format) or system literal for automated processes
    description: Identifier of the user or system entity that triggered or created
      the event
    required: true
    type: string
  occurred_at:
    description: Column occurred_at
    format: date-time
    required: true
    type: string
  payload_added_at:
    description: Column payload_added_at
    format: date-time
    required: false
    type: string
  payload_adverse_action_notice_required:
    business_rule: value must be boolean (True/False); typically True when payload_declined_by
      is not null
    description: Boolean flag indicating whether an adverse action notice is legally
      required to be sent to the customer following a negative decision (such as a
      decline or denial)
    required: false
    type: string
  payload_agent_id:
    business_rule: value must be a non-empty string following the pattern '[prefix]-agent-[number]'
      or similar identifier format
    description: Unique identifier for the agent that generated or handled the event,
      typically in a documentation or conversational AI system
    required: false
    type: string
  payload_agent_type:
    business_rule: value must be a non-empty string representing a valid agent type
      identifier; based on sample data, 'document_processing' is a valid value
    description: The type or category of agent that processed the event, indicating
      which automated system or service handled the payload
    required: false
    type: string
  payload_all_analyses_complete:
    business_rule: value must be a boolean (True/False); non-null required field
    description: Boolean flag indicating whether all security or compliance analyses
      have been completed for the event payload
    required: false
    type: string
  payload_analysis_duration_ms:
    business_rule: value must be a positive number (>0) when present; null allowed
      if analysis was skipped or not applicable
    description: Duration in milliseconds for analyzing the event payload, measuring
      the time taken to process and evaluate the payload data
    maximum: 44154.0
    minimum: 16179.0
    required: false
    type: number
  payload_anomalies_found:
    business_rule: value must be non-negative integer; typically 0 when no anomalies
      detected
    description: Count of anomalies detected in the payload during fraud or risk analysis
    maximum: 0.0
    minimum: 0.0
    required: false
    type: number
  payload_applicant_id:
    business_rule: value must match pattern 'COMP-' followed by 3 digits, not null
    description: Unique identifier for the applicant associated with the event, using
      a COMP prefix followed by a numeric code
    required: false
    type: string
  payload_application_id:
    business_rule: Must follow pattern 'APEX-' followed by a 4-digit numeric code
      (APEX-XXXX), non-null
    description: Unique identifier for the application being processed in the event
      stream
    required: false
    type: string
  payload_application_reference:
    business_rule: Must follow format 'APEX-' followed by a 4-digit zero-padded numeric
      sequence (e.g., APEX-0001), non-null, unique per application
    description: Unique reference identifier for the application submitted through
      the APEX system, used to track and correlate application events
    required: false
    type: string
  payload_approved_amount_usd:
    business_rule: value must be a non-negative numeric value, typically greater than
      zero when present, formatted as decimal with up to 2 decimal places
    description: The approved monetary amount in US dollars associated with the event
      payload, representing a financial authorization or budget allocation
    required: false
    type: string
  payload_approved_at:
    description: Column payload_approved_at
    format: date-time
    required: false
    type: string
  payload_approved_by:
    business_rule: value must be non-null string; common values include 'auto' for
      system approvals or user identifiers for manual approvals
    description: Identifier or system name indicating who or what approved the payload,
      where 'auto' represents automated approval
    required: false
    type: string
  payload_assessed_at:
    description: Column payload_assessed_at
    format: date-time
    required: false
    type: string
  payload_auditor_notes:
    business_rule: value must be a non-empty string when audit assessment is completed;
      may contain multiple sentences describing audit findings
    description: Textual notes or comments provided by an auditor regarding the assessment
      of financial statements, including observations about internal consistency,
      balance sheet accuracy, and revenue trends
    required: false
    type: string
  payload_called_at:
    description: Column payload_called_at
    format: date-time
    required: false
    type: string
  payload_completed_at:
    description: Column payload_completed_at
    format: date-time
    required: false
    type: string
  payload_confidence:
    business_rule: value must be a decimal number between 0 and 1 inclusive
    description: Confidence score or probability measure associated with the event
      payload, representing the degree of certainty or reliability of the analysis
      or prediction
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_consumed_at:
    description: Column payload_consumed_at
    format: date-time
    required: false
    type: string
  payload_contact_email:
    business_rule: 'Must be a valid email address format matching pattern: local-part@domain
      with proper RFC 5322 compliance'
    description: Email address of the contact person submitting or associated with
      the event, typically from a loan application or submission payload
    required: false
    type: string
  payload_contact_name:
    business_rule: Non-empty string value containing a person's name; may include
      honorifics (Mr., Mrs., Ms., Dr., etc.)
    description: Full name of the contact person associated with the event payload,
      typically formatted as title and full name
    required: false
    type: string
  payload_context_source:
    business_rule: value must be a non-null string from an enumerated set of valid
      source types
    description: Indicates the source or freshness status of the context data used
      in the event payload, representing whether the context is newly generated or
      cached
    required: false
    type: string
  payload_context_token_count:
    business_rule: value must be a positive number, typically an integer representing
      token count
    description: The number of tokens in the context payload for language model processing
      events
    maximum: 3510.0
    minimum: 680.0
    required: false
    type: number
  payload_created_at:
    description: Column payload_created_at
    format: date-time
    required: false
    type: string
  payload_data_hash:
    business_rule: must be a 16-character hexadecimal string matching pattern [a-f0-9]{16}
    description: Hexadecimal hash value representing a unique fingerprint or checksum
      of the payload data for integrity verification and deduplication purposes
    required: false
    type: string
  payload_deadline:
    description: Column payload_deadline
    format: date-time
    required: false
    type: string
  payload_declined_at:
    description: Column payload_declined_at
    format: date-time
    required: false
    type: string
  payload_declined_by:
    business_rule: value must be a non-empty string identifying a valid declination
      source; common values include 'compliance-system', 'auto', 'manual-review',
      'risk-engine'
    description: The system or entity that declined the payload or transaction, indicating
      which automated or manual process rejected the request
    required: false
    type: string
  payload_detected_format:
    business_rule: value must be a valid file format string (e.g., pdf, docx, txt,
      jpg, png); non-null; lowercase
    description: The file format detected from the payload, indicating the type of
      document being processed
    required: false
    type: string
  payload_document_format:
    business_rule: value must be a valid document format identifier (e.g., pdf, docx,
      xlsx, txt, csv); lowercase string without leading dot
    description: The file format or extension of the document contained in the event
      payload
    required: false
    type: string
  payload_document_id:
    business_rule: value must match pattern 'doc-[a-z0-9]{8}' and cannot be null
    description: Unique identifier for a document within the event payload, using
      a prefixed alphanumeric format
    required: false
    type: string
  payload_document_type:
    business_rule: value must be a non-null string from a predefined set of valid
      document types; common values include 'application_proposal', 'income_statement',
      'balance_sheet'
    description: The type or category of document contained in the event payload,
      such as application proposals, financial statements (income statement, balance
      sheet), and other business documents
    required: false
    type: string
  payload_documents_processed:
    business_rule: value must be a non-negative number, typically a whole number representing
      document count
    description: The number of documents that have been processed or reviewed in the
      event payload, likely related to an audit or quality assessment workflow
    maximum: 3.0
    minimum: 3.0
    required: false
    type: number
  payload_duration_ms:
    business_rule: value must be a non-negative number (float or integer)
    description: Duration in milliseconds of the payload execution or processing time
    maximum: 11948.0
    minimum: 87.0
    required: false
    type: number
  payload_effective_date:
    business_rule: value must be a valid date in YYYY-MM-DD format; typically must
      be greater than or equal to payload_approved_at date; should not be in the distant
      past
    description: The date when the event or transaction becomes active or takes effect,
      stored in ISO 8601 date format
    required: false
    type: string
  payload_evaluated_at:
    description: Column payload_evaluated_at
    format: date-time
    required: false
    type: string
  payload_evaluation_notes:
    business_rule: value must be non-empty string; typically contains structured compliance
      check results with status indicators (e.g., 'Clear'); multiple checks may be
      concatenated or stored as separate entries
    description: Free-text notes documenting the evaluation results of compliance
      and eligibility checks performed on an entity or transaction, including BSA,
      OFAC sanctions, jurisdiction, legal entity, and operating history assessments
    required: false
    type: string
  payload_evidence_hash:
    business_rule: Must be a valid hexadecimal string of 16 characters (64-bit hash);
      cannot be null or empty
    description: A hexadecimal hash value representing the cryptographic fingerprint
      or checksum of evidence data associated with a rule evaluation event
    required: false
    type: string
  payload_executed_at:
    description: Column payload_executed_at
    format: date-time
    required: false
    type: string
  payload_executive_summary:
    business_rule: Must contain one of ['Approval recommended', 'Decline recommended'],
      one trajectory state from ['DECLINING', 'RECOVERING', 'GROWTH', 'STABLE'], compliance
      status, and fraud screening result in structured sentence format
    description: Natural language summary of an approval decision event, including
      recommendation status, business trajectory assessment, compliance status, and
      fraud risk level
    required: false
    type: string
  payload_extraction_model:
    business_rule: value must be non-null string following pattern '{model_name}-{version}'
      where version is numeric (e.g., 'mineru-1.0')
    description: The name and version of the machine learning or extraction model
      used to process and extract data from the event payload
    required: false
    type: string
  payload_facts_summary:
    business_rule: Must follow format 'Revenue $X, EBITDA $Y, Net Income $Z' where
      X, Y, Z are numeric values with comma separators; Revenue should be >= EBITDA
      >= Net Income in typical cases
    description: A textual summary of key financial metrics including Revenue, EBITDA,
      and Net Income values formatted as comma-separated key-value pairs with dollar
      amounts
    required: false
    type: string
  payload_failure_reason:
    business_rule: value must be a non-empty string describing the specific compliance
      or risk check that failed; only populated when a failure occurs
    description: The reason why a transaction or account action failed compliance
      or risk validation checks, typically related to regulatory requirements such
      as sanctions screening, anti-money laundering (AML), or jurisdictional restrictions
    required: false
    type: string
  payload_file_hash:
    business_rule: Must be a non-empty hexadecimal string, typically 16 characters
      in length based on samples; required when payload_file_path is present
    description: A hash identifier or checksum representing the content of the uploaded
      payload file, used for file integrity verification and deduplication
    required: false
    type: string
  payload_file_path:
    business_rule: Must follow pattern 'documents/{COMPANY_ID}/{DOCUMENT_ID}_{filename}.{extension}'
      where COMPANY_ID format is COMP-XXX and DOCUMENT_ID format is APEX-XXXX; path
      cannot be null or empty
    description: File system path to the stored document, organized hierarchically
      by company identifier and document name with file extension
    required: false
    type: string
  payload_file_size_bytes:
    business_rule: value must be a positive number (> 0); typically an integer; should
      not be null when payload_filename is present
    description: Size of the uploaded payload file measured in bytes
    maximum: 379941.0
    minimum: 48329.0
    required: false
    type: number
  payload_filename:
    business_rule: Must be non-empty string containing valid filename characters with
      a file extension (e.g., .pdf, .xlsx); format pattern appears to be '{CLIENT_ID}_{document_type}.{extension}'
    description: Name of the file attached to or referenced in the event, including
      file extension
    required: false
    type: string
  payload_fiscal_year:
    business_rule: value must be a four-digit year >= 2000 and <= current_year + 1,
      typically matching format YYYY
    description: The fiscal year associated with the event payload, representing the
      financial reporting period when the event occurred or was recorded
    maximum: 2024.0
    minimum: 2024.0
    required: false
    type: number
  payload_fraud_score:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive
    description: Numerical score indicating the probability or likelihood of fraudulent
      activity detected in the payload, ranging from 0 (no fraud risk) to 1 (high
      fraud risk)
    maximum: 0.2
    minimum: 0.07
    required: false
    type: number
  payload_generated_at:
    description: Column payload_generated_at
    format: date-time
    required: false
    type: string
  payload_has_defaults:
    business_rule: value must be boolean (True or False); non-null
    description: Boolean flag indicating whether the event payload contains default
      values or placeholder data rather than actual user-provided or system-generated
      values
    required: false
    type: string
  payload_has_hard_block:
    business_rule: value must be boolean (True/False); should only be True when payload_rules_failed
      contains blocking-level rule violations
    description: Boolean flag indicating whether the event payload encountered a hard
      blocking condition that prevents further processing or approval
    required: false
    type: string
  payload_has_prior_loans:
    business_rule: value must be boolean (True/False)
    description: Boolean indicator of whether the customer had any prior loans before
      this event
    required: false
    type: string
  payload_has_quality_flags:
    business_rule: value must be boolean (True/False); should be False when payload_quality_flag_count
      is 0 or null, True when payload_quality_flag_count > 0
    description: Boolean indicator of whether the event payload contains any quality
      flags or issues
    required: false
    type: string
  payload_initiated_at:
    description: Column payload_initiated_at
    format: date-time
    required: false
    type: string
  payload_input_data_hash:
    business_rule: must be a non-null hexadecimal string of 16 characters representing
      an 8-byte hash value
    description: Hash identifier of the input data payload sent to the model for processing,
      used for tracking and deduplication of inference requests
    required: false
    type: string
  payload_interest_rate_pct:
    business_rule: value must be a positive decimal number, typically between 0 and
      100, with up to 2 decimal places
    description: The interest rate percentage associated with the event payload, representing
      the annual percentage rate charged on a loan or financial product
    maximum: 8.21
    minimum: 6.08
    required: false
    type: number
  payload_is_coherent:
    business_rule: value must be boolean (True/False); typically True when overall_confidence
      is high and reextraction_recommended is False
    description: Boolean flag indicating whether the payload data is internally consistent
      and logically coherent, as determined by validation or LLM analysis
    required: false
    type: string
  payload_is_hard_block:
    business_rule: value must be boolean (True or False); cannot be null
    description: Indicates whether the event represents a hard block action, preventing
      the operation from proceeding, as opposed to a soft warning or approval
    required: false
    type: string
  payload_langgraph_graph_version:
    business_rule: value must follow semantic versioning pattern (MAJOR.MINOR.PATCH)
      optionally followed by hyphen and environment suffix (e.g., -sim, -prod); must
      not be null or empty
    description: Version identifier of the LangGraph graph framework used in the event
      payload, following semantic versioning with optional suffixes for environment
      designation
    required: false
    type: string
  payload_llm_called:
    business_rule: value must be boolean (True or False); non-null required
    description: Boolean flag indicating whether a Large Language Model (LLM) was
      invoked during the execution of this event node
    required: false
    type: string
  payload_llm_cost_usd:
    business_rule: value must be a non-negative decimal number with precision up to
      6 decimal places; typically greater than 0 for successful LLM calls
    description: The cost in US dollars charged for the LLM API call, calculated based
      on input and output token usage
    maximum: 0.0236
    minimum: 0.0068
    required: false
    type: number
  payload_llm_tokens_input:
    business_rule: value must be a positive number, typically an integer representing
      token count
    description: Number of tokens sent as input to the Large Language Model (LLM)
      for processing during this event
    maximum: 3478.0
    minimum: 919.0
    required: false
    type: number
  payload_llm_tokens_output:
    business_rule: value must be a non-negative number, typically an integer representing
      token count
    description: Number of tokens generated by the LLM in the output/response for
      this event
    maximum: 888.0
    minimum: 204.0
    required: false
    type: number
  payload_loan_purpose:
    business_rule: value must be a non-null string from predefined set of loan purpose
      categories (e.g., 'working_capital', 'acquisition', 'equipment', 'expansion',
      'refinancing')
    description: The intended purpose or reason for the loan being requested by the
      applicant, indicating how the borrowed funds will be used
    required: false
    type: string
  payload_loan_term_months:
    business_rule: value must be a positive number, typically in common loan term
      increments (12, 24, 36, 48, 60 months)
    description: The duration of the requested loan in months, representing the repayment
      period
    maximum: 60.0
    minimum: 24.0
    required: false
    type: number
  payload_model_deployment_id:
    business_rule: value must match pattern 'dep-[a-f0-9]{8}' (deployment prefix followed
      by 8-character hexadecimal identifier); not null
    description: Unique identifier for the machine learning model deployment version
      that generated or processed this event
    required: false
    type: string
  payload_model_version:
    business_rule: value must follow pattern 'claude-{model-family}-{tier}-{YYYYMMDD}'
      where model-family is text, tier is numeric, and date is valid YYYYMMDD format
    description: The version identifier of the AI model used to process or generate
      the event payload, following Claude's versioning scheme with model family, capability
      tier, and release date
    required: false
    type: string
  payload_next_agent_triggered:
    business_rule: value must be a non-empty string representing a valid agent identifier;
      commonly uses snake_case naming convention
    description: Identifies the next agent or workflow step that was triggered in
      the event sequence, typically representing the downstream process or handler
      invoked after the current event
    required: false
    type: string
  payload_node_name:
    business_rule: value must be non-empty string; typically one of a predefined set
      of node names in the processing workflow
    description: Name of the workflow node or processing step being executed in the
      event pipeline
    required: false
    type: string
  payload_node_sequence:
    business_rule: value must be a positive integer starting from 1
    description: The sequential order or position of a node in a processing pipeline
      or workflow execution
    maximum: 7.0
    minimum: 1.0
    required: false
    type: number
  payload_note_text:
    business_rule: Must be a non-empty string when payload_note_type is populated;
      typically contains human-readable explanatory text about the evaluation result
    description: Free-text note or explanation describing the outcome or details of
      an evaluation event, particularly related to CRA (Community Reinvestment Act)
      compliance assessments
    required: false
    type: string
  payload_note_type:
    business_rule: value must be a predefined note type code from an enumerated list;
      non-null when payload_note_text is present
    description: Type classification of evaluation notes in the event payload, indicating
      the category or purpose of the note (e.g., CRA_CONSIDERATION for Credit Reporting
      Agency considerations)
    required: false
    type: string
  payload_opened_at:
    description: Column payload_opened_at
    format: date-time
    required: false
    type: string
  payload_orchestrator_session_id:
    business_rule: Must match pattern 'sess-dec-[a-f0-9]{8}' where the suffix is an
      8-character lowercase hexadecimal string
    description: Unique identifier for an orchestrator session tracking a decision
      workflow or event processing sequence, prefixed with 'sess-dec-' followed by
      an 8-character hexadecimal hash
    required: false
    type: string
  payload_output_summary:
    business_rule: 'Non-empty text string typically following pattern: ''[count] documents
      processed, [confidence level]. Package ready for [process type].'''
    description: Human-readable summary of document processing output, including document
      count, confidence level, and readiness status for downstream analysis
    required: false
    type: string
  payload_overall_confidence:
    business_rule: value must be a decimal number between 0 and 1 inclusive
    description: A numerical confidence score representing the overall quality or
      reliability of the payload, typically generated by a machine learning model
      or LLM evaluation system, with values ranging from 0 to 1 where higher values
      indicate greater confidence
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_overall_verdict:
    business_rule: 'value must be one of: CLEAR, BLOCKED, CONDITIONAL; must not be
      null when payload_all_analyses_complete is true'
    description: Final security or compliance verdict assigned to the event payload
      after all analysis rules have been evaluated, determining whether the payload
      should be allowed, blocked, or conditionally processed
    required: false
    type: string
  payload_package_id:
    business_rule: Must follow format 'APEX-' followed by a 4-digit zero-padded number
      (e.g., APEX-0001)
    description: Unique identifier for the package or shipment associated with the
      event, using APEX prefix followed by a sequential number
    required: false
    type: string
  payload_page_count:
    business_rule: value must be a positive integer greater than 0
    description: Number of pages in the document or file being processed in the event
      payload
    maximum: 5.0
    minimum: 2.0
    required: false
    type: number
  payload_pipeline_version:
    business_rule: value must follow pattern 'week{number}-v{major}.{minor}' format
      and cannot be null
    description: Version identifier of the data pipeline used to process and generate
      the event payload, following a week-based versioning scheme
    required: false
    type: string
  payload_priority:
    business_rule: value must be a valid priority level from enumerated set (e.g.,
      'NORMAL', 'HIGH', 'LOW', 'URGENT')
    description: Priority level assigned to the event payload, indicating the urgency
      or importance of processing
    required: false
    type: string
  payload_processing_ms:
    business_rule: value must be a non-negative number (float or integer), typically
      greater than 0 for completed processing events
    description: Time in milliseconds taken to process the payload, measuring the
      duration of payload processing operations
    maximum: 7968.0
    minimum: 2274.0
    required: false
    type: number
  payload_quality_flag_count:
    business_rule: value must be a non-negative number (>= 0); typically an integer
      but may be float; should be 0 when payload_has_quality_flags is false
    description: The numeric count of quality flags raised during payload processing,
      indicating the number of data quality issues or anomalies detected
    maximum: 0.0
    minimum: 0.0
    required: false
    type: number
  payload_quality_flags_present:
    business_rule: value must be boolean (true/false)
    description: Boolean flag indicating whether quality flags are present in the
      event payload data
    required: false
    type: string
  payload_raw_text_length:
    business_rule: value must be a non-negative number (integer or float); typically
      greater than 0 when text is present
    description: Length of the raw text content in the event payload, measured in
      number of characters
    maximum: 5849.0
    minimum: 2048.0
    required: false
    type: number
  payload_ready_at:
    description: Column payload_ready_at
    format: date-time
    required: false
    type: string
  payload_recommendation:
    business_rule: value must be a non-null string from an enumerated set of valid
      recommendation codes (e.g., PROCEED, APPROVE, REJECT, REVIEW, ESCALATE)
    description: The recommended action or decision resulting from a risk assessment
      or compliance evaluation process, indicating whether to proceed with, approve,
      or take other action on a transaction or event
    required: false
    type: string
  payload_reextraction_recommended:
    business_rule: value must be boolean (True/False); defaults to False when payload
      quality is acceptable
    description: Boolean flag indicating whether the payload data should be re-extracted,
      likely based on quality assessment metrics such as low confidence scores or
      coherence issues
    required: false
    type: string
  payload_regulation_set_version:
    business_rule: value must match pattern YYYY-Q[1-4] where YYYY is a valid year
      and Q is followed by 1, 2, 3, or 4
    description: Version identifier of the regulatory rule set used for compliance
      evaluation, formatted as year-quarter
    required: false
    type: string
  payload_remediation_available:
    business_rule: Must be a boolean value (True or False)
    description: Indicates whether remediation options are available to resolve the
      issue or failure that occurred in the event
    required: false
    type: string
  payload_requested_amount_usd:
    business_rule: value must be positive numeric, typically greater than 0, may contain
      decimal places for cents
    description: The loan amount requested by the applicant in US dollars for the
      application event
    required: false
    type: string
  payload_requested_at:
    description: Column payload_requested_at
    format: date-time
    required: false
    type: string
  payload_requested_by:
    business_rule: value must be a non-empty string representing a valid requester
      identifier
    description: The user or system entity that requested or initiated the event
    required: false
    type: string
  payload_revenue_trajectory:
    business_rule: 'value must be one of: STABLE, VOLATILE, RECOVERING, GROWTH, DECLINE'
    description: Categorical indicator of the revenue trend pattern for the event
      payload, representing the financial trajectory status
    required: false
    type: string
  payload_risk_level:
    business_rule: 'value must be one of: LOW, MEDIUM, HIGH, CRITICAL; cannot be null'
    description: Risk classification level assigned to the event payload, indicating
      the severity or likelihood of fraudulent or anomalous activity
    required: false
    type: string
  payload_rule_id:
    business_rule: value must be non-null string following pattern of alphanumeric
      code with hyphen separator (e.g. REG-###), typically 3-20 characters in length
    description: Unique identifier for a regulatory or business rule that triggered
      or is associated with the event, following a standardized rule identification
      format
    required: false
    type: string
  payload_rule_name:
    business_rule: value must be non-empty string; should correspond to a valid rule
      name in the regulatory framework
    description: The name of the compliance or regulatory rule that triggered or is
      associated with this event, indicating which specific policy or regulation was
      evaluated
    required: false
    type: string
  payload_rule_version:
    business_rule: Must follow format YYYY-Q#-v# where YYYY is year, Q# is quarter
      (1-4), and v# is version number
    description: Version identifier for the payload rule, indicating the quarter and
      iteration of the rule definition used during event processing
    required: false
    type: string
  payload_rules_evaluated:
    business_rule: value must be a non-negative integer; should equal the sum of payload_rules_passed
      and payload_rules_failed
    description: The total number of rules that were evaluated or processed during
      the event, likely representing validation or business logic rules applied to
      the payload
    maximum: 6.0
    minimum: 2.0
    required: false
    type: number
  payload_rules_failed:
    business_rule: value must be a non-negative number; value <= payload_rules_evaluated;
      payload_rules_failed + payload_rules_passed + payload_rules_noted = payload_rules_evaluated
    description: Number of payload validation rules that failed during event processing
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_rules_noted:
    business_rule: value must be non-negative numeric; typically integer or float
      representing count
    description: Number of rules that were noted (informational/warning level) during
      payload validation, not blocking but flagged for attention
    maximum: 1.0
    minimum: 0.0
    required: false
    type: number
  payload_rules_passed:
    business_rule: value must be a non-negative integer; should be less than or equal
      to payload_rules_evaluated
    description: The number of business rules or validation checks that successfully
      passed during event processing
    maximum: 5.0
    minimum: 1.0
    required: false
    type: number
  payload_screening_model_version:
    business_rule: value must be a non-empty string following the pattern of model-name
      followed by ISO date format (YYYYMMDD)
    description: The version identifier of the machine learning model used for screening
      or fraud detection analysis on the payload
    required: false
    type: string
  payload_session_id:
    business_rule: Must follow format 'sess-{product/type}-{alphanumeric hash}', non-null,
      typically 8 character hash suffix
    description: Unique identifier for a user or system session, tracking a sequence
      of related events or interactions within the application
    required: false
    type: string
  payload_started_at:
    description: Column payload_started_at
    format: date-time
    required: false
    type: string
  payload_submission_channel:
    business_rule: 'value must be one of predefined channels: ''web'', ''branch'',
      ''mobile'', ''phone'', ''partner''; not null'
    description: The channel or medium through which the loan application or event
      payload was submitted by the user
    required: false
    type: string
  payload_submitted_at:
    description: Column payload_submitted_at
    format: date-time
    required: false
    type: string
  payload_tables_extracted:
    business_rule: value must be a non-negative integer
    description: Number of tables extracted from the payload during processing
    maximum: 5.0
    minimum: 2.0
    required: false
    type: number
  payload_term_months:
    business_rule: value must be a positive number, typically in increments of 12
      (12, 24, 36, 48, 60), representing standard loan term periods
    description: The loan or payment term duration expressed in months
    maximum: 60.0
    minimum: 24.0
    required: false
    type: number
  payload_tool_duration_ms:
    business_rule: value must be a non-negative number; typically between 0 and 300000
      (5 minutes); null allowed if tool was not executed
    description: Duration in milliseconds that a tool took to execute, measured from
      invocation to completion
    maximum: 7987.0
    minimum: 58.0
    required: false
    type: number
  payload_tool_input_summary:
    business_rule: 'value must follow pattern ''PDF extraction: {document_type}''
      where document_type is a non-empty string'
    description: Summary or identifier of the input provided to a PDF extraction tool,
      indicating the type of financial document being processed (e.g., income statement,
      balance sheet)
    required: false
    type: string
  payload_tool_name:
    business_rule: value must be a non-empty string following naming pattern '[stage]_[process]_[type]'
    description: Name of the tool or pipeline used to process the event, typically
      identifying a specific extraction or processing workflow
    required: false
    type: string
  payload_tool_output_summary:
