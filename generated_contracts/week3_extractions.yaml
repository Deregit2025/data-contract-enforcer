kind: DataContract
lineage:
  downstream:
  - breaking_if_changed:
    - extracted_facts.confidence
    - doc_id
    description: Cartographer ingests doc_id and extracted_facts as node metadata
    fields_consumed:
    - doc_id
    - extracted_facts
    - extraction_model
    id: week4-cartographer
  upstream: []
llm_annotations:
  doc_name:
    business_rule: value must be a non-empty string, typically containing alphanumeric
      characters, hyphens, underscores, and spaces; should represent a valid document
      identifier
    cross_column_relationship: serves as the source identifier for the extraction
      record; extracted_at timestamp indicates when this document was processed; is_synthetic
      flag may indicate if doc_name refers to a real or generated test document
    description: The name or title of the document from which data was extracted,
      typically representing official reports, audits, surveys, or annual statements
  entities_count:
    business_rule: value must be a non-negative integer; value should be 0 or greater;
      typically correlates with document length and complexity
    cross_column_relationship: should be >= 0; may correlate with extracted_facts_page_ref_max
      - extracted_facts_page_ref_min (larger page ranges may yield more entities);
      processing_time_ms may increase with higher entities_count; extraction_model
      determines what qualifies as an entity
    description: The total count of distinct entities extracted from a document during
      the extraction process, such as names, organizations, locations, dates, or other
      structured data elements identified by the extraction model
  extracted_facts_confidence_max:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive; should be
      greater than or equal to extracted_facts_confidence_mean and extracted_facts_confidence_min
    cross_column_relationship: must be >= extracted_facts_confidence_mean; must be
      >= extracted_facts_confidence_min; typically correlates with extraction quality
      metrics
    description: Maximum confidence score across all facts extracted from a document,
      representing the highest certainty level the extraction model had for any single
      fact
  extracted_facts_confidence_mean:
    business_rule: value must be a decimal between 0 and 1 inclusive; should be greater
      than or equal to extracted_facts_confidence_min and less than or equal to extracted_facts_confidence_max
    cross_column_relationship: 'must satisfy: extracted_facts_confidence_min <= extracted_facts_confidence_mean
      <= extracted_facts_confidence_max; should be null when extracted_facts_count
      is 0 or null'
    description: The average confidence score of all facts extracted from a document,
      representing the mean certainty level across all extracted data points
  extracted_facts_confidence_min:
    business_rule: value must be a decimal between 0.0 and 1.0 inclusive; should be
      less than or equal to extracted_facts_confidence_mean and extracted_facts_confidence_max;
      should be null if extracted_facts_count is 0
    cross_column_relationship: must be <= extracted_facts_confidence_mean <= extracted_facts_confidence_max;
      should only have a value when extracted_facts_count > 0
    description: The minimum confidence score among all facts extracted from a document,
      representing the lowest certainty level for any individual fact extraction in
      the record
  extracted_facts_count:
    business_rule: value must be a non-negative integer; should be 0 or greater
    cross_column_relationship: must be consistent with extracted_facts_confidence_mean
      and extracted_facts_confidence_min - if extracted_facts_count is 0, confidence
      metrics should be null; if greater than 0, confidence metrics should have values
    description: The total number of facts extracted from a source document during
      the refinery process
  extracted_facts_page_ref_max:
    business_rule: value must be a positive integer and greater than or equal to extracted_facts_page_ref_min
      and extracted_facts_page_ref_mean
    cross_column_relationship: must be >= extracted_facts_page_ref_mean and >= extracted_facts_page_ref_min;
      should be null only if both mean and min are also null
    description: Maximum page reference number among all extracted facts from the
      document, indicating the highest page number where facts were found
  extracted_facts_page_ref_mean:
    business_rule: value must be a positive number; should be >= extracted_facts_page_ref_min
      and <= extracted_facts_page_ref_max when those columns are populated
    cross_column_relationship: must fall between extracted_facts_page_ref_min and
      extracted_facts_page_ref_max; null only if no facts were extracted or page references
      are unavailable
    description: The average (mean) page reference number across all facts extracted
      from a document, indicating the typical page location where facts were found
  extracted_facts_page_ref_min:
    business_rule: value must be a positive integer greater than or equal to 1, not
      null when facts are extracted
    cross_column_relationship: must be less than or equal to extracted_facts_page_ref_mean
      and extracted_facts_page_ref_max; should correlate with entities_count > 0 when
      facts exist
    description: The minimum page reference number from which facts were extracted
      in a document, indicating the earliest page containing extracted information
  extraction_model:
    business_rule: value must be a non-empty string following the pattern of model-name
      followed by date version (e.g., 'gpt-4o-YYYY-MM-DD')
    cross_column_relationship: directly influences processing_time_ms and token_count_input
      as different models have different processing characteristics and tokenization
      methods
    description: The name and version identifier of the AI model used to extract information
      from documents, specifying which GPT model performed the extraction
  is_synthetic:
    business_rule: value must be a boolean (True or False)
    cross_column_relationship: may correlate with doc_name containing synthetic identifiers;
      extracted_at timestamp indicates when synthetic data was created
    description: Boolean flag indicating whether the document or record was synthetically
      generated rather than being a real-world document
  token_count_input:
    business_rule: value must be positive integer greater than 0
    cross_column_relationship: should be less than or equal to extraction_model's
      maximum context window; typically greater than token_count_output; correlates
      with processing_time_ms
    description: Number of tokens in the input document sent to the extraction model
      for processing
  token_count_output:
    business_rule: value must be a positive integer greater than 0
    cross_column_relationship: should be compared with token_count_input to calculate
      token expansion/compression ratio; must have corresponding extracted_at timestamp
    description: Number of tokens generated in the output by the document extraction
      process
