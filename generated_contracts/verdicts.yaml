llm_annotations:
  confidence:
    business_rule: value must be a decimal number between 0.0 and 1.0 inclusive
    cross_column_relationship: associated with overall_verdict and overall_score;
      higher confidence values should correlate with more definitive verdict outcomes
    description: A numerical score between 0 and 1 representing the level of certainty
      or confidence in the overall verdict assessment
  is_synthetic:
    business_rule: value must be a boolean (True/False)
    cross_column_relationship: May correlate with confidence levels - synthetic verdicts
      might have different confidence patterns than real ones; evaluated_at tracks
      when the synthetic verdict was created
    description: Boolean flag indicating whether the verdict was generated synthetically
      or from real data
  overall_score:
    business_rule: value must be a decimal number between 0 and 5, typically rounded
      to one decimal place
    cross_column_relationship: should correspond to the overall_verdict column where
      higher scores indicate more positive verdicts; must have a corresponding rubric_version
      that defines the scoring scale; should be populated when overall_verdict is
      present
    description: Numerical score representing the overall assessment or rating from
      an evaluation, likely an average or aggregate of multiple criteria scores
  overall_verdict:
    business_rule: 'value must be one of: ''PASS'', ''FAIL'', ''WARN''; cannot be
      null'
    cross_column_relationship: derived from overall_score against rubric_id thresholds;
      typically FAIL for low scores, WARN for medium scores, PASS for high scores;
      associated with specific rubric_version
    description: The final assessment outcome indicating whether the evaluated item
      passed, failed, or triggered a warning based on the rubric criteria and overall
      score
  rubric_version:
    business_rule: value must follow semantic versioning pattern (e.g., MAJOR.MINOR.PATCH
      like 3.0.0), must not be null
    cross_column_relationship: must correspond to a valid version of the rubric identified
      by rubric_id; version determines scoring criteria used for overall_score and
      overall_verdict
    description: Version number of the rubric used to evaluate and generate the verdict,
      following semantic versioning format
  target_ref:
    business_rule: must be a valid string path or reference identifier; cannot be
      empty; typically follows file system path convention or repository naming pattern
    cross_column_relationship: linked to rubric_id and rubric_version to associate
      the target with specific evaluation criteria; verdict_id serves as the primary
      key for this verdict record
    description: File path or repository reference that the verdict applies to, representing
      the target entity being evaluated against the rubric
  verdict_id:
    business_rule: Must be a valid UUID (version 4) format with 36 characters including
      hyphens, non-null, and unique across all records
    cross_column_relationship: Primary key that may be referenced by target_ref in
      related tables; associates with rubric_id to link verdicts to specific evaluation
      rubrics
    description: Unique identifier for each verdict record, serving as the primary
      key for the Verdicts table
